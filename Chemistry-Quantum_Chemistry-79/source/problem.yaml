problem_id: "Chemistry-Quantum_Chemistry-79"
subject: "chemistry"
subject_area: "Quantum Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1039/d6sc03887e"
dependencies: ""
steps:
  - number: 1
    name: "basis_integrals"
    description: "All one-body integrals of the model in an even-tempered Gaussian basis: overlap, field-free Hamiltonian, complex absorbing potential, and the second spatial moment."
    orchestrator: false
  - number: 2
    name: "canonical_transform"
    description: "Canonical orthogonalisation of the non-orthogonal Gaussian basis, with the near-linear-dependent directions removed and a fixed column sign."
    orchestrator: false
  - number: 3
    name: "cap_eigenvalues"
    description: "Complex eigenvalues of the CAP-augmented Hamiltonian at one value of the absorbing-potential strength."
    orchestrator: false
  - number: 4
    name: "resonance_extents"
    description: "Spatial extent of every CAP eigenstate, used to tell the compact resonance apart from the diffuse discretised continuum."
    orchestrator: false
  - number: 5
    name: "branch_energies"
    description: "The complex energy of the resonance followed continuously along the whole CAP-strength grid."
    orchestrator: false
  - number: 6
    name: "branch_velocity"
    description: "The logarithmic energy velocity along the trajectory, evaluated analytically rather than by differencing."
    orchestrator: false
  - number: 7
    name: "solution_etas"
    description: "Every CAP solution on the trajectory, located as an interior local minimum of the velocity and sharpened by parabolic interpolation."
    orchestrator: false
  - number: 8
    name: "deperturbed_widths"
    description: "The first-order corrected resonance width at every CAP solution."
    orchestrator: false
  - number: 9
    name: "branch_velocity_slope"
    description: "The slope of the logarithmic energy velocity with respect to ln(eta) along the followed branch, from analytic first and second derivatives of the resonance energy."
    orchestrator: false
  - number: 10
    name: "solution_fold_strength"
    description: "The continuum-remover strength at which one chosen CAP solution ceases to exist."
    orchestrator: false
  - number: 11
    name: "remover_survival_strength"
    description: "The continuum-remover strength beyond which no CAP solution of the model survives."
    orchestrator: true
