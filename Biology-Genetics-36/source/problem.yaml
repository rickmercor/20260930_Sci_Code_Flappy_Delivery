  - number: 5
    name: "05_site_count_statistics.py"
    description: "Exact probability of a given number of segregating sites, the accuracy of its series evaluation, and a central moment of the number of sites."
    orchestrator: false
  - number: 6
    name: "06_history_decision.py"
    description: "Joint probability of a three-locus observation under two size histories, and the decision between them."
    orchestrator: false
  - number: 7
    name: "07_configuration_probability_given_site_counts.py"
