problem_id: "Chemistry-Computational_Chemistry-18"
subject: "chemistry"
subject_area: "Computational Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2606.24653"
dependencies: ""
steps:
  - number: 1
    name: "lattice_census"
    description: "Enumerates the lattice vectors of a finite crystal of a given size index and edge matrix and reports its census."
    orchestrator: false
  - number: 2
    name: "finite_lattice_sum"
    description: "Evaluates the electrostatic potential at the reference ion of a finite crystal of oppositely charged pairs."
    orchestrator: false
  - number: 3
    name: "boundary_term"
    description: "Evaluates the non-periodic boundary contribution that the shape of a macroscopic crystal imposes on the reference ion."
    orchestrator: false
  - number: 4
    name: "finite_size_term"
    description: "Evaluates the leading correction that separates a finite cubic crystal from the macroscopic limit of the same shape."
    orchestrator: false
  - number: 5
    name: "bulk_pair_potential"
    description: "Extracts the shape-independent bulk pair potential from the finite lattice sum of a cubic sample."
    orchestrator: false
  - number: 6
    name: "madelung_constant"
    description: "Evaluates the Madelung constant of the caesium chloride structure from the corrected direct summation."
    orchestrator: false
  - number: 7
    name: "infinite_crystal_potential"
    description: "Evaluates the potential of a macroscopic crystal of prescribed proportions from the bulk and boundary parts and compares the finite sum of the same shape with it."
    orchestrator: false
  - number: 8
    name: "multipole_coefficient"
    description: "Evaluates the coefficient of the leading finite-size term that the multipole construction predicts for a sample of prescribed proportions."
    orchestrator: false
  - number: 9
    name: "finite_size_fit"
    description: "Measures the actual leading finite-size coefficient of a sample from its direct sums at several sizes, and the corresponding coefficient of the second-order multipole term alone."
    orchestrator: false
  - number: 10
    name: "termination_coefficient"
    description: "Evaluates analytically the coefficient of the leading finite-size term that the termination of a sheared sample adds to the multipole construction."
    orchestrator: false
  - number: 11
    name: "lattice_audit"
    description: "Runs the whole chain on the benchmark configuration and returns the audit of the finite Coulomb lattice sum of a sheared sample."
    orchestrator: true
