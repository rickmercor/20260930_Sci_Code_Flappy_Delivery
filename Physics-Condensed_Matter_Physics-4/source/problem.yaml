problem_id: "Physics-Condensed_Matter_Physics-4"
subject: "physics"
subject_area: "Condensed Matter Physics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1038/s41467-025-64285-2"
dependencies: "import numpy as np\nfrom scipy.linalg import expm"
steps:
  - number: 1
    name: "moire_reciprocal_lattice"
    description: "Compute the two primitive reciprocal-lattice vectors of the moire superlattice formed by twisting two layers with a common lattice constant."
    orchestrator: false
  - number: 2
    name: "interlayer_moire_coupling"
    description: "Compute the complex Fourier amplitude of the moire potential felt by the centre of mass of a 1s interlayer exciton."
    orchestrator: false
  - number: 3
    name: "moire_exciton_bands"
    description: "Diagonalise the zone-folded moire exciton Hamiltonian on a grid of the moire Brillouin zone and return mini-band energies, eigenvectors and squared group velocities."
    orchestrator: false
  - number: 4
    name: "phonon_matrix_elements"
    description: "Evaluate the squared exciton-phonon coupling of one carrier's layer at a set of momentum transfers, for the longitudinal acoustic and the optical deformation-potential channels."
    orchestrator: false
  - number: 5
    name: "scattering_weights"
    description: "Assemble the broadening-independent weights of phonon-assisted scattering between moire exciton states, resolved by umklapp vector, layer and emission or absorption."
    orchestrator: false
  - number: 6
    name: "transition_rate_matrix"
    description: "Build the phonon-assisted transition-rate matrix between moire exciton states for given state dephasings, replacing strict energy conservation by a broadened kernel."
    orchestrator: false
  - number: 7
    name: "self_consistent_dephasing"
    description: "Solve for the state dephasings that are consistent with the broadened scattering rates they produce."
    orchestrator: false
  - number: 8
    name: "relaxed_distribution"
    description: "Propagate the homogeneous occupation of the moire exciton states from a hot excitation window through the phonon master equation to a given time."
    orchestrator: false
  - number: 9
    name: "rta_diffusion_coefficient"
    description: "Compute the exciton diffusion coefficient of a given occupation of the moire mini-band states in the relaxation-time approximation."
    orchestrator: false
  - number: 10
    name: "moire_exciton_diffusion"
    description: "Compute the diffusion coefficient of hot-excited interlayer excitons in a twisted R-stacked MoSe2/WSe2 heterobilayer after phonon relaxation through the moire mini-bands."
    orchestrator: true
