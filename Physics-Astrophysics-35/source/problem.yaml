steps:
  - number: 1
    name: "compute_two_body_constants"
    description: "Compute the basic constants of an isolated star-companion two-body system: the mass ratio, the total and reduced masses, the coefficient of the Runge-Lenz vector used by the later steps, and the period of the relative orbit."
    orchestrator: false
  - number: 2
    name: "democratic_heliocentric_coordinates"
    description: "Transform the inertial positions and momenta of an N-body system, star first, into democratic heliocentric coordinates."
    orchestrator: false
  - number: 3
    name: "kepler_drift"
    description: "Advance a relative position and velocity along their exact Keplerian orbit for a given time."
    orchestrator: false
  - number: 4
    name: "runge_lenz_vector"
    description: "Compute the Runge-Lenz vector of the relative two-body orbit from its democratic heliocentric coordinates."
    orchestrator: false
  - number: 5
    name: "error_hamiltonian_rl_rate"
    description: "Compute the rate of change of the Runge-Lenz vector generated by the secular part of the leading-order error Hamiltonian of a BAB Wisdom-Holman map, at a given state."
    orchestrator: false
  - number: 6
    name: "orbit_averaged_artificial_precession"
    description: "Average the instantaneous apsidal precession rate produced by the error Hamiltonian over one unperturbed Keplerian orbit, giving the secular (artificial) precession rate of the BAB map."
    orchestrator: false
  - number: 7
    name: "gr_precession_rate"
    description: "Compute the orbit-averaged apsidal precession rate produced by the simulation's general-relativity potential."
    orchestrator: false
  - number: 8
    name: "compute_net_apsidal_precession"
    description: "Orchestrator: compute the net orbit-averaged apsidal precession rate, in arcseconds per century, that a BAB Wisdom-Holman simulation in democratic heliocentric coordinates with the GR potential shows for the star-companion orbit."
    orchestrator: true
