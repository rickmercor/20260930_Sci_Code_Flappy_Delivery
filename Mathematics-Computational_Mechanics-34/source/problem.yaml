steps:
  - number: 1
    name: "elastic_operator"
    description: "Assemble the isotropic linear-elastic operator that the source uses for the bulk response, in the six-component tensor layout the source fixes in its discretisation section (Eq. 20). Return it together with the two moduli that Eq. (2) is written in. The layout the source fixes there is load bearing: it decides what the tensor norms appearing in the strength potentials evaluate to."
    orchestrator: false
  - number: 2
    name: "degradation_state"
    description: "Evaluate the source's degradation function, Eq. (6), together with its derivative with respect to the phase-field parameter and the positive source coefficient that the phase-field balance, Eq. (22), carries. Note carefully which quantity this function degrades in this formulation, because it is not the quantity a standard phase-field model degrades, and the small floor parameter it carries is named accordingly."
    orchestrator: false
  - number: 3
    name: "faceted_directions"
    description: "Build the two eigenstrain directions that the source attaches to the non-smooth strength criterion, Eq. (17b), from the current total strain. The first direction carries the volumetric response and the second the shape-changing response. Both are written in the source in a specific scaled form, stated in the sentence that follows Eq. (17); reproduce that form exactly as given, because it is what fixes the meaning of each multiplier."
    orchestrator: false
  - number: 4
    name: "faceted_potential_gradients"
    description: "Differentiate both strength potentials of the non-smooth criterion, Eq. (17a), with respect to the fracture eigenstrain. The first potential is the degradable one that sets the tensile and shear capacity; the second is the potential the source adds to hold the non-penetration condition once the point has lost its cohesion. Reproduce the second potential's magnitude and sign exactly as the source states them, and note which of the two the degradation function is allowed to touch."
    orchestrator: false
  - number: 5
    name: "smooth_direction_gradient"
    description: "Evaluate the source's smooth, pressure-sensitive strength criterion, Eq. (18): its single eigenstrain direction, the gradient of its strength potential with respect to the fracture eigenstrain, and the potential's own value. The criterion is written as two pieces. Which piece applies is decided by one specific scalar of the current state, and that scalar is not the one the potential is differentiated against; the source says explicitly why it has to be that one."
    orchestrator: false
  - number: 6
    name: "smooth_return_map"
    description: "Resolve the point-local return mapping of Eq. (23) for the smooth criterion: find the single eigenstrain magnitude that brings the state back onto the degraded strength surface, and report the resulting eigenstrain, stress and strength-potential value. Eq. (23b) is a two-case residual; use the source's own test to decide which case applies, and include the extra term the source adds to the active case, whose purpose it states immediately below the equation. The magnitude is non-negative."
    orchestrator: false
  - number: 7
    name: "faceted_return_map"
    description: "Resolve the point-local return mapping of Eq. (27) for the non-smooth criterion, where the eigenstrain can grow along either facet independently. Each facet carries its own two-case residual and its own admissibility test, and a facet whose test says the state is already admissible contributes nothing. Sweep the facets until both magnitudes stop moving, then report them together with their activity, the eigenstrain, the stress, and the degradable potential's value."
    orchestrator: false
  - number: 8
    name: "consistent_tangent"
    description: "Assemble the consistent tangent operator of Eq. (30) from the eigenstrain directions and their activity. The source builds it through the reduction it names in the text under Eq. (30) rather than by inverting the full iteration matrix, and it gives that reason explicitly. A direction whose strength was not exceeded is handled by a specific, stated substitution in both factors of that reduction. The small stabilising modulus appears on the reduced diagonal."
    orchestrator: false
  - number: 9
    name: "phase_field_update"
    description: "Solve the source's phase-field balance at a point for the updated phase-field value, given the current crack driving force, the source coefficient produced by the degradation step, the supplied Laplacian of the phase field, and the fracture properties. Use the phase-field distribution function the source selects in Section 2, together with the source coefficient its balance carries; the source argues at length why the other common choice of distribution function would be wrong for this formulation, and that argument fixes which one to use."
    orchestrator: false
  - number: 10
    name: "cohesive_audit"
    description: "Drive the fixed strain path of the configuration twice, once under each strength criterion, running the source's staggered update at every increment: resolve the point-local return mapping at the phase-field value carried in from the previous increment, build the consistent tangent, apply the source's irreversibility rule to the crack driving force, then update the phase field. Record one row per increment and per criterion. The last column is the norm of the difference between the actual stress increment and the increment the consistent tangent predicts."
    orchestrator: true
