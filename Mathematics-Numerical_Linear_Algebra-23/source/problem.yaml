steps:
  - number: 1
    name: "evaluate_balance_candidates"
    description: "Evaluate the Balance Method 2 candidates formed by the supplied harmonic Ritz roots, preserving complex-conjugate pairs as indivisible candidates and identifying the candidate closest to the initial derivative quantity."
    orchestrator: false
  - number: 2
    name: "apply_balance_method2"
    description: "Apply the Balance Method 2 remove-or-keep decision to the harmonic Ritz roots and construct the balanced root set by appending the corresponding balancing root."
    orchestrator: false
  - number: 3
    name: "build_balanced_residual_polynomial"
    description: "Construct the balanced residual polynomial from the Balance Method 2 root set and return its coefficients in ascending order of polynomial degree."
    orchestrator: false
  - number: 4
    name: "evaluate_real_root_derivatives"
    description: "Extract the real roots of the balanced residual polynomial, sort them on the real axis, and evaluate the residual-polynomial derivative at each real root."
    orchestrator: false
  - number: 5
    name: "construct_hermite_spline_candidates"
    description: "Construct the Hermite cubic-spline candidates on the eligible intervals between consecutive real balanced roots and determine the relevant interior critical point and spline value for each examined interval."
    orchestrator: false
  - number: 6
    name: "apply_ritz_interval_screening"
    description: "Apply the Ritz-extrema screening procedure of Algorithm 4 to the supplied Hermite-spline candidates and return the screening result for every examined interval."
    orchestrator: false
  - number: 7
    name: "evaluate_exact_interval_maxima"
    description: "Compute the exact maximum of the balanced residual polynomial on every examined real-root interval and the amount by which the Hermite-spline estimate overshoots it."
    orchestrator: false
  - number: 8
    name: "evaluate_final_diagnostic"
    description: "Run the complete Balance Method 2 and Hermite-spline screening pipeline and return the maximum flagged exceedance margin as the final scalar diagnostic."
    orchestrator: true
