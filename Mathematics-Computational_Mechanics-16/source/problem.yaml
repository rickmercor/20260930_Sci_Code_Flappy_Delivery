steps:
  - number: 1
    name: "01_rasterise_periodic_disc_microstructure"
    description: "A rectangular periodic cell is sampled on a regular grid with an odd number of pixels along each axis, the sample points being x_d = i L_d / n for i = 0, ..., n - 1, so that the origin is a sample point and no sample point lies on the far edge of the cell. The odd count matters for everything that follows: the trigonometric interpolant through the samples then has an unambiguous frequency set -m, ..., m with n = 2 m + 1 and no unpaired highest frequency, which is what makes the spectral derivative used later a real symmetric operator. The microstructure is a matrix carrying circular inclusions; each disc is given by its centre, its radius and its phase label, and a sample point belongs to a disc when its periodic minimum-image distance to the centre is strictly below the radius, so discs that straddle a cell edge wrap around. Phase 1 is the matrix and labels 2 and above are inclusions; the conductivity map is the phase conductivity looked up pixel by pixel. The step also returns the pixel counts, the volume fractions and the arithmetic-mean conductivity, which is the Voigt bound the effective conductivity must not exceed."
    orchestrator: false
  - number: 2
    name: "02_apply_periodic_conductivity_operator"
    description: "The cell operator of periodic conductivity homogenisation maps a periodic potential v to A v = -div(C grad v). On the odd sample grid it is discretised in the standard Fourier fashion: the gradient is the exact derivative of the trigonometric interpolant, that is multiplication by 2 pi i k_d / L_d for every frequency k_d in -m, ..., m, the conductivity multiplies the gradient pointwise at the sample points, and the divergence is again spectral. Because the frequency set is symmetric and the conductivity is real, the discrete operator is real and symmetric with respect to the pixel-average inner product, and its bilinear form is the average of grad v_1 . C grad v_2 over the sample points, exactly as in the continuous weak form. The result of the divergence has zero frequency component equal to zero by construction, so the operator maps into mean-free fields and its only null vector on mean-free periodic fields is absent; on all periodic fields the constants are its kernel. The function accepts a batch of fields so that the operator can later be applied to a whole basis at once. Conductivity values may be zero, which is what allows the same routine to serve for an indicator function later on."
    orchestrator: false
  - number: 3
    name: "03_assemble_mean_free_operator_matrices"
    description: "The cell problem is posed on periodic potentials with zero mean, a space of dimension N - 1 for N sample points, and the spectral analysis needs matrix representations of two operators on that space: the cell operator A v = -div(C grad v) and the reference operator A_0 v = -C_0 Laplacian v of a uniform comparison medium. Both matrices are formed in the same real orthonormal basis of mean-free fields, orthonormal for the Euclidean inner product over the sample points, and their entries are the pixel averages of q_i times the operator image of q_j, so that a coefficient vector c represents the field sum_i c_i q_i and c_1 . [A] c_2 equals the average of grad v_1 . C grad v_2. The basis used here is trigonometric: for every frequency pair in a half-space of the symmetric frequency set, the normalised cosine and sine modes. In that basis the reference matrix is diagonal with entries C_0 (2 pi)^2 |k / L|^2 / N, positive because the zero frequency has been excluded, so it defines an inner product on coefficient vectors; the cell matrix is real symmetric and reduces to the reference matrix when the conductivity is uniform and equal to C_0. Any other orthonormal mean-free basis represents the same operators up to an orthogonal change of coordinates, which leaves every generalised eigenvalue, every trace and every reconstructed field unchanged."
    orchestrator: false
  - number: 4
    name: "04_solve_preconditioned_cell_operator_spectrum"
    description: "Preconditioning the cell operator by the reference operator produces S = I - A_0^{-1} A on mean-free periodic potentials. This operator is bounded and self-adjoint for the energetic inner product (v_1, v_2) = average of grad v_1 . C_0 grad v_2, and its eigenpairs are those of the generalised problem A phi = (1 - lambda) A_0 phi. With the matrices of the previous step the problem is a real symmetric definite pencil, solved so that the eigenvectors are orthonormal for the reference matrix, which is the discrete form of the energetic normalisation. The eigenvalues are returned in ascending order. The spectrum lies in the interval [1 - M / C_0, 1 - m / C_0], with m and M the smallest and largest phase conductivities, because outside that interval the shifted conductivity C + (lambda - 1) C_0 is definite of one sign and the eigenvalue equation has no non-trivial solution. Inside the interval the spectrum accumulates on the values 1 - C_p / C_0, one per phase: those eigenstates fluctuate within phase p and are constant elsewhere, and they play no role in the cell solution, whereas the remaining eigenvalues, which lie in the transitions between the accumulation values, belong to eigenstates with non-trivial behaviour at the interfaces. The step counts the eigenvalues within a stated tolerance of each accumulation value and the eigenvalues that are farther than that tolerance from all of them."
    orchestrator: false
  - number: 5
    name: "05_project_cell_load_onto_eigenstates"
    description: "Under a uniform macroscopic gradient E the fluctuation u of the potential solves A u = b with load b = div(C E), the divergence of the flux that the macroscopic gradient alone would produce. Preconditioning gives (I - S) u = A_0^{-1} b, and expanding u on the eigenstates, which are orthonormal for the energetic inner product, yields the components p_j = (A_0^{-1} b, phi_j) / (1 - lambda_j). The numerator is simply the pixel average of b phi_j, and integrating by parts once more turns it into -E . beta_j with beta_j the average of C grad phi_j, a vector attached to each eigenstate that measures how strongly it couples to a uniform loading; the same vectors govern the spectral form of the effective conductivity in the next step. Both routes are computed here and the largest discrepancy between them is returned, a check that the load, the eigenvectors, the normalisation and the spectral derivative are mutually consistent. Eigenstates confined to a single phase have beta_j equal to zero, since the average of C grad phi_j reduces to C_p times the average of grad phi_j over the cell, which vanishes by periodicity, so only eigenstates with non-trivial interface behaviour receive a component. The dominant eigenstate, the one with the largest component magnitude, is identified along with its eigenvalue."
    orchestrator: false
  - number: 6
    name: "06_reconstruct_solution_and_effective_tensor"
    description: "With every component known, the fluctuation is the sum of p_j phi_j over the whole spectrum and its sample values follow by combining the basis fields. Because the eigenstates form a complete orthonormal set for the energetic inner product on the discrete mean-free space, this sum is the exact discrete solution of the cell problem, and the step verifies that by evaluating the equilibrium residual div(C (E + grad u)) at the sample points relative to the largest sample value of the load, or in absolute terms when the load vanishes as it does for a uniform medium. The effective conductivity is defined through the average flux, C_eff E = average of C (E + grad u); for the exact solution this agrees with the energy definition, and because the eigenstates diagonalise the cell operator the two definitions also agree for any expansion truncated to a subset of eigenstates. Inserting the expansion into the flux average gives the spectral form C_eff = average of C plus the sum over j of beta_j beta_j / (lambda_j - 1), a rank-one correction per eigenstate whose weight is the outer product of the spectral vector divided by the shifted eigenvalue. Every term of the correction is negative semi-definite because each eigenvalue lies below one, so the effective conductivity never exceeds the arithmetic mean. The step returns the flux-average column for the given loading, the full spectral tensor, the discrepancy between the two for that loading, and the energetic norm of the fluctuation, which by orthonormality is the root of the sum of the squared components."
    orchestrator: false
  - number: 7
    name: "07_build_truncated_reduced_model"
    description: "Only a small part of the spectrum carries the cell solution, so a reduced model keeps the eigenstates whose components are largest in magnitude and discards the rest. Because the eigenstates are orthonormal for the energetic inner product, the relative error of the truncated fluctuation in the energetic norm is available without forming any field: it is the root of the tail sum of squared components over the total sum. The number of retained eigenstates is therefore chosen as the smallest count for which that error falls strictly below a prescribed threshold when eigenstates are admitted in order of decreasing component magnitude. The reduced effective response is the average flux of the truncated field, average of C times E plus the sum of p_j beta_j over the retained set, which is also what the spectral form gives when the sum is restricted to that set and, since the eigenstates diagonalise the cell operator, what the energy of the truncated field gives as well. The relative error of each component of the reduced flux against the full flux is returned, together with the retained count, the achieved energetic error, the error that one fewer eigenstate would leave, and the retained fraction of the spectrum."
    orchestrator: false
  - number: 8
    name: "08_compute_contrast_independent_representation"
    description: "For a two-phase composite the spectral analysis separates the geometry from the material contrast. Writing the conductivity as C_m chi + C_i (1 - chi) with chi the indicator of the matrix, choosing the reference medium equal to the inclusion conductivity C_i, and introducing the contrast z = C_i / C_m together with s = z / (z - 1), the generalised eigenvalue problem of the preconditioned operator becomes div(chi grad psi) = mu Laplacian psi with mu = s lambda. This problem involves the indicator alone, its eigenvalues lie in [0, 1] because chi takes the values zero and one, and it accumulates on the two ends of that interval: eigenstates fluctuating only inside the inclusions have mu near zero and those fluctuating only in the matrix have mu near one. Normalising the eigenstates to unit mean squared gradient, the coupling of each to a macroscopic gradient E is the normalised projection E . g_j with g_j the average of chi grad psi_j, which does not depend on the contrast either. The effective flux for any contrast then follows from the geometric data alone: average of C times E plus (C_i - C_m) times the sum over j of g_j (g_j . E) / (mu_j - s). The step solves the geometric problem, counts the eigenvalues within a tolerance of each end of the interval, evaluates the representation at the requested contrast and compares it with a direct solution of the cell problem at that contrast."
    orchestrator: false
  - number: 9
    name: "09_compute_reduced_model_conductivity_error"
    description: "This final step runs the whole spectral reduced-model workflow from the raw configuration and reports the relative error of the reduced effective conductivity together with every check quantity. The chain is: step 1 samples the periodic disc microstructure on the odd grid and returns the phase map and the conductivity; step 2 provides the Fourier-discretised cell operator, applied inside step 3 to an orthonormal mean-free basis to produce the matrices of the cell operator and of the reference operator, the reference conductivity being the mean of the smallest and largest phase conductivities; step 4 solves the generalised eigenvalue problem of the preconditioned operator with energetic normalisation, returning the ascending spectrum, its bounds, the accumulation values and the counts on and off them; step 5 expands the load on the eigenstates, yielding the components and the spectral coupling vectors; step 6 reconstructs the exact discrete solution, verifies equilibrium and forms the effective conductivity by the flux average and by the spectral sum; step 7 retains the eigenstates of largest component magnitude until the energetic-norm error of the truncated fluctuation drops below the threshold and evaluates the reduced flux; step 8 merges every inclusion phase into one, solves the geometric eigenvalue problem of the resulting two-phase cell and evaluates its contrast-independent representation at the requested contrast against a direct solution. The reported final quantity is the relative error of the first component of the reduced effective flux against the full one for the given loading."
    orchestrator: true
