steps:
  - number: 1
    name: "01_assemble_discrete_hamiltonian_operator.py"
    description: "Assemble the quadratic operator associated with the reduced discrete Hamiltonian of the mixed Cosserat-rod formulation. The reduced state is ordered as the translational velocity, stacked director velocity, force-stress vector, and moment-stress vector. Place the supplied translational mass, director mass, force-compliance, and moment-compliance blocks into the appropriate state partitions without inverting, rescaling, or mixing the blocks. Return the resulting 18-by-18 symmetric NumPy array. All supplied blocks must have the prescribed dimensions, contain finite values, and be symmetric."
    orchestrator: false
  - number: 2
    name: "02_evaluate_endpoint_energy_increment.py"
    description: "Evaluate the discrete Hamiltonian at two consecutive endpoint states using the preassembled 18-by-18 quadratic operator returned by the preceding subproblem. Pack each endpoint state in the prescribed order consisting of translational velocity, stacked director velocity, force stress, and moment stress. Evaluate the quadratic Hamiltonian at each endpoint and retain the signed ordering of the time levels. Return a three-component NumPy array containing H^n, H^(n+1), and H^(n+1)-H^n in that exact order. Do not reconstruct or modify the Hamiltonian operator inside this function."
    orchestrator: false
  - number: 3
    name: "03_build_director_kinematic_map.py"
    description: "Construct the paper-specific director-dependent kinematic matrix T(d) from an ordered orthonormal director triad. The three supplied director vectors are stored as the rows of a 3-by-3 array in the order d_1, d_2, d_3. Return the 9-by-3 matrix used by the paper to map the stacked director-rate vector to spatial angular velocity. Preserve the paper's exact sign, scaling, block orientation, and director ordering. Do not replace this construction by a generic rotation-vector, quaternion, or finite-difference approximation."
    orchestrator: false
  - number: 4
    name: "04_assemble_mechanical_boundary_effort.py"
    description: "Assemble the 12-component generalized mechanical boundary effort by concatenating the boundary force\u00a0$n_boundary$\u00a0with the director-rate moment\u00a0$T @ m_boundary$. Return that vector."
    orchestrator: false
  - number: 5
    name: "05_evaluate_midpoint_boundary_port.py"
    description: "Evaluate the midpoint mechanical boundary port using both the paper-specific director kinematic matrix and the generalized boundary-effort vector returned by the preceding subproblem. Recover the spatial angular velocity from the stacked midpoint director-rate vector using the supplied 9-by-3 director map. Evaluate translational power by pairing the centerline boundary velocity with the first three components of the generalized effort, and evaluate rotational power by pairing the stacked director-rate vector with its remaining nine components. Return a six-component NumPy array containing, in order, the three angular-velocity components, translational power, rotational power, and total boundary power. Do not reconstruct the generalized boundary effort inside this function."
    orchestrator: false
  - number: 6
    name: "06_compute_discrete_power_balance_defect.py"
    description: "Combine the endpoint-energy summary and midpoint boundary-port summary produced by the preceding subproblems into the one-step discrete power-balance result. Use the signed Hamiltonian increment stored in the endpoint-energy summary and the total midpoint boundary power stored in the boundary-port summary. Convert the midpoint power into one-step work using the supplied nonnegative time-step size, and form the signed energy-balance defect using the time-level ordering prescribed by the structure-preserving balance. Return a two-component NumPy array containing the one-step boundary work and the signed energy-balance defect, in that order."
    orchestrator: false
  - number: 7
    name: "07_compute_energy_balance_defect.py"
    description: "Compute the signed energy-balance defect for the complete reduced Cosserat-rod state transition by orchestrating all six preceding subproblems. Assemble the discrete Hamiltonian operator, evaluate the endpoint Hamiltonians and their signed increment, construct the paper-specific director kinematic matrix, assemble the generalized mechanical boundary effort, evaluate the midpoint mechanical boundary port, and finally form the one-step discrete power-balance result. Return only the signed energy-balance defect as a finite floating-point scalar. The public implementation must call and genuinely use the outputs of assemble_discrete_hamiltonian_operator, evaluate_endpoint_energy_increment, build_director_kinematic_map, assemble_mechanical_boundary_effort, evaluate_midpoint_boundary_port, and compute_discrete_power_balance_defect rather than duplicating their calculations."
    orchestrator: true
