problem_id: "Chemistry-Computational_Chemistry-37"
subject: "chemistry"
subject_area: "Computational Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1063/5.0326023"
dependencies: ""
steps:
  - number: 1
    name: "sampling_record"
    description: "Build the per-ensemble bookkeeping of the simulation record. A trajectory belongs to the ensemble associated with interface k only when its furthest progress along the coordinate lies strictly beyond that interface, so the visitation counts form a staircase pattern that is non-zero only for the low-lying ensembles of trajectories that did not travel far. Return both the visitation counts and the acceptance weights of the biased shooting moves, stacked into one array, using the construction rules given in the problem."
    orchestrator: false
  - number: 2
    name: "ensemble_path_totals"
    description: "Reduce the visitation counts to one total per ensemble. Because the counts are fractional, these totals play the role that the plain number of sampled paths plays in a synchronous simulation, and they set the scale against which every later weight is normalised."
    orchestrator: false
  - number: 3
    name: "unbiased_sampling_weights"
    description: "Remove the sampling bias and place the ensembles on a common scale. Each trajectory is counted inversely to the acceptance weight it carried in a given ensemble, and the resulting column is then rescaled so that it sums back to that ensemble's own total visitation count. The second operation is not cosmetic: the combination rule that follows compares ensembles against one another, so their weights are only meaningful once fixed to a shared scale."
    orchestrator: false
  - number: 4
    name: "highest_ensemble_index"
    description: "Label each trajectory with the highest-indexed ensemble it belongs to. The label is fixed by where the trajectory's furthest progress falls relative to the interfaces, using an interval that excludes its lower interface and includes its upper one, with everything beyond the last sampled interface collapsed onto that final index. Trajectories whose maximum coincides exactly with an interface therefore take the lower of the two candidate labels."
    orchestrator: false
  - number: 5
    name: "interface_crossing_totals"
    description: "For one nominated interface, accumulate per ensemble the unbiased sampling weight carried by the trajectories that advanced beyond it. Trajectories that fell back before reaching the interface contribute nothing. These restricted totals are the numerators of the crossing probability that follows."
    orchestrator: false
  - number: 6
    name: "crossing_probabilities"
    description: "Run the forward recursion that turns the per-interface restricted totals into the probability of advancing from the reactant boundary to each successive interface. Two features of the recursion decide the result: only the ensembles whose index lies strictly below the target interface contribute to its estimate, and the summed restricted totals are scaled by the normaliser belonging to the previous step of the recursion rather than the current one. Return the full ladder of probabilities, the first of which is unity."
    orchestrator: false
  - number: 7
    name: "wham_normalisers"
    description: "Form the per-index normalisers of the multi-ensemble combination. The normaliser at index i is the reciprocal of a cumulative sum running over ensembles 0 through i, in which each ensemble total is divided by the crossing probability of its own interface. The lowest normaliser is therefore the reciprocal of the lowest ensemble total."
    orchestrator: false
  - number: 8
    name: "plus_path_weights"
    description: "Collapse the ensemble bookkeeping into one weight per barrier-side trajectory: the normaliser evaluated at that trajectory's highest ensemble index, multiplied by the sum of its unbiased sampling weights taken over every ensemble. The sum extends over all ensembles rather than stopping at the trajectory's own index, which is harmless because the weights vanish above it."
    orchestrator: false
  - number: 9
    name: "minus_path_weights"
    description: "Weight the reactant-side trajectories. This ensemble does not overlap any of the barrier-side ensembles, so no multi-ensemble combination is involved and no acceptance bias has to be removed: the weights are the visitation counts normalised to sum to unity."
    orchestrator: false
  - number: 10
    name: "end_interface_fraction"
    description: "Compute the weighted fraction of reactant-side trajectories that terminate at the inner interface rather than at the outer one. This is a weighted average of an indicator over the reactant-side ensemble, so each trajectory enters through its own normalised weight and not through a plain head count."
    orchestrator: false
  - number: 11
    name: "path_slice_values"
    description: "Place the interior phase points of one trajectory along the order parameter, following the rise-and-fall profile specified in the problem. A trajectory of length parameter L holds L+1 phase points, of which the L-1 interior ones are kept and the two end points discarded. A trajectory that reaches the product state rises monotonically instead, and a reactant-side trajectory uses the same rise-and-fall rule with the outer interface as its turning point."
    orchestrator: false
  - number: 12
    name: "conditional_density_histogram"
    description: "Accumulate the weighted phase points of both families into a histogram along the order parameter. Each family arrives as a flat list of interior positions together with the weight of the trajectory each position came from. Reactant-side points enter with their weight unchanged, while barrier-side points enter with theirs scaled by the fraction of reactant-side trajectories terminating at the inner interface. Bins are of equal width and span the stated bounds, with a point lying on a shared edge assigned to the upper bin."
    orchestrator: false
  - number: 13
    name: "conditional_free_energy_barrier"
    description: "Run the whole analysis end to end and return the requested scalar. Thread the record through every earlier step in order: build the visitation counts and acceptance weights, reduce them to per-ensemble totals, unbias and rescale them, label each trajectory with its highest ensemble, collect the restricted totals at each interface, run the forward recursion for the crossing probabilities, form the normalisers, collapse the bookkeeping into one weight per trajectory on each side, obtain the fraction of reactant-side trajectories terminating at the inner interface, place the interior phase points of every trajectory along the coordinate, accumulate them into the conditional density, and convert that density to a free energy on a scale whose minimum is zero. Return the free energy of the highest bin."
    orchestrator: true
