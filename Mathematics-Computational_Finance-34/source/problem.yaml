problem_id: "Mathematics-Computational_Finance-34"
subject: "mathematics"
subject_area: "Computational Finance"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2609.00438"
dependencies: ""
steps:
  - number: 1
    name: "step01_laguerre_scale"
    description: "Computes the scale parameter of the exponential quadrature weight used for the half-line Fourier integral. The scale is matched to the estimated asymptotic exponential decay rate of the damped Fourier integrand implied by the model parameters and the maturity, following the source's prescription. This step validates the closed-form scale formula only; it performs no time stepping and no quadrature. Deliberately excluded: node construction, integrand evaluation, and any error estimation."
    orchestrator: false
  - number: 2
    name: "step02_scaled_quadrature_rule"
    description: "Applies the scaled half-line quadrature rule to the test function f(u) = exp(-a*u). The rule uses the nodes and weights of the classical rule associated with the exponential weight of scale sigma on (0, infinity), applied so that the returned value approximates the full half-line integral of f multiplied by two (the doubling that the pricing formula absorbs into the quadrature). This step validates node/weight rescaling and the doubling convention. Deliberately excluded: the Fourier integrand, any model content, and any error estimation."
    orchestrator: false
  - number: 3
    name: "step03_riccati_terminal"
    description: "Solves the fractional Riccati equation of the rough Heston characteristic function at a single Fourier argument xi = u + i*damp on the uniform grid of the discretization hierarchy (level ell has m0 * 2^ell time steps on [0, T]), using the fractional Adams predictor-corrector (PECE) scheme of Diethelm, Ford and Freed with h(0) = 0, and returns the real part of the terminal nodal value h(xi, T). This step validates the time-stepping scheme only. Deliberately excluded: the characteristic-function exponent, the payoff transform, and all quadrature."
    orchestrator: false
  - number: 4
    name: "step04_cf_exponent"
    description: "Assembles the fully discrete characteristic-function exponent G_level(xi) at a single Fourier argument xi = u + i*damp from the nodal fractional-Riccati values on the level grid, combining the drift contribution with the time integral of the exponent integrand evaluated on the same nodal grid, and returns Re G_level(xi). This step validates the level-defining discrete exponent. Deliberately excluded: the payoff transform, the damped integrand prefactor, and all quadrature in the Fourier variable."
    orchestrator: false
  - number: 5
    name: "step05_fourier_integrand"
    description: "Evaluates the half-line Fourier pricing integrand g_level(u) for the European call at a single point u >= 0: the discounted real part of the product of the discrete characteristic function exp(G_level) and the generalized payoff transform of the call, both evaluated at the damped argument xi = u + i*damp. This step validates the integrand assembly (payoff transform, damping, discounting, real-part reduction). Deliberately excluded: quadrature in u, level differences, and any parameter selection."
    orchestrator: false
  - number: 6
    name: "step06_single_level_price"
    description: "Computes the single-level price V_(N, level): the scaled half-line quadrature rule with n_quad nodes and weight scale sigma applied to the level-level Fourier integrand. This step validates the coupling of quadrature and integrand at one fixed level. Deliberately excluded: level differences, pilot indicators, level selection, and point allocation."
    orchestrator: false
  - number: 7
    name: "step07_select_level"
    description: "Selects the finest discretization level L from the prescribed discretization tolerance: computes the pilot first level difference D1 = |V_(n_pilot,1) - V_(n_pilot,0)| with the scaled rule at n_pilot nodes, extrapolates it with the supplied empirical convergence rate p, and returns the smallest admissible level (at least 1) as a float. This step validates the pilot indicator and the selection rule. Deliberately excluded: quadrature-point allocation and the telescoped price."
    orchestrator: false
  - number: 8
    name: "step08_allocate_points"
    description: "Allocates quadrature points across the multilevel hierarchy for a given finest level big_l and quadrature tolerance eps_quad, using the algebraic quadrature-error model with the supplied fitted constants (level-zero prefactor a0 and smoothness index s0_idx; first-correction prefactor a1 and common correction index s_idx), the per-evaluation cost exponent beta, and the empirical rate p for prefactor propagation across correction levels. Returns the total number of quadrature points (level-zero plus all corrections) as a float. This step validates the closed-form work-optimal allocation and its integer rounding. Deliberately excluded: any integrand evaluation."
    orchestrator: false
  - number: 9
    name: "step09_multilevel_price"
    description: "Orchestrates the complete pipeline and returns the multilevel benchmark price. It derives the weight scale from the model (step 1 oracle), verifies the scaled-rule invariant (step 2 oracle), computes the pilot level prices (step 6 oracle) and the selected level (step 7 oracle, cross-checked against an internal recomputation), obtains the total allocation (step 8 oracle, cross-checked against the internally recomputed allocation vector), verifies the probe values of the Riccati solution, the discrete exponent, and the integrand (step 3-5 oracles) against its own traced evaluations, and then assembles the telescoped price: the level-zero quadrature plus the sum of correction-level quadratures of level differences, each correction evaluated at its own allocated node count with both levels of the difference sampled at the same scaled nodes. The pipeline's rate convention (the empirical rate used by the selection rule and the prefactor propagation) is fixed internally. Raises on any cross-check inconsistency. A local re-trace of nodal integrand values is used for state that earlier steps do not expose."
    orchestrator: true
