steps:
  - number: 1
    name: "potential_and_derivatives"
    description: "Evaluate the model potential and its first and second derivatives at a set of points. The potential is V(x, y) = (1/8) (x^2 - 1)^2 + (wy^2 / 2) [y + c (x^2 - 1)]^2 + a x^3, where the square bracket is squared as a whole. SPECIFICATION: points is an array of shape (n, 2) holding the x and y coordinate of each point. The result is a real array of shape (n, 6) whose six columns are, in this order, the potential, its first derivative with respect to x, its first derivative with respect to y, its second derivative with respect to x twice, its mixed second derivative, and its second derivative with respect to y twice."
    orchestrator: false
  - number: 2
    name: "well_data"
    description: "Locate both minima of the potential and report their harmonic data. SPECIFICATION: each minimum is found by Newton iteration started from the point with x equal to minus one and then plus one, each with y equal to zero; at every iteration the Hessian is diagonalised, its eigenvalues are replaced by 1e-12 wherever they fall below that value, and the step is minus the inverse so modified applied to the gradient; iteration stops once the largest absolute gradient component is below 1e-15 or after three hundred iterations. The normal mode frequencies are the square roots of the Hessian eigenvalues at the converged point divided by the mass, which is one, with any negative eigenvalue first replaced by zero; they are reported in ascending order. The energy of a well is its potential plus hbar over two times the sum of its two frequencies. The result is a real array of shape (2, 6) whose first row is the well reached from negative x and whose second row is the well reached from positive x, with columns in this order: the x coordinate of the minimum, its y coordinate, the lower frequency, the higher frequency, the potential at the minimum, and the energy of the well."
    orchestrator: false
  - number: 3
    name: "initial_path"
    description: "Construct the starting trajectory on a uniform grid of the evolution parameter. SPECIFICATION: well is the array returned by the previous step. The trajectory is built at the energy E equal to the potential at the second well, that is well[1, 4]. Let f(x) be one eighth of the square of x squared minus one plus a times x cubed, let f'(x) be its derivative, and let g(x) be the square root of one plus four c squared x squared. Let xr be well[1, 0] and xl be well[0, 0]. Define xR as the root of f(x) minus E minus 1e-10 lying between zero and xr, found by a bracketing root finder to machine precision, that is with absolute tolerance 1e-16 and relative tolerance 8.9e-16 on x. The parameter accumulates as dt = g(x) dx divided by the square root of twice f(x) minus E, the mass being one. If the absolute value of f'(xl) is below 1e-13 and the absolute value of f(xl) minus E is below 1e-18, define xL as the root of f(x) minus E minus 1e-10 lying between xl and zero, found to the same precision, integrate on 200001 equally spaced points from xL to xR by the trapezoidal rule, centre the resulting interval inside tau_inst, and complete both ends with x equal to the nearby minimum minus the offset of the interval end from it times the exponential of minus w(x) times the elapsed parameter, where w(x) is the square root of the absolute value of (3 x^2 - 1)/2 + 6 a x, divided by g(x). Otherwise define xb as the root of f(x) minus E lying between xl and zero, found to the same precision, substitute x = xb + u squared and integrate on 200001 equally spaced points in u from zero to the square root of xR minus xb by the trapezoidal rule, taking the integrand at u equal to zero to be twice g(xb) divided by the square root of twice the absolute value of f'(xb); the trajectory then starts at xb and the parameter values beyond the end of that integral are completed with the same exponential approach to xr. Values inside the integrated interval are obtained by linear interpolation of x against the accumulated parameter. The second coordinate is set to minus c times x squared minus one at every point. The result is a real array of shape (n_beads + 1, 2) sampled at parameter values i times tau_inst over n_beads for i from zero to n_beads."
    orchestrator: false
  - number: 4
    name: "path_action"
    description: "Evaluate the discretised action of an open trajectory. SPECIFICATION: path has shape (n + 1, 2) and eps is the spacing of the evolution parameter between consecutive rows. The action is the mass, which is one, divided by twice eps, times the sum over consecutive rows of the squared Euclidean distance between them, plus eps times the sum of the potential over all rows in which the FIRST and LAST rows each count one half and every interior row counts one. Return a single real number."
    orchestrator: false
  - number: 5
    name: "path_gradient"
    description: "Differentiate the discretised action with respect to every coordinate of every row. SPECIFICATION: with the action defined as in the previous step, the derivative at an interior row i is the mass, which is one, divided by eps, times twice row i minus row i minus one minus row i plus one, plus eps times the gradient of the potential at row i. At the first row it is the mass divided by eps times the first row minus the second row, plus one half eps times the gradient of the potential at the first row; at the last row it is the mass divided by eps times the last row minus the second to last row, plus one half eps times the gradient of the potential at the last row. The result has the same shape as path."
    orchestrator: false
  - number: 6
    name: "optimise_instanton"
    description: "Refine a trajectory onto the stationary configuration of the action. SPECIFICATION: the configuration sought is a saddle, so the step is taken from a shifted second-derivative matrix. That matrix is block tridiagonal with two by two diagonal blocks and constant two by two off-diagonal blocks equal to minus the mass divided by eps times the identity; the diagonal block at row i is eps times the Hessian of the potential there, halved at the first and last rows, plus twice the mass over eps times the identity at interior rows and the mass over eps times the identity at the first and last rows. A scalar mu times the identity is added to every diagonal block and the resulting system is solved against minus the gradient. mu starts at 1e-3. A step is ACCEPTED when it strictly reduces the Euclidean norm of the gradient over all rows, after which mu is multiplied by 0.4 but never allowed below 1e-15; otherwise the step is rejected and mu is multiplied by 4.0. Iteration stops when that gradient norm falls below 1e-13, when mu exceeds 1e12, or after six hundred iterations, and the current trajectory is returned. The result has the same shape as path."
    orchestrator: false
  - number: 7
    name: "surface_data"
    description: "Place the crossing on a closed trajectory and measure the speed there. SPECIFICATION: path has shape (n + 1, 2). Close it by appending its own rows in reverse order WITHOUT repeating either end row, that is rows n minus one down to one, giving a cyclic sequence of 2n rows in which row zero and row n each appear once and every interior row appears twice. Let j be the index of the largest potential among rows one to n minus one of path, so the end rows are excluded and j is an index into the closed sequence. The two crossings are at j and at 2n minus j. The arc that contains row zero spans 2j intervals and the arc that contains row n spans 2n minus 2j intervals. The speed at the crossing is the Euclidean distance between the rows at j plus one and j minus one of the closed sequence, taken cyclically, divided by twice eps. Return a real array of length four holding, in this order, j, 2j, 2n minus 2j, and that speed, all as floating point numbers."
    orchestrator: false
  - number: 8
    name: "collapsed_log_determinant"
    description: "Logarithm of the determinant of the second-derivative matrix of the discretised action for a closed chain collapsed onto a harmonic minimum. SPECIFICATION: the chain has n_ring rows, all sitting at one minimum whose normal-mode frequencies are omegas, with spacing eps of the evolution parameter between consecutive rows and unit mass, and consecutive rows are coupled cyclically so that the chain is closed. The matrix is scaled as eps over the mass times the second derivative of the discretised action, so that each diagonal block is twice the identity plus eps squared times the Hessian at the minimum and each cyclic off-diagonal block is minus the identity. Return the natural logarithm of its determinant as a single real number. n_ring is supplied by the caller."
    orchestrator: false
  - number: 9
    name: "pinned_log_determinant"
    description: "Logarithm of the absolute determinant of the closed-chain second-derivative matrix of the discretised action with the crossing modes removed. SPECIFICATION: close path exactly as in the crossing step and take j and the crossing indices from that same step, the second being 2n minus j. Build the matrix whose diagonal two by two block at row i is eps over the mass, the mass being one, times twice the mass over eps times the identity plus eps times the Hessian of the potential at that row, and whose off-diagonal two by two blocks coupling consecutive rows cyclically are minus the identity. At each of the two crossing rows remove exactly one coordinate direction, the one that the projected-flux construction pins there, and leave the other direction of that row and every other row in place. Wherever a local direction of travel along the closed sequence is needed, take the difference between the next and previous rows, cyclically, normalised to unit length. Return the sum of the natural logarithms of the absolute values of the eigenvalues of what remains, as a single real number."
    orchestrator: false
  - number: 10
    name: "tunnelling_splitting"
    description: "Asymmetry, tunnelling frequency and level splitting of the double well. SPECIFICATION: set eps to tau_inst divided by n_beads, obtain the well array, build the starting trajectory, refine it, and take the crossing data from it, all exactly as in the earlier steps. Then evaluate the action of the refined trajectory, the logarithm of the determinant with the crossing modes removed, and the collapsed logarithm for each well using the frequencies in columns two and three of that well's row, and combine them into the projected-flux instanton expression for the tunnelling frequency Omega of the two-well system. Let d be one half of the second well energy minus the first well energy, the energies being column five of the well array. Return a real array of length three holding, in this order, d, hbar times Omega, and the level splitting of the two wells."
    orchestrator: true
