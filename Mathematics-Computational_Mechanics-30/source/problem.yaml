steps:
  - number: 1
    name: "neighbor_family"
    description: "Return the discrete family of node i on a uniform lattice of spacing dx: every other node whose distance from node i is positive and at most delta, nodes at exactly distance delta included, decided exactly (on the integer lattice offsets, not on rounded floating-point distances). Return an (n_F, 5) array whose columns are the neighbour's node index (stored as a float), the bond vector components xi_x and xi_y, the bond length, and the quadrature volume V_j assigned to that neighbour. Assign the volume the way the source's numerical study does on a uniform grid; note that it names its quadrature choice. Order rows by increasing node index. Raise ValueError if coords is not an (N, 2) array with N >= 2, if i is not a valid index, if delta or dx is not positive, if coords do not lie on a lattice of spacing dx, or if the node has no neighbours inside the horizon."
    orchestrator: false
  - number: 2
    name: "scaled_monomial_basis"
    description: "Evaluate the complete quadratic monomial basis of Eq (49) at each row of the (n, 2) array xi of bond vectors, with both coordinates scaled by the horizon delta before any power is taken. Return an (n, 6) array in the source's ordering: constant, x, y, x squared, xy, y squared. Raise ValueError if xi is not a non-empty (n, 2) array or if delta is not positive."
    orchestrator: false
  - number: 3
    name: "derivative_block"
    description: "Assemble the derivative-operator matrices of Eqs (56) and (57) for the x and y directions and stack them as a (2 n_T, n_p) array, x rows first, where the n_T = n_p - 1 test functions are the non-constant monomials of the basis in basis order (the constant test gives an identically zero row and is omitted). family is the (n_F, 5) array of step 1, basis the (n_F, n_p) basis evaluated at the neighbours, basis0 the basis evaluated at the node itself. Each row is a sum over the family of the source's per-bond basis factor, times the bond component divided by the bond length to the power q, times the test function increment between neighbour and node, times V_j. Raise ValueError if family is not (n_F, 5), if basis is not (n_F, n_p) with basis0 of length n_p, or if delta or q is not positive."
    orchestrator: false
  - number: 4
    name: "energy_block"
    description: "Assemble the energy-operator matrix of Eq (59) for the vector test functions formed by multiplying each non-constant scalar test by the two Cartesian unit vectors, and return it as a (2 n_T, n_p) array, x-lifted tests first, tests in basis order. Each row is a sum over the family of the source's per-bond basis factor, times the square of the test increment times the bond component, divided by the bond length to the power q, times V_j; leave out any constant prefactor common to a row and its target. Raise ValueError under the same conditions as the derivative block."
    orchestrator: false
  - number: 5
    name: "full_ball_targets"
    description: "Return the target vector the source fits against: the derivative operators of Eq (60) and the energy operator, each applied to the five non-constant scaled monomial test functions at the node, evaluated over the reference neighbourhood the source prescribes for the targets, and concatenated as x-derivative targets, y-derivative targets, x-lifted energy targets, y-lifted energy targets, in that order, giving a length-20 array. Evaluate every entry exactly, with the same prefactor convention as the energy block. Raise ValueError if delta or q is not positive, or if an entry is not finite."
    orchestrator: false
  - number: 6
    name: "local_coupling_row"
    description: "Solve the regularized least-squares fit of Eqs (64) to (68) at one node and return the relation it yields between this node's weight and its neighbours' weights. Stack the collocation block (the basis at the neighbours, whose targets are the neighbours' own weights and are therefore left symbolic), the derivative block and the energy block into one matrix; scale every row of that matrix, together with its target, to unit Euclidean norm; form the Tikhonov-regularized generalized inverse with parameter lam; and read off the row that gives the weight field's value at the node. Return a length n_F + 1 array whose first entry is the contribution of the supplied targets and whose remaining entries are the coefficients multiplying the weights of the n_F neighbours, in family order. Raise ValueError if the blocks are not 2-D with a common basis dimension, if the target length does not match the derivative and energy rows, or if lam is negative."
    orchestrator: false
  - number: 7
    name: "corner_influence_weight"
    description: "Orchestrator. Build the nx-by-ny uniform lattice of spacing dx with its origin node at index 0 and the horizon set to m times dx. For every node of the lattice build its family, evaluate the scaled basis at its neighbours and at the node, assemble the derivative and energy blocks with exponent q, and obtain its coupling row against the target vector with parameter lam; assemble those rows into the global linear system of Eq (69) that determines all nodal weights at once, solve it directly, and return the optimized influence weight of the origin corner node. Call the earlier step functions rather than reimplementing any of them. Raise ValueError if nx or ny is not an integer of at least 2, if dx or q is not positive, if lam is negative, if m is not a positive integer, or if the horizon exceeds what the grid extent can hold."
    orchestrator: true
