paper_doi: "10.48550/arXiv.2609.03780"
dependencies: ""
steps:
  - number: 1
    name: "01_build_mesh.py"
    description: "Construct the deterministic triangulation used by the benchmark. The mesh starts from a uniform Cartesian partition of the unit square. Each cell is split according to the benchmark-specific diagonal rule, followed by one uniform red refinement of every triangle. The implementation is deterministic and returns consistently oriented triangles together with the vertex coordinates."
    orchestrator: false
  - number: 2
    name: "02_build_mini_space.py"
    description: "Construct the global degree-of-freedom maps for the Mini mixed element. The displacement contains continuous P1 vertex degrees of freedom plus one element-local cubic bubble per triangle for each displacement component. The pressure space contains continuous P1 vertex degrees of freedom."
    orchestrator: false
  - number: 3
    name: "03_local_matrices.py"
    description: "Compute the local Mini finite-element matrices on one physical triangle. The local displacement basis consists of the three P1 vertex basis functions and one normalized cubic bubble, for each displacement component. The pressure basis consists of the three P1 vertex functions."
    orchestrator: false
  - number: 4
    name: "04_assemble_mixed_system.py"
    description: "Assemble the global Mini mixed finite-element matrices from the mesh and local element operators."
    orchestrator: false
  - number: 5
    name: "05_pressure_condensation.py"
    description: "Eliminate the pressure variable from the mixed system while retaining the continuous P1 zero-mean pressure constraint."
    orchestrator: false
  - number: 6
    name: "06_solve_positive_spectrum.py"
    description: "Compute the lowest positive eigenvalues of the condensed Mini mixed finite-element problem."
    orchestrator: false
  - number: 7
    name: "07_extract_second_eigenvalue.py"
    description: "Extract the second-smallest positive eigenvalue from an ordered discrete spectrum."
    orchestrator: false
  - number: 8
    name: "08_mini_elasticity_orchestrator.py"
    description: "End-to-end deterministic computation of the requested Mini mixed finite element eigenvalue on the benchmark-specific mesh and material parameters."
    orchestrator: true
