problem_id: "Physics-Quantum_Information_Computing-4"
subject: "physics"
subject_area: "Quantum Information / Computing"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2608.23285"
dependencies: ""
steps:
  - number: 1
    name: "01_build_protocol_data"
    description: "Assemble the constraint observables, the matching observed-moment vector and the detector\n\noperators of a bipartite qudit key-distribution instance whose parameter estimation uses two\n\nmutually unbiased bases."
    orchestrator: false
  - number: 2
    name: "02_key_map_blocks"
    description: "Map a bipartite operator through the detector operators of the protocol, returning the stack of\n\noperators that describes the joint system once Alice's raw-key symbol has been recorded."
    orchestrator: false
  - number: 3
    name: "03_entropy_production"
    description: "Evaluate the entropy produced by the raw-key measurement process on a given bipartite state,\n\nwhich is the objective whose constrained minimum bounds Eve's uncertainty about the raw key."
    orchestrator: false
  - number: 4
    name: "04_moving_reference_logarithm"
    description: "Evaluate the Hermitian operator that the protocol's data-matching step uses as its reference\n\nlogarithm at a given bipartite state and detector."
    orchestrator: false
  - number: 5
    name: "05_objective_gradient"
    description: "Evaluate the Hermitian operator that represents the derivative of the entropy production of the\n\nraw-key measurement process at a given bipartite state and detector."
    orchestrator: false
  - number: 6
    name: "06_gibbs_state"
    description: "Build the exponential-family state generated by a Hermitian reference logarithm and a vector of\n\nreal weights attached to the constraint observables, and return it together with the logarithm\n\nof its normalisation.\n\nEach weight enters the exponent with a minus sign: with L the reference logarithm, M_i the\n\nconstraint observables and w_i the weights, the state is\n\nexp(L - sum_i w_i M_i) / tr exp(L - sum_i w_i M_i), and the returned normalisation is\n\nlog tr exp(L - sum_i w_i M_i)."
    orchestrator: false
  - number: 7
    name: "07_multiplier_objective"
    description: "Evaluate the scalar objective that the protocol's data-matching step minimises over the real\n\nweight vector attached to the constraint observables, together with its gradient.\n\nThe weights enter with the sign convention of Step 06."
    orchestrator: false
  - number: 8
    name: "08_bkm_susceptibility"
    description: "Evaluate the curvature of the data-matching objective at a given real weight vector, returning\n\nthe matrix of its second derivatives with respect to the weights."
    orchestrator: false
  - number: 9
    name: "09_solve_multipliers"
    description: "Locate the real weight vector at which the data-matching objective attains its minimum, and\n\nreport how far the resulting exponential-family state still is from reproducing the observed\n\nmoments."
    orchestrator: false
  - number: 10
    name: "10_outer_iteration"
    description: "Advance the pipeline by one outer iteration: from the current bipartite state, produce the next\n\ncandidate state and the real weight vector that generates it. The exponential family of Steps 06 to 09 is generated by the reference logarithm of Step 04 evaluated at the current state."
    orchestrator: false
  - number: 11
    name: "11_entropy_certificate"
    description: "Evaluate the rigorous lower bound on the constrained minimum of the raw-key entropy production\n\nthat a given linearisation state together with a given real weight vector certifies.\n\nThe weights shift the derivative operator G of Step 05 with a plus sign, as G + sum_i w_i M_i,\n\nwith M_i the constraint observables and w_i the weights."
    orchestrator: false
  - number: 12
    name: "12_certified_entropy_bracket"
    description: "Run the complete pipeline for the two-setting bipartite instance and return the final candidate's entropy-production value and the final iteration's certified lower bound, both in nats."
    orchestrator: true
