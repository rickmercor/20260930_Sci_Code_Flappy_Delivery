steps:
  - number: 1
    name: "01_construct_banded_component"
    description: "Implements construct_banded_components, which builds the compact banded part of the deterministic banded-plus-semiseparable (BPS) matrix used by the QR factorization task."
    orchestrator: false
  - number: 2
    name: "02_construct_semiseparable_generators"
    description: "Implements construct_semiseparable_generators, which builds the four deterministic low-rank generator matrices used in the BPS representation"
    orchestrator: false
  - number: 3
    name: "03_precompute_bps_quantities"
    description: "This step performs the long-range precomputations needed to make the structured QR recurrence efficient. It computes A-transpose times U directly from the banded and semiseparable representation, forms an augmented upper generator by combining S with A-transpose times U, and builds suffix Gram matrices for the active portions of U. It also builds prefix products that accumulate the interaction between rows of U and W. These lookup quantities replace repeated long inner products during the QR iterations with fixed-size matrix operations, and the step initializes the structured perturbation state used by the first Householder update."
    orchestrator: false
  - number: 4
    name: "04_form_structured_householder"
    description: "Form one normalized Householder vector from the current structured BPS trailing state."
    orchestrator: false
  - number: 5
    name: "05_compute_structured_row_update"
    description: "Compute the structured upper-row update produced by one Householder transformation."
    orchestrator: false
  - number: 6
    name: "06_update_structured_perturbation"
    description: "Advance the six compact perturbation matrices after one structured Householder step."
    orchestrator: false
  - number: 7
    name: "07_compute_target_tau"
    description: "Run the complete structured BPS Householder QR pipeline through a requested iteration."
    orchestrator: true
