problem_id: "Material_Science-Semiconductor_Materials-29"
subject: "materials"
subject_area: "Semiconductor Materials"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2609.08047"
dependencies: ""
steps:
  - number: 1
    name: "diode_parameters"
    description: "Convert the physical description of an undoped thin-film (metal-insulator-metal) diode into the parameter vector used by the rest of the chain. The active layer of thickness d (nm) and relative permittivity eps is sandwiched between a hole-injecting anode at x = 0 and an electron-injecting cathode at x = d; the temperature is T (K); the effective densities of states are N_c and N_v (1/m^3), the energy gap E_g (eV), the injection barriers phi_an at the anode and phi_cat at the cathode (eV), the mobilities mu_n and mu_p (m^2/(V s)) and the reduced Langevin factor zeta. The carrier densities at the contacts follow Boltzmann statistics with the contact Fermi level: p_an = N_v exp(-phi_an / kT) and the corresponding electron density n_an = N_c exp(-(E_g - phi_an) / kT) at the anode, n_cat = N_c exp(-phi_cat / kT) and p_cat = N_v exp(-(E_g - phi_cat) / kT) at the cathode, so that n p = n_i^2 = N_c N_v exp(-E_g / kT) at both contacts. The nominal built-in potential is V_bi,0 = (E_g - phi_an - phi_cat) / q, the geometric capacitance C_geo = eps eps0 / d, the Debye screening lengths of the injected carriers at the contacts are lambda_an = sqrt(2 eps eps0 kT / (q^2 p_an)) and lambda_cat = sqrt(2 eps eps0 kT / (q^2 n_cat)), and the bimolecular recombination coefficient is the reduced Langevin value gamma = zeta q (mu_n + mu_p) / (eps eps0). Use q = 1.602176634e-19 C, k = 1.380649e-23 J/K, eps0 = 8.8541878128e-12 F/m. Raise ValueError if d, eps, T, N_c or N_v is not positive, if a barrier is negative or the barriers together reach the gap, or if a mobility or zeta is not positive."
    orchestrator: false
  - number: 2
    name: "effective_built_in_potential"
    description: "Compute the effective built-in potential of the injected-carrier model at an applied voltage V below V_bi,0, together with the quantities derived from it. Return V_bi(V) in V, the contact factors eta_an and eta_cat, the bulk field E_bulk in MV/m (negative for V < V_bi), the effective widths of the accumulation regions at the anode and at the cathode in nm, and the crossover position x* in nm at which the field branches of the two contacts take the same value. The relation that defines V_bi(V) is iterated to machine precision, stopping when the change falls below 1e-15 V. Raise ValueError if par does not have 14 entries, if V is not below V_bi,0, or if the iteration leaves the physical domain V_bi(V) > V."
    orchestrator: false
  - number: 3
    name: "field_and_carrier_profiles"
    description: "Evaluate the injected-carrier model's field and carrier profiles at the positions x (nm, 0 <= x <= d) for an applied voltage V. Use the hyperbolic-cotangent field branch of the anode region for x up to the crossover x* of the previous step and the branch of the cathode region beyond it, both with the bulk field and the effective built-in potential of that step. Return, per position, the field in MV/m, the hole density relative to its contact value p / p_an in the hole-dominated region (zero elsewhere) and the electron density relative to its contact value n / n_cat in the electron-dominated region (zero elsewhere), the densities following from the Boltzmann relation with the electrostatic potential obtained by integrating the field from the respective contact. Raise ValueError if par does not have 14 entries or if a position lies outside the layer."
    orchestrator: false
  - number: 4
    name: "analytic_capacitance"
    description: "Compute the low-frequency capacitance of the injected-carrier model at the voltage V. Return C / C_geo, the relative excess capacitance Delta C / C_geo = C / C_geo - 1, its inverse (Delta C / C_geo)^-1, the total contact factor eta(V) = eta_an + eta_cat, and, for comparison, the relative excess capacitance Delta C_weak / C_geo of the weak-injection limit, the limit in which both Debye lengths are much larger than d. Raise ValueError if par does not have 14 entries, if V is not below V_bi,0, or if the closed form gives a non-positive capacitance."
    orchestrator: false
  - number: 5
    name: "drift_diffusion_state"
    description: "Solve the exact steady-state drift-diffusion model of the same diode at the voltage V on a uniform grid of N intervals (nodes x_i = i d / N, i = 0..N) and return the converged state. The unknowns are the electrostatic potential psi, the electron density n and the hole density p. Boundary values: psi(0) = 0, psi(d) = V_bi,0 - V, and the Boltzmann contact densities n_an, p_an, n_cat and p_cat of the parameter step. The discrete nonlinear system is solved to machine precision, with every scaled residual below 1e-12; the converged discrete solution is unique. Return, per node, psi q / kT, ln n and ln p, with densities in 1/m^3. Raise ValueError if par does not have 14 entries, if N is not an even integer of at least 4, or if V is not below V_bi,0."
    orchestrator: false
  - number: 6
    name: "exact_capacitance"
    description: "From a converged drift-diffusion state at the voltage V, compute the charge displaced through the external circuit and its exact derivative with respect to V, evaluating any integral over the layer with the trapezoidal rule on the grid. Return Q / C_geo in V, the capacitance C / C_geo, and the ratio of Q to eps eps0 times the field at the middle of the layer, taken as (psi_{N/2+1} - psi_{N/2}) / h with the sign of E = -psi'. The capacitance must be the exact derivative of the discrete steady state, not a finite difference of Q between separately converged states. Raise ValueError if the state is not an (N + 1, 3) array with the contact potentials of this bias or if its discrete residuals exceed 1e-9."
    orchestrator: false
  - number: 7
    name: "built_in_extraction"
    description: "Apply the source's built-in potential extraction protocol to the exact model and derive the first-order expansion it rests on. Compute the exact capacitance at each of the fit voltages (strictly increasing, below V_bi,0) from converged drift-diffusion states on the grid of N intervals, form y(V) = (Delta C / C_geo)^-1 with Delta C = C - C_geo, and fit the straight line y = S (V* - V) by ordinary least squares in V. Read the contact factor and the built-in potential the way the source does for its limiting cases (both contacts ohmic or one ohmic and one non-injecting): eta_ext = q C(0) / (2 S kT C_geo) and V_bi,ext = V* + S^-1 [1 + C(0) / C_geo], with C(0) the exact zero-bias capacitance. Then derive the exact first-order expansion of the analytic inverse excess capacitance of the injected-carrier model about V = 0 for arbitrary contacts, y(V) = y(0) - S_lin V + ..., using dV_bi/dV = 1 - C/C_geo and the voltage dependence of both contact factors, and return S_lin and V*_lin = y(0) / S_lin, together with the source's slope factor f_S = eta^2 - 6 (eta + 1/eta) + 12 evaluated at eta(0), which the source gives for devices with at least one ohmic contact. Raise ValueError if fewer than three fit voltages are given, if they are not strictly increasing or not below V_bi,0, if par does not have 14 entries, or if N is not an even integer of at least 4."
    orchestrator: false
  - number: 8
    name: "validity_threshold"
    description: "Locate the forward bias at which the injected-carrier model stops being accurate. Define the deviation delta(V) = 100 (C_analytic(V) / C_exact(V) - 1) in percent, with the closed-form capacitance of the injected-carrier model and the exact drift-diffusion capacitance on the grid of N intervals. Starting from V = 0, march in steps of march_step (V) until delta first reaches the level (percent), then locate the crossing delta(V) = level inside that interval to 1e-12 V (bisection or any bracketing root finder; the deviation grows monotonically with the bias in that interval). Return the threshold voltage V_thr, the remaining effective built-in potential V_bi(V_thr) - V_thr, and the bulk-field parameter z = q [V_bi(V_thr) - V_thr] / (2 kT) at the threshold (the ratio of the bulk potential drop to 2 kT/q that controls the overlap of the two accumulation regions). Raise ValueError if level or march_step is not positive, if the deviation is already above the level at zero bias, or if it never reaches the level before V_bi,0 - 4 kT/q."
    orchestrator: false
  - number: 9
    name: "cv_audit"
    description: "Run the complete chain for every diode design in design_table, a list of rows (d in nm, eps, T in K, N_c, N_v in 1/m^3, E_g in eV, phi_an, phi_cat in eV, mu_n, mu_p in m^2/(V s), zeta), on the grid of N intervals, and return one table. For each design convert the parameters, evaluate the effective built-in potential and the closed-form capacitance at zero bias and at the probe bias V_probe = V_bi(0) / 2, solve the exact drift-diffusion states at both biases and evaluate the exact capacitances, evaluate the field profile of the injected-carrier model at mid-layer x = d / 2 at the probe bias, the weak-injection excess capacitance at the probe bias, the built-in potential extraction over the fit voltages and the validity threshold at the given level with the given march step. Each design row holds the 22 columns [V_bi,0, V_bi(0), eta(0), C_analytic(0) / C_geo, C_exact(0) / C_geo, delta(0) in percent, V_probe, C_analytic(V_probe) / C_geo, C_exact(V_probe) / C_geo, delta(V_probe) in percent, Q / (eps eps0 E_mid) at the probe, E at mid-layer at the probe in MV/m, x* at zero bias in nm, Delta C_weak / C_geo at the probe, Delta C / Delta C_weak at the probe, S, eta_ext, V_bi,ext, V_bi,ext - V_bi(0), V_thr, V_bi(V_thr) - V_thr, z at the threshold]. Row 0 is the head row [V_thr of the first design, number of designs, N, level, zeros]. Raise ValueError if design_table is empty or a row does not have 11 entries, or if N is not an even integer of at least 4."
    orchestrator: true
