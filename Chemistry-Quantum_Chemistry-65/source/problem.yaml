steps:
  - number: 1
    name: "01_ppp_polyene_hamiltonian"
    description: "Build the one-electron core Hamiltonian and the scaled Ohno electron repulsion of a Pariser-Parr-Pople all-trans polyene."
    orchestrator: false
  - number: 2
    name: "02_restricted_hartree_fock"
    description: "Solve the closed-shell restricted Hartree-Fock equations of a zero-differential-overlap pi Hamiltonian."
    orchestrator: false
  - number: 3
    name: "03_ring_ecc_amplitudes"
    description: "Compute the direct-ring extended coupled-cluster doubles amplitudes that block-diagonalize the quasi-boson Hamiltonian."
    orchestrator: false
  - number: 4
    name: "04_ecc_quasiparticle_ionization"
    description: "Obtain the highest-occupied quasiparticle ionization energy and its spectral weight from the equation-of-motion treatment of the doubly similarity-transformed electron-boson Hamiltonian."
    orchestrator: false
  - number: 5
    name: "05_linearized_gw_density_matrix"
    description: "Compute the linearized GW one-body density matrix of a closed-shell reference with direct-ring screening."
    orchestrator: false
  - number: 6
    name: "06_static_self_energy_correction"
    description: "Compute the static self-energy correction generated by the change of the one-body density matrix away from Hartree-Fock."
    orchestrator: false
  - number: 7
    name: "07_fci_ionization_energy"
    description: "Compute the exact (full configuration interaction) first ionization energy of a zero-differential-overlap pi Hamiltonian."
    orchestrator: false
  - number: 8
    name: "08_break_even_interaction_scale"
    description: "Find the interaction scale at which the density-corrected G0W0 ionization energy of a polyene stops being more accurate than plain G0W0 (orchestrator)."
    orchestrator: true
