steps:
  - number: 1
    name: "spline_basis_values"
    description: "Return the values of the B-spline basis of degree p and regularity r on the uniform mesh of nmesh unit elements covering [0, nmesh], at the given evaluation points. The basis is generated by the Cox-de Boor recursion on the open knot vector in which the two end knots 0 and nmesh appear p + 1 times and each interior integer knot appears p - r times, so that the splines are C^r across the interior knots; no other normalisation is applied. The basis functions are indexed from 0 in knot order and there are nmesh (p - r) + r + 1 of them (the number of knots, nmesh (p - r) + r + p + 2, minus p + 1). Points that coincide with an interior knot belong to the element on their right; the right end point belongs to the last element. Reject an invalid degree or regularity, nmesh < 1, and points outside [0, nmesh]."
    orchestrator: false
  - number: 2
    name: "petrov_galerkin_matrices"
    description: "Return the two n x n Petrov-Galerkin matrices of the space-time scheme on the mesh of the previous step, with n = nmesh (p - r) + r. The trial space is spanned by the basis functions with indices 1 to n, which vanish at t = 0, and the test space by the functions with indices 0 to n - 1, which vanish at t = nmesh; the mass matrix has entries M[l, j] = integral over [0, nmesh] of phi_j times phi_{l-1}, and the stiffness matrix has entries B[l, j] = integral of the first derivatives of the same two functions, for l, j = 1, ..., n, both computed exactly. With unit elements these are already the mesh-independent scaled matrices of the source, whose entries are rational numbers. Reject invalid p, r or nmesh < 2."
    orchestrator: false
  - number: 3
    name: "interior_symbol_blocks"
    description: "Return the N x N blocks, N = p - r, that define the block Toeplitz structure of the two matrices of the previous step away from the boundaries: partition rows and columns into consecutive blocks of size N starting at the first row and column (rows and columns 0 to N - 1 form block 0), and for a block row deep inside the matrix return the mass block and the stiffness block found at block offset d from the diagonal, where d is the block column index minus the block row index, for d from -p to p, in an array indexed by d + p, with zero blocks where the offset is empty. The blocks must be independent of the block row chosen and of nmesh once the mesh is large enough for the interior to exist; the last r rows and columns of the matrices are boundary perturbations and are not part of the pattern. Reject invalid p or r."
    orchestrator: false
  - number: 4
    name: "symbol_determinant"
    description: "Return the coefficients, highest power first, of the scalar polynomial det S_rho(t), where S_rho is the matrix polynomial symbol of the block Toeplitz matrices K = -B + rho M built from the interior blocks of the previous step. With the block at offset d written A_{-d}, the Laurent symbol is A_rho(t) = sum over d of (-B_d + rho M_d) t^{-d}; S_rho(t) = t^k A_rho(t) with k the largest positive offset present, so that S_rho is a genuine matrix polynomial, and its determinant is taken exactly. Reject invalid p, r or a negative rho."
    orchestrator: false
  - number: 5
    name: "zero_location_type"
    description: "Classify the zeros of det S_rho(t) from the previous step with respect to the unit circle: return the number of zeros strictly inside (zeros at the origin included), on, and strictly outside the circle, followed by the largest modulus among the inside zeros and the smallest modulus among the outside zeros, each 0 if that group is empty. Zeros on the circle must be identified exactly, not by a floating tolerance on the modulus: after removing the factor t^j from a zero of multiplicity j at the origin the determinant is self-reciprocal, so the substitution y = t + 1/t reduces it to a polynomial in y of half the degree whose real roots in [-2, 2] correspond to pairs of zeros on the circle and whose other roots correspond to pairs inside and outside. Reject invalid p, r or a negative rho."
    orchestrator: false
  - number: 6
    name: "growth_thresholds"
    description: "Return, in increasing order, every positive value of rho at which the zero location type of the previous step changes, to at least ten significant figures. Such a change happens only where a zero of the determinant crosses the unit circle, that is where a real root of the reduced polynomial in y crosses 2 or -2, or where a pair of real roots of the reduced polynomial turns complex; the candidate values are the positive roots of the exact polynomials in rho obtained by evaluating the reduced polynomial at y = 2 and at y = -2 and by its discriminant, and a candidate is kept only if the type really differs on the two sides of it. Reject invalid p or r."
    orchestrator: false
  - number: 7
    name: "block_toeplitz_section"
    description: "Return the leading nblocks x nblocks block section of the infinite block Toeplitz matrix generated by the symbol of the wave scheme, that is the matrix whose block at block position (i, j) is -B_d + rho M_d with d = j - i taken from the interior blocks of step 3, and zero where that offset is absent; this is the pure block Toeplitz matrix whose finite sections the source analyses, without the boundary perturbations of the actual Petrov-Galerkin matrix. Reject invalid p, r, a negative rho or nblocks < 1."
    orchestrator: false
  - number: 8
    name: "exact_condition_number"
    description: "Return the base-10 logarithm of the spectral condition number of the block Toeplitz section of the previous step, together with its largest singular value and the base-10 logarithm of its smallest singular value. The condition numbers of interest exceed the reciprocal of the double precision unit roundoff by many orders of magnitude, so a floating-point singular value decomposition of the section cannot deliver them: the reciprocal of the smallest singular value has to be obtained as the spectral norm of the exactly computed inverse, whose rational entries are only converted to floating point at the end, or by an equivalent exact or extended-precision route, and the result must be accurate to a relative error of 1e-10. Reject invalid p, r, a negative rho, nblocks < 1, and a singular section."
    orchestrator: false
  - number: 9
    name: "growth_factors"
    description: "Return, for every block count nb in nb_list, the ratio of the spectral condition number of the section with nb + 1 blocks to that of the section with nb blocks, each condition number computed as in the previous step. Reject invalid p, r, a negative rho or a block count below 1."
    orchestrator: false
  - number: 10
    name: "iga_conditioning_audit"
    description: "Assemble the conditioning audit of the wave scheme with degree p and regularity r at parameter rho, calling the earlier steps. Row 0: the first three growth thresholds of (p, r) in increasing order (zero when fewer exist) and the number of thresholds. Row 1: the numbers of zeros of det S_rho inside, on and outside the unit circle, and the asymptotic growth factor per block, the reciprocal of the largest inside modulus (zero when there is none). Row 2: log10 of the spectral condition number of the section with nb_final blocks, its largest singular value, log10 of its smallest singular value, and the ratio of the condition numbers of the sections with nb_final and nb_final - 1 blocks. Row 3: the largest threshold of the (2, 0) scheme, the largest threshold of the (3, 0) scheme, the smallest threshold of the (3, 1) scheme, all recomputed by the same chain as a check against the source, and the (1, 1) entry of the section with two blocks of the (p, r) scheme at rho. Raise an error if the (2, 0) chain does not return exactly three thresholds ending at 60, or if any entry is not finite. Reject invalid p, r, a negative rho or nb_final < 3."
    orchestrator: true
