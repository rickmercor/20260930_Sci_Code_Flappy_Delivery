problem_id: "Mathematics-Computational_Mechanics-1"
subject: "mathematics"
subject_area: "Computational Mechanics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "https://doi.org/10.48550/arXiv.2604.18917"
dependencies: ""
steps:
  - number: 1
    name: "evaluate_kernel_weights"
    description: "Build the particle-grid stencil of a staggered grid family and return the kernel weights, their spatial gradients and the node offsets for every particle."
    orchestrator: false
  - number: 2
    name: "transfer_particles_to_grid"
    description: "Collect the stencil into an active node table and carry mass and affine momentum from the material points onto every grid of the family."
    orchestrator: false
  - number: 3
    name: "interpolate_grid_velocity"
    description: "Read a nodal velocity field back onto the material points as a velocity, a velocity gradient and an affine velocity state."
    orchestrator: false
  - number: 4
    name: "evaluate_corotated_response"
    description: "Evaluate the fixed corotated strain energy density and the first Piola-Kirchhoff stress of every material point from its deformation gradient."
    orchestrator: false
  - number: 5
    name: "evaluate_corotated_tangent"
    description: "Differentiate the fixed corotated first Piola-Kirchhoff stress with respect to the deformation gradient to obtain the fourth-order material tangent."
    orchestrator: false
  - number: 6
    name: "assemble_potential_gradient"
    description: "Evaluate the incremental potential of the implicit step at a trial nodal velocity and assemble its gradient with respect to the nodal degrees of freedom."
    orchestrator: false
  - number: 7
    name: "assemble_potential_hessian"
    description: "Assemble the exact tangent matrix of the incremental potential with respect to the nodal velocity degrees of freedom."
    orchestrator: false
  - number: 8
    name: "solve_newton_direction"
    description: "Solve the tangent system for the Newton increment of the nodal velocities, shifting the tangent onto the positive definite cone when it is not already there."
    orchestrator: false
  - number: 9
    name: "advance_particle_state"
    description: "Advect the material points and update their deformation gradients from the converged velocity field of the step."
    orchestrator: false
  - number: 10
    name: "measure_mechanical_energy"
    description: "Reduce the particle state to the kinetic, strain and total mechanical energy of the body and to its angular momentum about the centre of mass."
    orchestrator: false
  - number: 11
    name: "run_ck_mpm_energy_loss"
    description: "Chain the sub-problem functions 01-10 over the whole implicit march of the released pre-strained block and return the fraction of its mechanical energy the scheme has lost."
    orchestrator: true
