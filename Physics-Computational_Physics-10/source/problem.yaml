problem_id: "Physics-Computational_Physics-10"
subject: "physics"
subject_area: "Computational Physics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1038/s41467-026-76322-9"
dependencies: ""
steps:
  - number: 1
    name: "01_build_cloak_mesh"
    description: "Build the uniform triangular finite-element mesh of the square domain and label every triangle by the region of the freeform core-shell device that contains its centroid."
    orchestrator: false
  - number: 2
    name: "02_solve_steady_conduction"
    description: "Solve two-dimensional steady heat conduction with piecewise-constant anisotropic conductivity by linear finite elements under a uniform applied temperature gradient imposed on the boundary of the square."
    orchestrator: false
  - number: 3
    name: "03_calibrate_compensation_shell"
    description: "Calibrate the isotropic conductivity of the outer compensation shell so that the core-shell design leaves no dipolar disturbance in the background under the design drive along $x$."
    orchestrator: false
  - number: 4
    name: "04_compute_duality_jacobian"
    description: "Construct, triangle by triangle, the Jacobian of the coordinate transformation that is fixed by the unidirectional design's own conductivity and temperature field."
    orchestrator: false
  - number: 5
    name: "05_realize_duality_laminate"
    description: "Realize the anisotropic transformation medium of every triangle as a laminate of two isotropic materials with prescribed layer fractions, giving the two constituent conductivities and the direction along which the layers run."
    orchestrator: false
  - number: 6
    name: "06_compute_worst_direction_disturbance"
    description: "Fill every triangle with its prescribed-fraction laminate and return the largest root-mean-square background disturbance of the temperature field over all directions of the applied gradient."
    orchestrator: false
  - number: 7
    name: "07_differentiate_compensation_design"
    description: "Differentiate the physically calibrated unidirectional cloak twice as its inner-shell conductivity varies exponentially and the compensation shell is retuned to keep the exterior dipole moment fixed."
    orchestrator: false
  - number: 8
    name: "08_differentiate_duality_jacobian"
    description: "Compute the local field-prescribed duality Jacobian and its first two ordinary derivatives on the transported isotropic design."
    orchestrator: false
  - number: 9
    name: "09_differentiate_duality_tensor"
    description: "Compute the converted conductivity tensor and its first two ordinary derivatives from the field-prescribed duality Jacobian jet."
    orchestrator: false
  - number: 10
    name: "10_differentiate_duality_response"
    description: "Propagate material and design-field derivatives through the physical-geometric duality and compute the first and second derivatives of each device's worst-direction far-field disturbance."
    orchestrator: false
  - number: 11
    name: "11_estimate_duality_curvature"
    description: "Compute the second logarithmic coupled material-and-shape sensitivity of the conversion gain, composing mesh, conduction, compensation, field-derived duality, laminate realization, angular maxima, implicit compensation derivatives and duality-Jacobian and converted-response derivatives from the previous steps."
    orchestrator: true
