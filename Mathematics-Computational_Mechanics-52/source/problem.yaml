paper_doi: "10.48550/arXiv.2608.23121"
dependencies: ""
steps:
  - number: 1
    name: "micro_modulus"
    description: "Return the source's one-dimensional bond micro-modulus c for each given horizon, for Young's modulus E and cross-sectional area A (the paper's Eq. 25, one-dimensional case). Note the paper states that the micro-modulus of the dual-horizon formulation differs by a constant factor from the classical single-horizon one; use the source's dual-horizon value. Recover the exact expression from the paper."
    orchestrator: false
  - number: 2
    name: "families"
    description: "Build the family (neighbourhood) indicator of the point cloud (the paper's Eq. 1): entry (i, j) is 1.0 when point j belongs to the family of point i under that point's own horizon, and 0.0 otherwise. A point is never its own family member. With spatially varying horizons this relation is NOT symmetric, and the source relies on that asymmetry."
    orchestrator: false
  - number: 3
    name: "bond_stretch"
    description: "Compute the bond stretch for every ordered pair of points from the reference coordinates and the displacement field (the paper's Eq. 22). The deformed position of a point is its reference coordinate plus its displacement. The diagonal is zero."
    orchestrator: false
  - number: 4
    name: "damage_state"
    description: "Return the source's bond damage indicator for the given stretch state, family indicator and critical stretch (the paper's Eq. 27): a bond that belongs to a family is intact while its stretch stays below the critical stretch, and broken otherwise. Pairs that are not family members carry no bond. The comparison is strict."
    orchestrator: false
  - number: 5
    name: "point_damage"
    description: "Return the source's local damage at each material point from the bond damage indicator, the family indicator and the point volumes (the paper's Eq. 30). The damage is zero when every bond of the point is intact and one when all of them are broken, and the source weights the bonds rather than merely counting them. Recover the exact weighting from the paper."
    orchestrator: false
  - number: 6
    name: "internal_force"
    description: "Assemble the internal force density at every material point for the dual-horizon formulation with spatially varying horizons (the paper's Eq. 17, with the pairwise bond force of Eq. 24 and the dual set of Eq. 11). Because family membership is asymmetric, a point receives contributions both from the bonds it owns and from the bonds owned by other points that reach it; the source's expression accounts for both, and the horizon that enters the micro-modulus of a bond is fixed by the source's convention in Eq. 24. Use E = 1.0 and A = 1.0. Recover the exact assembly and the horizon convention from the paper; the symmetric single-horizon expression is a different formula."
    orchestrator: false
  - number: 7
    name: "critical_time_step"
    description: "Return the source's estimate of the critical time step for explicit integration of this point cloud (the paper's Eq. 54), taken as the smallest per-point value over all points. The per-point value is built from the point's density and a sum over its family involving the bond micro-moduli, the neighbour volumes and the reference bond lengths, with the horizon convention of Eq. 24. Use E = 1.0 and A = 1.0. Recover the exact expression from the paper."
    orchestrator: false
  - number: 8
    name: "pd_fracture_audit"
    description: "Run the full dual-horizon audit over the three declared bar configurations. For each configuration build its point cloud, families, stretch state and damage at the declared base critical stretch multiplied by sc_scale, then report a row of: the internal virial (the sum over points of the internal force density times the reference coordinate times the point volume), the critical time step, the mean local damage over the points, and the total number of intact bonds. Assemble by calling the earlier sub-problem functions. Use E = 1.0, A = 1.0 and rho = 1.0."
    orchestrator: true
