steps:
  - number: 1
    name: "01_breeding_cycle_fecundity.py"
    description: "Long-run proportion of adult females with a calf of the year, followed by the fecundity of a female at each requested age relative to an average adult female."
    orchestrator: false
  - number: 2
    name: "02_stage_abundances.py"
    description: "Adult and juvenile female abundance in each requested year under quasi-equilibrium stage-structured dynamics."
    orchestrator: false
  - number: 3
    name: "03_sample_composition.py"
    description: "Expected number of sampled animals of each sex and age in each sampling year, for sampling that does not select by sex or age among the animals available."
    orchestrator: false
  - number: 4
    name: "04_age_error_sd.py"
    description: "Maximum-likelihood standard deviation of the error of epigenetic age estimates, from reference animals of known age."
    orchestrator: false
  - number: 5
    name: "05_estimated_age_numbers.py"
    description: "Expected numbers of sampled animals by sex, true age and estimated age in each sampling year."
    orchestrator: false
  - number: 6
    name: "06_mother_offspring_probabilities.py"
    description: "Probability that a sampled female is the mother of a sampled animal, for samples classified by sampling year, sex and estimated age."
    orchestrator: false
  - number: 7
    name: "07_half_sibling_probabilities.py"
    description: "Probability that two sampled animals are maternal half-siblings, for samples classified by sampling year, sex and estimated age."
    orchestrator: false
  - number: 8
    name: "08_self_recapture_probabilities.py"
    description: "Probability that a female sampled in one year is the same animal as a female sampled in a later year, by the first sample's estimated age and the second sample's stage."
    orchestrator: false
  - number: 9
    name: "09_comparison_counts.py"
    description: "Number of pairwise comparisons of one kinship type in each class of estimated ages, leaving out the pairs that are not compared."
    orchestrator: false
  - number: 10
    name: "10_pseudo_fisher_information.py"
    description: "Expected pseudo-Fisher information about the six demographic parameters from all pairwise comparisons of a sampling design with estimated ages."
    orchestrator: false
  - number: 11
    name: "11_design_precision.py"
    description: "Expected precision of a sampling design with estimated ages for adult female abundance, adult survival and the calving proportion, and the expected numbers of kin pairs of each type."
    orchestrator: false
  - number: 12
    name: "12_smallest_design_expected_kin_pairs.py"
    description: "Total expected number of mother-offspring pairs, half-sibling pairs and self-recaptures at the smallest annual sample size of a new survey programme that reaches a target CV for adult female abundance, with ages from a fitted clock."
    orchestrator: true
