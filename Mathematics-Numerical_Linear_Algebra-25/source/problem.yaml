paper_doi: "10.48550/arXiv.2604.05065"
dependencies: ""
steps:
  - number: 1
    name: "01_construct_clustered_ls_data"
    description: "Build a clustered-spectrum least-squares instance [A | b]. Draw thin QR factors of Gaussians from numpy Generator default_rng(seed), set A = U diag(s) V^T with prescribed positive singular values s, then draw b from the same generator. Return an array of shape (m, n+1) whose first n columns are A and whose last column is b."
    orchestrator: false
  - number: 2
    name: "02_form_sketched_range"
    description: "Draw one Gaussian sketch S of shape (n_sketch, m) from default_rng(seed) and return Y = S A. The sketch is computed once and reused for CUR index selection; no second embedding is drawn."
    orchestrator: false
  - number: 3
    name: "03_select_cur_indices"
    description: "Select rank-ell CUR row and column indices from a reused sketch. With empty index sets the sketched residual is E_row = Y. Columns J are the first ell LUPP row pivots of Y^T; rows I are the first ell LUPP row pivots of A(:, J). Return the concatenated vector [I, J] as floats."
    orchestrator: false
  - number: 4
    name: "04_cur_core_matrix"
    description: "Form the CUR-CA core from packed indices: unpack [I, J] and return U = A(I, J)^+, the Moore-Penrose pseudoinverse of the intersection submatrix."
    orchestrator: false
  - number: 5
    name: "05_cur_captured_singular_values"
    description: "Compute the captured singular values of a CUR surrogate from its supplied core."
    orchestrator: false
  - number: 6
    name: "06_build_spectral_pinv_factors"
    description: "Build compact numerical factors for the implicit rank-ell spectral inverse."
    orchestrator: false
  - number: 7
    name: "07_preconditioned_lsqr"
    description: "Run a fixed number of right-preconditioned LSQR iterations."
    orchestrator: false
  - number: 8
    name: "08_run_cur_spectral_lsqr"
    description: "Chain the seven numerical steps and return the requested coordinate."
    orchestrator: true
