problem_id: "Biology-Ecology-28"
subject: "biology"
subject_area: "Ecology"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2603.08276"
dependencies: ""
steps:
  - number: 1
    name: "regularized_gamma"
    description: "Evaluate the regularized lower and upper incomplete gamma functions P(a, x) and Q(a, x) = 1 - P(a, x)."
    orchestrator: false
  - number: 2
    name: "regularized_beta"
    description: "Evaluate the regularized incomplete beta function I_x(a, b) together with its complement 1 - I_x(a, b)."
    orchestrator: false
  - number: 3
    name: "poisson_adjusted_moments"
    description: "From a right-censored point-centred quarter survey, compute the estimated censoring quantile m_hat_C and the censoring-adjusted first and second distance moments of the Poisson framework."
    orchestrator: false
  - number: 4
    name: "censored_poisson_densities"
    description: "Compute the censored Cottam-type and censored Pollard-type density estimates from a right-censored point-centred quarter survey."
    orchestrator: false
  - number: 5
    name: "csr_tail_moment"
    description: "Compute the conditional moment E[R^u | R > C] of the l-th nearest-neighbour sector distance under complete spatial randomness with a given density."
    orchestrator: false
  - number: 6
    name: "censored_shen_estimates"
    description: "Compute the censored negative-binomial moment estimates of population density and aggregation parameter from a right-censored point-centred quarter survey."
    orchestrator: false
  - number: 7
    name: "nbd_censored_log_likelihood"
    description: "Evaluate the right-censored negative-binomial log-likelihood of a point-centred quarter survey at a given density and aggregation parameter."
    orchestrator: false
  - number: 8
    name: "nbd_censored_mle"
    description: "Find the joint maximum likelihood estimates of population density and aggregation parameter under the right-censored negative-binomial distance model, together with the maximized log-likelihood."
    orchestrator: false
  - number: 9
    name: "nbd_truncated_moment"
    description: "Compute the partial moment E[R^u; R <= C] of the l-th nearest-neighbour sector distance under the negative-binomial model, together with the censoring probability P(R > C)."
    orchestrator: false
  - number: 10
    name: "asymptotic_shen_bias"
    description: "For a negative-binomial population with known density and aggregation, compute the large-sample limits of the censored Pollard-type initial density and of the censored negative-binomial moment density estimate, and the resulting asymptotic relative bias."
    orchestrator: false
  - number: 11
    name: "censored_design_bias"
    description: "Fit the censored negative-binomial model to a point-centred quarter survey and report the asymptotic relative bias of the censored negative-binomial moment density estimator for that fitted population and the same design."
    orchestrator: true
