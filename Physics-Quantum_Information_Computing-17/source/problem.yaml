steps:
  - number: 1
    name: "01_qutrit_model"
    description: "Construct a two-qutrit synthetic Markovian control model in the basis |i,j> with i first. On one qutrit define X=|0><1|+|1><0|, Y=-i|0><1|+i|1><0|, Z=diag(1,-1,0), N=diag(0,1,2), a=|0><1|+sqrt(2)|1><2| and ell=|2><1|. Return Hamiltonians [1.3 X tensor X, 0.9 Z tensor I+0.7 I tensor Y, 1.1 Y tensor Z+0.4 N tensor I], the feedforward Hamiltonian feedforward*X tensor I, jumps [a tensor I,I tensor a,Z tensor I,I tensor Z,ell tensor I,I tensor ell], rates noise_scale*[1,1,0.7,0.7,0.5,0.5], projectors [diag(1,0,0) tensor I,diag(0,1,1) tensor I], rho=|00><00| and observable=rho as a seven-tuple. Both arguments are finite nonboolean real scalars; the synthetic benchmark domain is noise_scale in [0,1] and feedforward in [-2,2]. Invalid inputs raise ValueError."
    orchestrator: false
  - number: 2
    name: "02_lindblad_generators"
    description: "Return separate coherent and common dissipative superoperators for the supplied Markovian pulse family."
    orchestrator: false
  - number: 3
    name: "03_pulse_channels"
    description: "Return rectangular bivariate channel coefficients for a forward control layer and its physical inverse under the selected control-reversal construction."
    orchestrator: false
  - number: 4
    name: "04_taylor_weights"
    description: "Return the finite-order Taylor mitigation weights for the selected control-reversal construction."
    orchestrator: false
  - number: 5
    name: "05_layer_amplification"
    description: "Construct amplified-layer response coefficients from paired forward and physical-inverse layers for the selected finite-order control-reversal construction."
    orchestrator: false
  - number: 6
    name: "06_dynamic_amplification"
    description: "Compute exact observable-response coefficients for the dynamic circuit at every setting of the selected layerwise control-reversal construction."
    orchestrator: false
  - number: 7
    name: "07_bias_ratio"
    description: "Return the ordinary bivariate power-series coefficients of the signed residual bias fraction defined in the global instance."
    orchestrator: false
  - number: 8
    name: "08_residual_bias"
    description: "Return the scaled mixed noise susceptibility of the specified two-qutrit dynamic circuit by composing the seven upstream operations."
    orchestrator: true
