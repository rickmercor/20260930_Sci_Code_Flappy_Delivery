problem_id: "Chemistry-Computational_Chemistry-6"
subject: "chemistry"
subject_area: "Computational Chemistry"
difficulty: "difficult"
answer_type: "numeric"
paper_doi: "https://doi.org/10.48550/arXiv.2608.26231"
dependencies: ""
steps:
  - number: 1
    name: "slab_resistances"
    description: "Return the bulk transport resistance contributed by each of the two slabs in a steady one-dimensional permeation problem, in the form the source's interface model adds them in. The two slabs measure concentration on scales that differ by the partition, and the returned pair must already account for that. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 2
    name: "first_order_rate_ratio"
    description: "Return the ratio of the forward to the reverse rate constant of a first-order exchange channel that moves an atom across an interface without changing its chemical identity, given the solubility of that atom in each of the two materials. Thermodynamic consistency fixes this ratio completely. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 3
    name: "linear_channel_flux"
    description: "Return the steady flux crossing a two-slab system whose shared interface carries a single first-order exchange channel, with the concentration held fixed on each outer face. The interface contributes a resistance of its own, set by the exchange velocity. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 4
    name: "interfacial_traces"
    description: "Return the two concentrations the solution takes at the shared interface of the first-order two-slab problem, each reported in the units of the side it sits on. Each profile is linear, so each trace follows from the outer value and the flux the slab carries. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 5
    name: "two_sided_damkohler"
    description: "Return the dimensionless group that decides whether a first-order interface may be treated as locally equilibrated, together with the relative error that treatment makes on the flux. The group compares bulk transport against interfacial exchange. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 6
    name: "recombination_rate_ratio"
    description: "Return the ratio of the forward to the reverse rate constant of a channel in which two atoms dissolved in the first material combine into one molecule that dissolves physically in the second. The two solubility constants describe dissociative dissolution on one side and molecular dissolution on the other. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 7
    name: "recombination_interface"
    description: "Solve the steady two-slab problem whose interface carries the recombination channel of the previous step, returning the channel rate and the two interfacial traces. Atoms live in the first slab and molecules in the second, so the two slabs do not carry the same quantity. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 8
    name: "quadratic_channel_damkohler"
    description: "Return the dimensionless group for a channel that is second order in the donor material. Such a channel has no exchange velocity of its own, so one has to be constructed from the rate constant and a concentration, and the source is specific about which concentration that is. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 9
    name: "competing_channel_traces"
    description: "Solve the steady problem in which the same interface carries two channels at once: the recombination channel of the earlier step and a first-order channel that oxidises the atom to a second, more soluble carrier. Both carriers are transported in the second slab with different diffusivities, and each is removed at its outer face. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 10
    name: "branching_ratio_and_exponent"
    description: "Return the ratio measuring how the interface divides its throughput between the two competing channels, and the apparent power law an experiment would report for that interface. The second follows from the first in closed form and is bounded between the two single-channel limits. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 11
    name: "isotopologue_fluxes"
    description: "With two isotopes present in the donor material, recombination populates three molecules rather than one. Return the two like-atom and mixed channel rates, the total atomic budget of the heavier isotope leaving the donor, and the share of that budget carried by the mixed molecule measured across the RECOMBINATION channels only, with the oxidation channel excluded from that share. Every channel here is reversible and each carrier's own interfacial concentration is supplied. A single pair of constants parameterises all three recombination channels. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 12
    name: "governing_damkohler"
    description: "Return the dimensionless group evaluated separately for each side of an asymmetric two-slab system, each against that side's bulk resistance as the earlier resistance step measures it, together with the single one of them that decides whether the interface may be treated as equilibrated. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 13
    name: "reference_branching_ratio"
    description: "Return the branching ratio that indexes the source's map of interface behaviour, formed from the two channel rates evaluated at a supplied reference concentration rather than at a concentration any solve produces. Both carriers are removed at the far face of the second slab, as in the earlier two-channel step. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: false
  - number: 14
    name: "interface_regime_report"
    description: "Run the whole pipeline on one interface and report it. Build the first-order problem from the two solubilities and solve it; build the second-order problem from the two solubility constants and solve it; open both channels together, taking the fluoride diffusivity as a quarter of the molecular one, the oxidation reverse constant as half its forward one, and the heavier isotope at a quarter of the lighter, with every carrier removed at its outer face; then combine the two failure modes into the single indicator the source defines. Report as well the group that decides for this asymmetric pair and the branching ratio at the reference concentration the source builds its map on. The source fixes a convention here that the natural reading does not; follow the source."
    orchestrator: true
