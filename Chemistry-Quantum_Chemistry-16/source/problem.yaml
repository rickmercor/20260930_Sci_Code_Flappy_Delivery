problem_id: "Chemistry-Quantum_Chemistry-16"
subject: "chemistry"
subject_area: "Quantum Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2605.31582"
dependencies: ""
steps:
  - number: 1
    name: "Perfect-pairing occupation numbers and orbital energies."
    description: "A valence has two valence-bond subsystems, and their gaps\n\nare given. Return the pair amplitudes, the four orbital occupation numbers and\n\nthe four perfect-pairing orbital energies."
    orchestrator: false
  - number: 2
    name: "Perfect-pairing reference energy and gap gradient."
    description: "For given valence-bond-subsystem gaps, return the\n\nperfect-pairing reference energy and the gradient of this energy with respect\n\nto each gap."
    orchestrator: false
  - number: 3
    name: "Stationary valence-bond-subsystem gaps."
    description: "Find the VBS gaps that make the perfect-pairing reference\n\nenergy stationary. Return these gaps and the reference energy at these gaps."
    orchestrator: false
  - number: 4
    name: "Generalized Fock matrix of the perfect-pairing reference."
    description: "Return the generalized Fock matrix of the perfect-pairing\n\nreference at its stationary gaps."
    orchestrator: false
  - number: 5
    name: "Pairing and double-counting intermediates."
    description: "At the stationary gaps, return the two-body intermediates\n\nthat the excitation energies of the valence use many times."
    orchestrator: false
  - number: 6
    name: "Single electron-transfer channel."
    description: "The two orbital labels are given. For these labels, find the\n\nelectron-transfer combination that the source method uses. Return its squared\n\nnorm, its excitation energy and the square of its reference coupling."
    orchestrator: false
  - number: 7
    name: "Remaining valence channels grouped by seniority."
    description: "Return the second-order Epstein-Nesbet energy contributions\n\nof all valence excitations other than the single electron transfers. Group\n\nthem by the seniority of the excited state."
    orchestrator: false
  - number: 8
    name: "Second-order valence correction to perfect pairing"
    description: "Add the single electron-transfer\n\nchannels and the remaining valence channels to get the complete second-order\n\nEpstein-Nesbet correction to the perfect-pairing reference. Give the result in\n\nmillihartree."
    orchestrator: true
