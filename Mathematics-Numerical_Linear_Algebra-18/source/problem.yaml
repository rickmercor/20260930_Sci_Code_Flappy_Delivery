    description: "Compute the static response of the interior of substructure k to unit displacement at each interface degree of freedom in turn, the remaining interface degrees of freedom being held at zero."
    orchestrator: false
  - number: 5
    name: "residual_modes"
    description: "Compute the first-order residual modes of substructure k and scale each column to unit Euclidean length."
    orchestrator: false
  - number: 6
    name: "reduced_eigenvalues"
    description: "Compute the eigenvalues of the reduced system obtained by projecting the augmented system back to the dimension of its unaugmented part."
    orchestrator: false
  - number: 7
    name: "base_contribution"
    description: "Extract the part of one reduced mode that is carried by the unaugmented columns of the basis."
    orchestrator: false
  - number: 8
    name: "relative_deviation"
    description: "Express the Rayleigh quotient of a trial vector as a relative deviation from a reference eigenvalue."
