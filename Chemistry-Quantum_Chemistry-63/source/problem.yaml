problem_id: "Chemistry-Quantum_Chemistry-63"
subject: "chemistry"
subject_area: "Quantum Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1063/5.0323822"
dependencies: ""
steps:
  - number: 1
    name: "Born-Oppenheimer Hamiltonian of the vibronic model"
    description: "Return the real and the imaginary part of the two-state Born-Oppenheimer Hamiltonian of the gapped two-mode vibronic model at one nuclear configuration."
    orchestrator: false
  - number: 2
    name: "Phase-fixed adiabatic electronic states"
    description: "Diagonalise that Hamiltonian and return the two adiabatic states with their phases fixed by requiring the second component of each to be real and non-negative, lower state first."
    orchestrator: false
  - number: 3
    name: "Berry connections of the two adiabatic states"
    description: "Return the Berry connections of the lower and the upper adiabatic state, in the orthonormal polar frame of the nuclear plane."
    orchestrator: false
  - number: 4
    name: "Geometric phase of the lower state on the loop"
    description: "Integrate the Berry connection of the lower state anticlockwise around the circle of radius Q on an equally spaced grid and return the geometric phase."
    orchestrator: false
  - number: 5
    name: "Derivative coupling between the adiabatic states"
    description: "Return the matrix element of the nuclear gradient taken between the upper adiabatic state on the left and the lower one on the right, in the orthonormal polar frame."
    orchestrator: false
  - number: 6
    name: "Divergence of the derivative-coupling field"
    description: "Return the divergence, in the nuclear plane, of the derivative-coupling field of the previous step."
    orchestrator: false
  - number: 7
    name: "Diagonal correction to the potential energy surface"
    description: "Return the term the exact factorization adds to the Born-Oppenheimer surface in the scalar potential of the nuclear equation, at one nuclear configuration."
    orchestrator: false
  - number: 8
    name: "Ground state of the nuclear factor"
    description: "Solve the radial nuclear equation of the exact factorization on the given grid and return that grid together with the ground-state radial function on it."
    orchestrator: false
  - number: 9
    name: "Nuclear momentum function at the loop"
    description: "Return the nuclear momentum function of the exact-factorization framework at the loop radius, built from the solved nuclear ground state."
    orchestrator: false
  - number: 10
    name: "Matrix element of the electron-nuclear correlation operator"
    description: "Return the matrix element of the electron-nuclear correlation operator between the upper adiabatic state on the left and the lower one on the right, without the mass-ratio prefactor."
    orchestrator: false
  - number: 11
    name: "Leading correction to the Berry connection"
    description: "Return the first-order correction, in the mass ratio, to the Berry connection of the lower adiabatic state."
    orchestrator: false
  - number: 12
    name: "Relative size of the nonadiabatic correction"
    description: "Run the whole pipeline and return the correction to the geometric phase as a percentage of the uncorrected phase on the same loop."
    orchestrator: true
