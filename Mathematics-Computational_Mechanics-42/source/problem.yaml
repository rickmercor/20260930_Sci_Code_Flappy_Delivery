steps:
  - number: 1
    name: "normal_stiffness"
    description: "Return the source's normal fracture deformation relation g_n(q_n), which maps the normal fracture contact traction to the normal deformation of the fracture (the paper's Eq. 15). Two variants are used: the linear (Schoenberg) relation selected by model='Lin', and the nonlinear Barton-Bandis relation selected by model='BB', which additionally depends on the maximum allowed fracture closure du_max and stiffens as the fracture closes toward it. Recover both exact expressions from the paper; the Barton-Bandis relation is NOT the linear one and its denominator is the source's."
    orchestrator: false
  - number: 2
    name: "normal_traction"
    description: "Return the normal fracture contact traction produced by a prescribed normal displacement jump, for both families of fracture deformation model. For the spring model (contact=False) the traction is whatever the source's normal relation of Eq. 15 gives when the deformation equals the displacement jump (the paper's Eq. 9), so the fracture can carry traction of either sign. For the contact mechanics model (contact=True) the source instead imposes the unilateral non-penetration conditions of Eq. 12, under which the traction is never tensile and vanishes wherever the fracture is open. Invert the source's relation exactly; the Barton-Bandis inversion is not the linear one."
    orchestrator: false
  - number: 3
    name: "friction_bound"
    description: "Return the Coulomb friction bound of the source's contact model from the normal contact traction and the coefficient of friction (the paper's Eq. 10). The source's sign convention has the normal contact traction non-positive in compression, and the bound must come out non-negative so that it can bound a magnitude. Recover the exact expression, including its sign, from the paper."
    orchestrator: false
  - number: 4
    name: "coulomb_return"
    description: "Apply the source's radial-return map to the tangential fracture traction (the inner projection of the paper's Eq. 13, the Alart-Curnier reformulation of the Coulomb conditions of Eq. 11). A trial tangential traction is formed from the current tangential traction and the tangential velocity jump scaled by the numerical parameter c, and is then scaled back onto the friction cone when it exceeds the bound and left untouched when it does not. The bound is clipped at zero before the comparison so that an open fracture returns no tangential traction. Recover the exact form of the map from the paper. Two-dimensional setting, so the tangential direction has a single component and the norm is the absolute value."
    orchestrator: false
  - number: 5
    name: "contact_state"
    description: "Classify the mechanical state of each point of a fracture in the source's contact model. Row 0 is the fracture opening as the source defines it in Section 2.3.3, that is the part of the normal displacement jump not accounted for by the elastic normal deformation of Eq. 15. Row 1 is the source's slip tendency, the ratio of the tangential traction magnitude to the magnitude of the friction bound; report it as 0.0 wherever the friction bound vanishes, since row 2 already records that the point is open. Row 2 encodes the source's three contact states as 0 for open, 1 for sticking and 2 for sliding, using the source's own criteria: a point with no contact traction is open, a point in contact whose slip tendency is below one is sticking, and a point in contact whose slip tendency has reached one is sliding. Recover the definitions of the opening and the slip tendency from the paper."
    orchestrator: false
  - number: 6
    name: "newmark_update"
    description: "Advance velocity and acceleration by one step of the time integrator the source uses for the elastic wave equation and for the tangential velocity jump (the paper's Eqs. 20-21), given the newly computed displacement and the previous displacement, velocity and acceleration. The source uses the standard parameter choice stated in the paper. Recover both update formulas exactly; they are the Newmark relations written with the new displacement as the known quantity, not a simple finite difference of the displacement."
    orchestrator: false
  - number: 7
    name: "absorbing_matrix"
    description: "Return the coefficient matrix of the source's absorbing boundary condition, which relates the boundary traction to the boundary velocity so that outgoing waves leave the domain without reflecting (the paper's Eq. 19). The matrix is built from the density and the two Lame parameters and is NOT isotropic: it applies one wave impedance along the boundary normal and a different one in the directions tangential to it, because pressure and shear waves travel at different speeds. Recover the exact matrix, including which impedance goes with which direction, from the paper."
    orchestrator: false
  - number: 8
    name: "fracture_audit"
    description: "Run the full fracture deformation audit over the source's four model variants, in the order S-Lin-Lin, S-Lin-BB, C-Coul-Lin, C-Coul-BB, on the declared fixed fracture configuration with all prescribed jumps scaled by load_scale. For each variant compute the normal contact traction from the prescribed normal displacement jump under that variant's normal relation and model family, then the tangential traction: for the two spring variants the tangential relation of Eq. 16 applies, whereas for the two contact variants the tangential traction follows from the source's radial-return map starting from zero traction with the declared numerical parameter. Then classify the fracture points and advance the tangential jump by one step of the source's time integrator, taking the new tangential jump to be the prescribed tangential jump plus the tangential traction divided by the tangential stiffness. Also advance the normal jump by the same integrator, taking the new normal jump to be the prescribed normal jump plus the normal traction divided by the normal stiffness, and build the absorbing boundary coefficient matrix for the declared material and the outward normal (1, 0); at each fracture point apply that matrix to the two-component velocity (updated normal velocity jump, updated tangential velocity jump) and sum the magnitudes of the resulting boundary tractions. Report the row [sum of normal tractions, sum of tangential traction magnitudes, sum of fracture openings, largest slip tendency, number of open points, number of sticking points, number of sliding points, norm of the updated tangential velocity jump, summed absorbing-boundary traction magnitude, sum of the elastic normal closure g_n(q_n)]. Assemble by calling the earlier sub-problem functions; every earlier step must be reached."
    orchestrator: true
