steps:
  - number: 1
    name: "mpfc_spectral_operators"
    description: "Evaluate, by the Fourier spectral method on a uniform periodic grid, a fixed list of spatial operators applied to one real periodic field $u$. The field is $d$-dimensional for ****any**** $d\\\\ge1$, not two-dimensional only, and the list is: the $d$ first partial derivatives $\\\\partial_{x_0}u,\\\\dots,\\\\partial_{x_{d-1}}u$ in axis order, then the Laplacian $\\\\Delta u$, the bi-Laplacian $\\\\Delta^2u$, the ****shifted bi-Laplacian**** $(\\\\Delta+1)^2u$, and the ****mean-free inverse Laplacian**** $\\\\chi[u]$, defined as the unique periodic solution of $-\\\\Delta\\\\chi = u-\\\\bar u$ with $\\\\int_\\\\Omega\\\\chi = 0$, where $\\\\bar u$ is the spatial mean of $u$. Return them all stacked along a new leading axis, in that order, so that the shape is `(d + 4,) + u.shape` - six planes when $d=2$, five when $d=1$, seven when $d=3$. Each operator is applied by transforming, multiplying by its symbol, transforming back and taking the real part; ****no dealiasing of any kind is applied**** and the Nyquist wavenumber is kept exactly as `numpy.fft.fftfreq` returns it, which matters on every axis with an even number of points. The last two entries are graded separately from the derivatives because the whole model rides on them: the shifted bi-Laplacian is the operator whose symbol is degenerate on a sphere of wavenumbers, and the mean-free inverse Laplacian is the only operator here whose symbol has to be defined by hand at $k=0$."
    orchestrator: false
  - number: 2
    name: "mpfc_free_energy"
    description: "Evaluate the discrete free energy of the model on one density field and split it into the two parts the scheme treats differently. Return the real array $[E,\\\\;E_{\\\\rm quad},\\\\;E_1,\\\\;\\\\bar\\\\phi]$ of shape `(4,)`, where $E_{\\\\rm quad}=\\\\tfrac12(\\\\phi,(\\\\Delta+1)^2\\\\phi)_h$ is the quadratic block, $E_1$ is everything else - the quartic bulk term, the temperature term and the long-range term - $E=E_{\\\\rm quad}+E_1$ is the total free energy of the model as printed in the problem statement, and $\\\\bar\\\\phi$ is the spatial mean of $\\\\phi$. The split is not cosmetic: the scheme of the source treats $E_{\\\\rm quad}$ implicitly through its Fourier symbol and $E_1$ through an auxiliary variable, so an implementation that puts one term on the wrong side of the split is running a different scheme."
    orchestrator: false
  - number: 3
    name: "mpfc_sav_terms"
    description: "Evaluate the two field-valued quantities the time-stepping needs at a given density layer. Return the real array $[\\\\,\\\\mathcal H(\\\\phi),\\\\;\\\\mu(\\\\phi)\\\\,]$ of shape `(2,) + phi.shape`, where $\\\\mu$ is the ****chemical potential of the original model****, the variational derivative of the free energy of step 2, and $\\\\mathcal H$ is the ****nonlinear map of the source's scalar-auxiliary-variable reformulation****: the variational derivative of $E_1$ alone, divided by the square root of $E_1$ shifted by the positive constant $C_{SAV}$. Both must be evaluated at the **same** argument: in particular the radicand is $E_1$ of the field passed in, never $E_1$ of some earlier layer. Raise `ValueError` if that radicand is not strictly positive, which is the condition on $C_{SAV}$ the source states and the only thing that makes the reformulation legitimate."
    orchestrator: false
  - number: 4
    name: "mpfc_butcher"
    description: "Build the pair of Butcher tableaux this scheme runs on from the source's ****general coefficient family****, and certify it. The source displays one explicit pair of tableaux and then, separately, the family of pairs its stability and accuracy proofs actually permit, parameterised by five free real constants - in the source's own notation $\\\\tilde a_{11},\\\\tilde a_{32},\\\\tilde a_{33},a_{31},a_{43}$, of which three must be nonzero. Given those five constants, return the concatenated real array of shape `(49,)` holding, in this order: the $4\\\\times4$ implicit tableau $\\\\tilde A$ flattened row by row (16 entries), the $4\\\\times4$ explicit tableau $A$ flattened row by row (16 entries), the weight vector $b$ (4 entries), the residuals of the source's ****nine**** order conditions for third-order temporal accuracy, each written as left-hand side minus right-hand side and taken in the source's own order (9 entries), and the four eigenvalues of the energy-stability matrix $P=D\\\\tilde A+\\\\tilde A^{T}D-bb^{T}$ with $D=\\\\operatorname{diag}(b)$, sorted ascending (4 entries). Raise `ValueError` if any of the three constants the family requires to be nonzero is zero."
    orchestrator: false
  - number: 5
    name: "mpfc_stage_solve"
    description: "Carry out one Runge-Kutta stage of the source's scheme in Fourier space. The stage is implicit in two coupled unknowns - a field increment and a scalar increment - and the source eliminates them by writing the field increment as an affine function of the scalar. Given the ****accumulated density**** $\\\\psi$ that the implicit tableau builds for this stage, the nonlinear map $\\\\mathcal H$ of step 3 already evaluated at this stage's explicit argument, the ****accumulated auxiliary variable**** $\\\\rho$, the diagonal entry $\\\\tilde a_{ll}$ of the implicit tableau and the step $\\\\delta t$, return the real array $[\\\\mathcal A,\\\\;\\\\mathcal B,\\\\;\\\\phi_{k},\\\\;r_{k}]$ of shape `(4,) + acc.shape` - the argument named `acc` in the signature is that $\\\\psi$ - where $\\\\mathcal A$ and $\\\\mathcal B$ are the two fields of the source's affine decomposition, $\\\\phi_k$ is this stage's density increment and the last plane is ****constant****, equal to this stage's scalar increment $r_k$."
    orchestrator: false
  - number: 6
    name: "mpfc_time_step"
    description: "Advance the pair (density, auxiliary variable) by one step of the source's four-stage scheme. Build the two tableaux and the weights with step 4; for each of the four stages assemble the three arguments step 5 needs - the density accumulated with the ****implicit**** tableau, the nonlinear map $\\\\mathcal H$ of step 3 evaluated at the density accumulated with the ****explicit**** tableau, and the auxiliary variable accumulated with the ****implicit**** tableau - solve the stage, and combine the four stage increments with the weights. Return the real array $[\\\\phi^{n+1},\\\\;r^{n+1}]$ of shape `(2,) + phi.shape`, whose second plane is ****constant**** and equal to the new auxiliary variable. Which tableau feeds which argument, and whether the diagonal entry is included in each accumulation, are the two things this step is graded on."
    orchestrator: false
  - number: 7
    name: "mpfc_modified_energy"
    description: "Evaluate the ****modified discrete energy**** the scheme actually dissipates, and compare it with the original free energy of step 2 on the same layer. Return the real array $[E_{\\\\rm mod},\\\\;E,\\\\;E_{\\\\rm mod}-E,\\\\;r-\\\\sqrt{E_1(\\\\phi)+C_{SAV}}\\\\,]$ of shape `(4,)`. The modified energy is the quadratic block of step 2 plus the square of the auxiliary variable minus the shift constant; it is a function of the **pair** $(\\\\phi,r)$, and it coincides with the original free energy exactly when $r$ is the square root it was initialised as. The last entry is that discrepancy, the quadratization's own consistency error, and it is what makes the two energies separate along a run."
    orchestrator: false
  - number: 8
    name: "mpfc_energy_identity"
    description: "Evaluate, term by term, the exact algebraic identity that the source's energy-dissipation theorem is proved from, for one step taken from the layer $(\\\\phi^n,r^n)$. Writing $\\\\mathcal L=(\\\\Delta+1)^2$ for the quadratic operator and $(\\\\cdot,\\\\cdot)_h$ for the grid inner product of step 2, the theorem rewrites the change in the quadratic part of the energy as a ****stage-work**** term and a ****quadratic-form**** term built from the same matrix $P$ that step 4 returns the eigenvalues of. Return the real array of shape `(4,)` holding, in order: $(\\\\phi^{n+1},\\\\mathcal L\\\\phi^{n+1})_h$, $(\\\\phi^{n},\\\\mathcal L\\\\phi^{n})_h$, the stage-work term and the quadratic-form term. The four are not independent: the first equals the second plus the third minus the fourth, to round-off, and that is the identity this step certifies. Raise `ValueError` on the same invalid inputs as the single step of step 6."
    orchestrator: false
  - number: 9
    name: "mpfc_rksav_run"
    description: "Run the whole benchmark. Build the initial density from the closed form below on the requested grid and box; initialise the auxiliary variable as the exact square root of the shifted nonlinear energy of that initial density; advance $n_steps$ steps of size $dt$ with the step of step 6 and the coefficient family member of step 4. The energy of the final layer is ****assembled from two halves****: its quadratic block is read off the energy identity of step 8, evaluated on the layer the ****last**** step starts from, whose first entry is exactly that block; the nonlinear block, bulk and long-range together, comes from step 2. Return their sum ****divided by the area of the domain****. With $n_steps$ zero no step is taken, there is no identity to read, and the quadratic block is the initial one. Setting `quantity` selects a diagnostic instead: `'energy0'` the initial free-energy density, `'emod'` and `'emod0'` the modified discrete energy density of the final and of the initial layer, `'quad'` the quadratic block of the final layer divided by the area, `'r'` the final auxiliary variable, `'mass'` the relative drift of the spatial mean over the run, `'drift'` the absolute distance between the auxiliary variable carried by the scheme and the square root recomputed from the final density, and `'work'` and `'qform'` the stage-work term and the quadratic-form term that step 8 returns for that last step, each divided by the area and each zero when $n_steps$ is zero."
    orchestrator: true
