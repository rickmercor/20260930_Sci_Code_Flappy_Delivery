dependencies: ""
steps:
  - number: 1
    name: "edge_frames"
    description: "Given the node coordinates of a spatial network and its list of edges, return one row per edge holding, in order, the three components of that edge's unit tangent vector, the edge length, and then one entry per node giving the source's orientation sign of that edge with respect to that node, or zero when the node is not an endpoint of the edge. The sign convention is the source's and is fixed by the direction of the edge tangent relative to the node; recover it from the paper. Raise ValueError on an edge of zero length."
    orchestrator: false
  - number: 2
    name: "timoshenko_operators"
    description: "Assemble the block operators of the source's beam equations of motion for one edge. Return a stack of three 6x6 matrices: first the block-diagonal coefficient matrix pairing the force resultants with the moment resultants, second the block-diagonal coefficient matrix pairing the displacement with the rotation, and third the source's tangent-coupling operator, the linear map built from the edge tangent that couples the two three-component halves of the state in the way the source's equations of motion require. Its structure is the source's convention, so recover it from the paper rather than assuming a symmetric or diagonal form."
    orchestrator: false
  - number: 3
    name: "hdg_local_matrices"
    description: "Build the five edge matrices of the source's hybrid dual mixed formulation on a single edge, using the Legendre polynomial basis of degree at most p in the arclength parameter, taken component by component so that the degree-of-freedom index is component*(p+1) + mode. Return a stack of five N x N matrices in this order: the matrix of the source's dual bilinear form, the matrix of the source's mixed form coupling the dual and primal variables, the plain mass matrix, the matrix of the source's auxiliary bilinear form used by the first-order-in-time formulation, and the matrix that collects the two endpoint traces. The mixed form contains a derivative contribution together with the tangent coupling of the previous sub-problem; its exact composition is the source's. Integrate exactly with Gauss-Legendre quadrature on 2p+6 points. Raise ValueError unless p >= 0 and the length is positive."
    orchestrator: false
  - number: 4
    name: "hdg_numerical_flux"
    description: "Evaluate the source's HDG numerical flux at both endpoints of one edge. Row 0 is the value at the start node of the edge and row 1 the value at the end node. The flux combines the endpoint trace of the dual variable, carried with that endpoint's orientation sign, and a stabilisation contribution proportional to the mismatch between the endpoint trace of the primal variable and the hybrid nodal value there. The exact combination, including which variable the stabilisation penalises, is the source's; recover it from the paper. The 12-vector of hybrid values holds the start-node value in its first six entries and the end-node value in the last six."
    orchestrator: false
  - number: 5
    name: "edge_local_solver"
    description: "Reconstruct the three interior fields of one edge from the hybrid nodal data, by solving the edge-local block system of the source's fully discrete scheme. Return them stacked as rows in the order dual, primal, auxiliary. The block system couples the dual bilinear form, the mixed form and its transpose, the stabilised trace term and the two mass couplings that carry the time discretisation; its exact block structure and the way the hybrid data enters the two right-hand sides are the source's. The 12-vector of hybrid values holds the start-node value in its first six entries and the end-node value in the last six, and nu0 and nuL are that edge's orientation signs at the start and end nodes. Raise ValueError unless dt and tau are positive. Assemble by calling the earlier sub-problem functions."
    orchestrator: false
  - number: 6
    name: "condensed_node_system"
    description: "Eliminate every edge interior and assemble the source's condensed system on the free nodes, returning the operator with the load vector appended as a final column. Free nodes are those not in the Dirichlet set, ordered by increasing node index, with the six components of a node occupying consecutive rows. The condensed operator is obtained by substituting the edge-local reconstructions into the source's nodal condition, which is imposed on the numerical flux rather than on the dual variable directly, summed over the edges incident to each free node with each edge's own orientation sign. Contributions of Dirichlet nodes move to the load vector. The resulting operator is symmetric positive definite. Assemble by calling the earlier sub-problem functions."
    orchestrator: false
  - number: 7
    name: "network_time_step"
    description: "Advance the network state by one step of the source's energy-conservative implicit time discretisation and return the hybrid nodal values on the free nodes at the new time level. The two per-edge right-hand sides carry the previous dual, primal and auxiliary fields together with the previous hybrid nodal state, each with the weight the source's scheme gives it; the previous hybrid state is supplied per edge as a 12-vector, start node first. How the source treats quantities that sit between two time levels, and the weights that follow from it, must be recovered from the paper, and they are what make the discrete energy exactly conserved rather than merely bounded. Assemble by calling the earlier sub-problem functions."
    orchestrator: false
  - number: 8
    name: "graph_forms"
    description: "Assemble the source's two graph-level bilinear forms on the free nodes and return them stacked, the mass-type form first and the weighted graph Laplacian-type form second. Both are built by summing a contribution from every edge of the network, each written in terms of the values the nodal function takes at that edge's two endpoints and weighted by that edge's length. One form sees those two endpoint values separately, the other sees only their difference, and the two carry opposite powers of the edge length together with a common numerical prefactor. The exact weights, the prefactor and which power goes with which form are the source's convention; recover them from the paper rather than assuming an unweighted graph Laplacian. Free nodes are those not in the Dirichlet set, ordered by increasing node index, with the six components of a node occupying consecutive rows; endpoints that are Dirichlet nodes contribute nothing. Raise ValueError on an edge of zero length."
    orchestrator: false
  - number: 9
    name: "beam_network_audit"
    description: "Run the whole scheme on the three declared network configurations and return one row each. A configuration with n_nodes nodes and integer parameter a places node j at [((3j+a) mod 7) - 3, ((5j+2a) mod 11) - 5, ((2j+3a) mod 13) - 6] divided by 3, joins j to j+1 for every j below n_nodes-1 and j to j+3 for every j below n_nodes-3, and holds nodes 0 and n_nodes-1 fixed with prescribed nodal values of zero. Edge k carries the coefficient blocks I + c outer(w, w) with w the normalisation of [((k+1) mod 3)+1, ((k+2) mod 4)+1, ((k+3) mod 5)+1] and c equal to 0.6, 0.9, 0.4 and 0.7 for the four blocks in the order used by the earlier sub-problems. The three configurations are (n_nodes, a) = (7, 3), (6, 5) and (8, 2), all at polynomial degree 3, stabilisation 1.0 and 24 steps of size 0.02*dt_scale. The initial primal field on edge k is the L2 projection onto the polynomial space of the function whose component c at arclength x is sin((c+1)x/2 + 0.3(k+1))/(c+2), and the initial velocity field is the projection of cos((c+2)x/3 + 0.2(k+1))/(c+3); the initial auxiliary field is obtained from that velocity as the source's first-order formulation prescribes, and the initial dual and hybrid states are NOT free: the source fixes them by its initial constitutive relation together with its nodal condition, and that system has to be solved before the first step. Each row has SEVEN entries: [initial discrete energy, final discrete energy, Euclidean norm of the final free-node hybrid vector, sum over free nodes of the norm of the displacement half of each nodal value, sum over free nodes of the norm of the full nodal value, and then the two constants of the source's spectral equivalence between the condensed node operator and a combination of the two graph forms of the previous sub-problem, ordered SMALLEST FIRST. Those two constants are the extremal generalised eigenvalues of the condensed operator with respect to that combination; the source scales one of the two graph forms by a power of the time step before combining them, and which form and which power is the source's convention, so recover it from the paper. Evaluate the condensed operator at the declared time step with vanishing right-hand sides. Raise ValueError unless dt_scale is positive and finite. Assemble by calling the earlier sub-problem functions, every one of them."
    orchestrator: true
