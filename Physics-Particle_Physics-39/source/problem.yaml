    description: "Recover both temperature branches consistent with a finite-temperature splitting-minus-merging calibration observable, then use an independent Sudakov survival measurement to select the physical branch."
    orchestrator: false
  - number: 7
    name: "07_integrate_exclusive_history_probability.py"
