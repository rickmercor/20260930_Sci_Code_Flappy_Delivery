problem_id: "Chemistry-Computational_Chemistry-3"
subject: "chemistry"
subject_area: "Computational Chemistry"
difficulty: "Difficult"
answer_type: "Numeric"
paper_doi: "https://doi.org/10.48550/arXiv.2607.10761"
dependencies: ""
steps:
  - number: 1
    name: "extract_radial_parameters"
    description: "Collect the four constant coefficients of the radial stretch term of the model potential from its four published parameters, so that the potential can afterwards be evaluated as a fixed linear combination of an exponential and two inverse powers. The radial term is the common prefactor de/(c1 - 6) multiplying a bracket of three contributions in the scaled separation: plus 2(3 - c2) times the exponential, minus (4c2 - c1c2 + c1) times the inverse sixth power, and minus (c1 - 6)c2 times the inverse fourth power. Return the prefactor first, then those three bracket coefficients in that order, each multiplied by the prefactor."
    orchestrator: false
  - number: 2
    name: "radial_potential"
    description: "Evaluate the radial stretch term of the model potential at one or more internuclear separations, using the coefficients of the previous step. The separation enters only through its ratio to the reference length."
    orchestrator: false
  - number: 3
    name: "angular_potential"
    description: "Evaluate the angular part of the model potential at a Cartesian body-frame position, for the symmetry-breaking strength b."
    orchestrator: false
  - number: 4
    name: "hamiltonian"
    description: "Evaluate the total energy of the system at a six-component Cartesian phase-space point (three position components followed by their conjugate momenta), at zero total angular momentum: the rigid-body rotational energy of the fragment, the translational kinetic energy of the departing atom, and the radial and angular potentials."
    orchestrator: false
  - number: 5
    name: "vector_field"
    description: "Return the time derivative of the six-component Cartesian phase-space state generated by the energy function of the previous step, in the same component order as the state."
    orchestrator: false
  - number: 6
    name: "planar_return_map"
    description: "The plane y = 0 with py = 0 is invariant under the flow. Working inside it, start from the point where the polar angle is zero (so the departing atom is on the positive z axis at separation r, with radial momentum pr), fix the remaining momentum from the requested total energy, and integrate until the polar angle has advanced by exactly two pi. Return the separation and radial momentum reached there, together with the elapsed time."
    orchestrator: false
  - number: 7
    name: "locate_periodic_orbit"
    description: "Find a fixed point of the return map of the previous step, treating the separation and the radial momentum as independent unknowns so that closure is checked directly in both section coordinates. Return the converged separation and radial momentum together with the period."
    orchestrator: false
  - number: 8
    name: "orbit_action"
    description: "Return the abbreviated action of the periodic orbit located from the supplied starting guess, that is the integral of the momenta against the coordinates taken once around the orbit. Evaluate it as the integral of twice the kinetic energy over one period."
    orchestrator: false
  - number: 9
    name: "monodromy_matrix"
    description: "Integrate the variational equations of the six-dimensional Cartesian flow alongside the trajectory for exactly one period, starting from the identity, and return the resulting six by six matrix."
    orchestrator: false
  - number: 10
    name: "roaming_stability_report"
    description: "Run the whole chain for the model at the requested total energy and symmetry-breaking strength. Use the published parameter set throughout: perpendicular moment of inertia 2.373409 and axial moment 4.746818 in unified atomic mass units times square angstroms, reduced mass 0.9445 in unified atomic mass units, and for the potential de = 47.0 kcal/mol, re = 1.1 angstroms, c1 = 7.37, c2 = 1.61, ve = 55.0 kcal/mol and alpha = 1.0 inverse square angstroms. Locate the orbit at zero symmetry-breaking and an energy of 0.5 by scanning starting separations between 3.55 and 3.75, taking the first separation from which the iteration converges, then follow it by continuation in n_steps equal increments first in the symmetry-breaking strength at that energy and then in the energy at the requested strength. At the end point compute the period, the abbreviated action, and the one-period matrix; split that matrix into the block acting on the out-of-plane pair (the second position component and its conjugate momentum) and the block acting on the four in-plane components. Return the trace of the out-of-plane block first, then the orbit data."
    orchestrator: true
