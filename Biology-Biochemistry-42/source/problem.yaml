answer_type: "numeric"
paper_doi: "10.1093/nar/gkag807"
dependencies: ""
steps:
  - number: 1
    name: "01_bead_network"
    description: "Place the three-bead sugar-base-phosphate representation of the idealised antiparallel duplex described in the problem statement. Each nucleotide contributes one phosphate bead, one sugar bead and one base bead, in that order; strand A is laid down first along its 5'->3' direction and strand B second along its own 5'->3' direction, so that the two strands run antiparallel and paired nucleotides share a helical rise level. The helical parameters, the bead radii and the strand phase offset are all given in the problem statement."
    orchestrator: false
  - number: 2
    name: "02_contact_class_matrix"
    description: "Assign every bead pair of the duplex to one of the four edENM-NA contact classes defined in Table 1 of the source, or to no contact at all. Return an integer code matrix using 0 for no contact, 1 for the intra-nucleoside class, 2 for the backbone class, 3 for the base-base class and 4 for the van der Waals class. The class definitions, including which bead pairs belong to each class, which sequence separations qualify and the distance criteria that single out specific base-base contacts, are those of the source; the long-range interaction cutoff for the distance-decaying classes is supplied as an argument."
    orchestrator: false
  - number: 3
    name: "03_nucleic_spring_matrix"
    description: "Turn the contact class codes into the edENM-NA spring constant matrix. Each class carries either a fixed strength or the distance-decaying law of equation (2) of the source, with the strength and decay parameters listed for that class in Table 1. One class additionally distinguishes two chemical sub-classes of nucleotide, which the source assigns different fixed strengths. Entries with no contact stay zero and the result is symmetric."
    orchestrator: false
  - number: 4
    name: "04_interface_spring_matrix"
    description: "Extend the nucleic-acid network to the protein-nucleic acid complex by adding the interface springs of the source's edENM-PNA, and return the combined matrix with the nucleic-acid block in the leading positions and the protein beads appended in the order given. The source splits interface contacts into two types according to the chemical class of the protein residue and which nucleic-acid bead it touches, and gives each type its own parameters in Table 1 together with the interface cutoff; that assignment and those parameters are the source's. The source also departs from standard elastic network practice in the topology it builds at the interface, and that rule is the source's too. The residue chemical classes used here are the four stated in the problem statement."
    orchestrator: false
  - number: 5
    name: "05_hessian_matrix"
    description: "Assemble the 3M x 3M Hessian of the elastic network from the bead coordinates and the spring constant matrix, following equation (5) of the source for the off-diagonal three-by-three sub-blocks and completing each diagonal sub-block so that a rigid translation of the whole network costs no energy. Pairs with no spring contribute nothing."
    orchestrator: false
  - number: 6
    name: "06_mode_spectrum"
    description: "Diagonalise the Hessian and return the first n_keep eigenvalues of the vibrational modes, in ascending order. The modes that carry no vibrational information for a network floating in space are excluded, as the source states; how many of them there are follows from the rigid-body motions of a three-dimensional body. The input must be the Hessian of a connected three-dimensional network, which has exactly six such zero-frequency modes; an eigenvalue counts as zero-frequency when its magnitude is at most 1e-8 times the largest eigenvalue magnitude, and a Hessian with any other number of zero-frequency modes is rejected."
    orchestrator: false
  - number: 7
    name: "07_mode_subspace_metrics"
    description: "For each of the first n_modes vibrational modes of the network, return three numbers in this column order: the collectivity degree of the mode as defined in equation (9) of the source, with each bead weighted by the Euclidean magnitude of its displacement vector in the mode (not by its square), the overlap of the mode with the first reference vector as defined in equation (6), and the largest overlap of that mode over the supplied reference vectors. The reference vectors are supplied as columns and are not assumed orthonormal. The same modes are excluded here as in the spectrum step. The input must be the Hessian of a connected three-dimensional network, which has exactly six such zero-frequency modes; an eigenvalue counts as zero-frequency when its magnitude is at most 1e-8 times the largest eigenvalue magnitude, and a Hessian with any other number of zero-frequency modes is rejected."
    orchestrator: false
  - number: 8
    name: "08_binding_stiffening_index"
    description: "Run the end-to-end audit. Build the network of the free duplex and the network of the protein-nucleic acid complex for the supplied configuration by calling the earlier steps in order, take the vibrational spectrum and the per-mode metrics of each network, keep only those modes whose collectivity reaches kappa_min, select among them the mode whose overlap with the first reference field is largest, and return the ratio of the selected eigenvalue of the complex to the selected eigenvalue of the free duplex. The two interaction cutoffs are the ones the source specifies for its two networks. The reference fields are the five probe fields (z^2, 0, 0), (0, z^2, 0), (0, 0, z), (-y, x, 0) and (x, y, 0), evaluated at the bead coordinates of the network under analysis with z measured from the mean height of all beads of that network (protein beads included for the complex) and x, y the bead coordinates themselves, each flattened bead-major into a 3M-vector and normalised; the first field is the bending reference. Raise ValueError if no mode of either network reaches kappa_min."
    orchestrator: true
