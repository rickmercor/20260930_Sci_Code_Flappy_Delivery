problem_id: "Mathematics-Computational_Mechanics-12"
subject: "mathematics"
subject_area: "Computational Mechanics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2608.05717"
dependencies: ""
steps:
  - number: 1
    name: "tdc_surface_frame"
    description: "Build the tangential projector of a surface and the conormal vector of its boundary triad, and report the projector's defining properties. The boundary tangent supplied to this step lies in the membrane surface, as the source assumes along the boundary; it is orthogonal to the surface normal."
    orchestrator: false
  - number: 2
    name: "tdc_fiber_direction"
    description: "Obtain the embedded fiber tangent field from the level-set function and normalise it."
    orchestrator: false
  - number: 3
    name: "tdc_directional_gradient"
    description: "Form the directional surface gradient of the displacement field for the given configuration."
    orchestrator: false
  - number: 4
    name: "tdc_deformation_gradient"
    description: "Assemble the in-plane surface deformation gradient, its inverse, and both transposes, each from the projector of the correct configuration."
    orchestrator: false
  - number: 5
    name: "tdc_deformation_properties"
    description: "Verify the paper's algebraic identities for the surface deformation gradient and report its rank and singularity."
    orchestrator: false
  - number: 6
    name: "tdc_strain_measures"
    description: "Evaluate the right Cauchy-Green tensor, its principal stretches, the incompressible third stretch, the deformed thickness and the spectral reconstruction."
    orchestrator: false
  - number: 7
    name: "tdc_audit"
    description: "Integrate the previous six functions into the declared six-row audit."
    orchestrator: false
  - number: 8
    name: "tdc_fiber_kinematics"
    description: "Build the fiber projector from the unit fiber tangent and form the fiber deformation gradient and the fiber right Cauchy-Green tensor by the same construction the source uses for the membrane. Report the three fiber principal stretches. The fiber tensor is not of the same rank as the membrane one, and the relation that fixes the two transverse fiber stretches from the first is the one the source prescribes for incompressible fibers; it is not the membrane relation."
    orchestrator: false
  - number: 9
    name: "tdc_strain_energies"
    description: "Evaluate the stored energy density of the membrane and of the fibers for general multi-term Ogden laws, together with the two derivatives the source needs for its stress tensors. Both energies are written for incompressible material, but the membrane and the fiber eliminate their transverse stretches by different relations, so the two energy expressions do not have the same form."
    orchestrator: false
  - number: 10
    name: "tdc_coupled_energy"
    description: "The final orchestrator. Call the earlier step functions rather than reimplementing them. Chain the membrane kinematics and the fiber kinematics, evaluate both stored energies, and combine them into the total coupled energy density the way the source's total energy of the coupled model does. The membrane term carries the membrane thickness. The fiber term is not added bare: the source weights it by the fiber cross-section the section on the numerical setup fixes, and by the length measure of the un-normalised fiber tangent field, so the fiber energy density becomes a surface density like the membrane one."
    orchestrator: true
