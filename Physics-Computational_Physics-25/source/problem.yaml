problem_id: "Physics-Computational_Physics-25"
subject: "physics"
subject_area: "Computational Physics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1016/j.ijheatmasstransfer.2026.128400"
dependencies: ""
steps:
  - number: 1
    name: "01_assemble_near_field_operators"
    description: "Assemble the conductance and capacity operators of the layered near field, including the convective surface term of the heated patch."
    orchestrator: false
  - number: 2
    name: "02_assemble_patch_load_vector"
    description: "Assemble the consistent nodal vector through which the convective patch drives the near field, before it is scaled by the ambient temperature history."
    orchestrator: false
  - number: 3
    name: "03_assemble_scaling_surface_coefficients"
    description: "Assemble the three radial coefficient matrices of the unbounded far field from the scaling-surface coordinate map, frozen at a prescribed radial coordinate."
    orchestrator: false
  - number: 4
    name: "04_solve_far_field_conduction_matrix"
    description: "Solve the matrix quadratic of the scaling-surface far field for the steady-state conduction matrix that condenses the whole exterior onto the interface."
    orchestrator: false
  - number: 5
    name: "05_compute_precise_propagator"
    description: "Build the propagator of the semi-discrete thermal system over one interval by the precise integration algorithm, with the increment held apart from the identity."
    orchestrator: false
  - number: 6
    name: "06_integrate_temperature_field"
    description: "March the semi-discrete thermal system from a uniform initial state to the end of the analysis, combining the exact propagators supplied by sub-problem 05 with a quadratured particular integral."
    orchestrator: false
  - number: 7
    name: "07_solve_thermoelastic_displacement"
    description: "Solve the one-way coupled elastic problem driven by a given temperature field, with the base restrained and the vertical faces on normal rollers."
    orchestrator: false
  - number: 8
    name: "08_compute_peak_stress_and_heave"
    description: "Recover the element-centroid stresses from the displacement and temperature fields and report the peak equivalent stress together with the peak heave of the free surface."
    orchestrator: false
  - number: 9
    name: "09_compute_surface_gradient"
    description: "Measure the steepness of the thermal front in the uppermost stratum as the largest magnitude of the depth derivative of temperature over the centroids of that stratum's elements."
    orchestrator: false
  - number: 10
    name: "10_run_constraint_dominance_pipeline"
    description: "Chain the sub-problem functions 01-09 end-to-end over the three stratification orders and return the constraint dominance index of the layered half-space. Orchestrator: yes - this is the final step; it integrates the earlier sub-problems (assemble_near_field_operators, assemble_patch_load_vector, assemble_scaling_surface_coefficients, solve_far_field_conduction_matrix, compute_precise_propagator, integrate_temperature_field, solve_thermoelastic_displacement, compute_peak_stress_and_heave, compute_surface_gradient) rather than reimplementing them."
    orchestrator: true
