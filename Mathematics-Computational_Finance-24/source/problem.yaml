dependencies: ""
steps:
  - number: 1
    name: "01_heston_cos_put_prices"
    description: "Compute deterministic European put prices using Zhang, Wu, Xiao, Gong, and Xu's FVSJ Fourier-cosine pricing construction specialized to the single-factor Heston limit. The reduction sets lambda = 0, kappa_2 = theta_2 = sigma_2 = 0 and H_1 = H_2 = 1/2, so only the first stochastic-variance factor remains and Delta_1 = sigma_1.\n\n\n\nFor each strike and maturity, construct the Heston-limit characteristic function of terminal log-moneyness, compute the first and second cumulants used by the COS truncation window, evaluate the paper's European-put COS payoff coefficients, and sum the truncated Fourier-cosine expansion. The benchmark uses the conventional half-weight on the k = 0 COS summand and constructs the truncation window from max(abs(c2), 1e-10).\n\n\n\nThis step is the deterministic offline reference pricer used to generate synthetic market prices and supervised PCKAN training labels. It does not construct or train the PCKAN, evaluate the physics-informed loss, or perform differential-evolution calibration."
    orchestrator: false
  - number: 2
    name: "02_pckan_training_data"
    description: "Construct the deterministic supervised and collocation datasets used to train the benchmark PCKAN surrogate. Cross the four prescribed kappa_1 values, four prescribed theta_1 values, and five benchmark European-put contracts to obtain exactly 80 rows. For each row, construct the six benchmark-scaled PCKAN input coordinates (S0/100, K/100, T, r, kappa_1/4, theta_1/0.12) and generate the supervised target using the frozen Step-01 Heston-limit FVSJ Fourier-cosine European-put pricer.\n\n\n\nReturn the training inputs, supervised put-price targets, an independent collocation-input copy, and the corresponding physical rows (K, T, kappa_1, theta_1). The ordering is kappa_1 slowest, theta_1 next, and contract fastest. This step performs only deterministic dataset construction. It does not apply tanh, evaluate Chebyshev polynomials, construct or initialize the PCKAN, evaluate the physics residual, train the network, or perform differential-evolution calibration."
    orchestrator: false
  - number: 3
    name: "03_pckan_forward"
    description: "Initialize the deterministic benchmark PCKAN and evaluate its untrained forward map on the six benchmark-scaled input coordinates supplied by Step 02. The step applies tanh coordinatewise, evaluates the second-kind Chebyshev basis through order 3, combines the basis values through a width-8 CKAN hidden layer, and applies the scalar linear readout. Network parameters are initialized deterministically in PyTorch float64 using seed 0, with the CKAN coefficient tensor drawn before the readout weights and the output bias set to zero.\n\n\n\nThe step returns the untrained scalar predictions together with the initialized CKAN coefficient tensor, readout weights, and output bias. Training-data construction, FVSJ/COS pricing, physics-residual evaluation, parameter optimization, and differential-evolution calibration are excluded from this step."
    orchestrator: false
  - number: 4
    name: "04_pckan_physics_residual"
    description: "Compute the PCKAN price prediction and the Black\u2013Scholes physics residual, together with the first derivative with respect to physical spot, the second derivative with respect to physical spot, and the first derivative with respect to time to maturity.\n\n\n\nUse the initialized PCKAN coefficients and readout parameters supplied as inputs, preserving the Step-03 tanh transformation and second-kind Chebyshev expansion. Evaluate all required derivatives with PyTorch automatic differentiation in float64 arithmetic.\n\n\n\nThe network spot coordinate is S0/100, so convert derivatives with respect to that scaled coordinate into derivatives with respect to physical spot using the appropriate chain-rule factors. Treat T as time to maturity and use sigma_phys = sqrt(v0) = 0.2 in the Black\u2013Scholes residual.\n\n\n\nThis step performs forward evaluation and physics-residual computation only. It must not update the PCKAN parameters, construct a training loss, run Adam optimization, or perform differential-evolution calibration."
    orchestrator: false
  - number: 5
    name: "05_train_pckan"
    description: "Deterministic physics-informed training of the benchmark PCKAN\n\n(Zhang et al., Mathematics 2026, 14, 1529).\n\n\n\nThis step trains the fixed PCKAN architecture defined by the preceding steps using the 80-row supervised Heston-limit FVSJ COS pricing dataset and the corresponding collocation inputs. The model is initialized deterministically with torch.manual_seed(0), with the CKAN coefficient tensor drawn first, the linear readout weights drawn second, and the scalar output bias initialized to zero.\n\n\n\nTraining uses full-batch Adam for exactly 500 parameter updates with learning rate 1e-3, beta1=0.9, beta2=0.999, and eps=1e-8. No learning-rate decay, minibatching, shuffling, or differential-evolution calibration is performed in this step.\n\n\n\nThe training objective combines the supervised pricing mean-squared error with the Black-Scholes physics-residual mean-squared error using physics weight 0.1. The physics residual follows the time-to-maturity convention established in Step 04, uses sigma_phys=0.2, and applies the required chain-rule factors for the S0/100 network coordinate. Automatic differentiation remains connected through the first- and second-order derivatives so that the physics term contributes gradients to the PCKAN parameters.\n\n\n\nAfter the 500th Adam update, predictions and all reported loss components are recomputed from the final trained parameters. The function returns the trained CKAN coefficients, readout weights, scalar output bias, final training-set predictions, data MSE, physics MSE, and total physics-informed loss. Differential-evolution calibration is deferred to the subsequent step."
    orchestrator: false
  - number: 6
    name: "06_differential_evolution_calibration"
    description: "The calibration stage follows the surrogate-assisted second stage of the PCKAN framework. The computationally expensive Heston-limit FVSJ COS pricing model is used offline to generate the fixed synthetic market prices and supervised training targets. During calibration, candidate parameter vectors are evaluated only through the trained and frozen PCKAN surrogate.\n\n\n\nThe two calibrated parameters are kappa_1 and theta_1. For a candidate parameter vector (kappa_1, theta_1), the five benchmark contracts are\n\n\n\n(K, T) =\n\n(90, 0.25),\n\n(95, 0.50),\n\n(100, 0.75),\n\n(105, 1.00),\n\n(110, 1.50).\n\n\n\nWith S0 = 100 and r = 0.05, each candidate produces the five PCKAN feature rows\n\n\n\n(S0/100, K/100, T, r, kappa_1/4, theta_1/0.12).\n\n\n\nThus the first coordinate is 1.0 and the candidate-dependent coordinates are kappa_1/4 and theta_1/0.12.\n\n\n\nThe frozen PCKAN applies tanh coordinatewise to these six scaled inputs and evaluates the second-kind Chebyshev basis through order 3:\n\n\n\nU_0(z) = 1,\n\nU_1(z) = 2z,\n\nU_2(z) = 2z U_1(z) - U_0(z),\n\nU_3(z) = 2z U_2(z) - U_1(z).\n\n\n\nFor the frozen coefficient tensor W_hat with shape (8, 6, 4), the eight hidden coordinates are formed by contracting W_hat with the Chebyshev-expanded inputs. The frozen readout weights W_out with shape (8,) and frozen scalar bias b_out then produce the five surrogate prices.\n\n\n\nFor fixed synthetic market prices P_i^mkt and frozen-surrogate predictions P_i^PCKAN, the calibration objective is\n\n\n\nJ(kappa_1, theta_1)\n\n=\n\nsum_{i=1}^{5}\n\n(P_i^mkt - P_i^PCKAN)^2.\n\n\n\nThe optimization criterion is therefore the five-contract sum of squared errors, not the mean squared error. The FVSJ/COS pricing model is not reevaluated for candidate parameter vectors during differential evolution.\n\n\n\nThe bounded calibration domain is\n\n\n\nkappa_1 in [0.5, 4.0],\n\n\n\ntheta_1 in [0.01, 0.12].\n\n\n\nThe benchmark uses DE/rand/1/bin differential evolution with population size 20, mutation factor F = 0.8, crossover probability CR = 0.9, and numpy.random.default_rng(0).\n\n\n\nGeneration 0 is initialized uniformly according to\n\n\n\npopulation =\n\nlo + (hi - lo) * rng.random((20, 2)),\n\n\n\nwhere\n\n\n\nlo = [0.5, 0.01]\n\n\n\nand\n\n\n\nhi = [4.0, 0.12].\n\n\n\nInitial objective values are evaluated for all 20 generation-0 population members.\n\n\n\nFor each evolution generation, targets are processed sequentially in population-index order i = 0,...,19.\n\n\n\nFor target i, the eligible donor indices consist of every population index except i. Three distinct donor indices are sampled without replacement in one RNG operation. In the sampled order, their current population members define a, b, and c.\n\n\n\nThe DE/rand/1 mutant is\n\n\n\nv = a + F(b - c),\n\n\n\nwith F = 0.8.\n\n\n\nBecause population replacement is asynchronous, a, b, and c are taken from the current population at the instant target i is processed. Consequently, accepted trials from earlier target indices in the same generation can participate as donors for later target indices.\n\n\n\nEach mutant coordinate is then checked against its corresponding parameter bounds in coordinate order. If a coordinate is outside its allowed interval, it is repaired using an independent uniform redraw over that full interval. A coordinate already inside its interval consumes no repair random draw.\n\n\n\nAfter bound repair, one forced crossover coordinate jrand is sampled uniformly from {0, 1} using\n\n\n\njrand = int(rng.integers(0, 2)).\n\n\n\nBinomial crossover is then processed in coordinate order j = 0, 1.\n\n\n\nThe deterministic benchmark requires one crossover random draw to be consumed for every coordinate, including the forced coordinate. Therefore the crossover operation is conceptually\n\n\n\nfor j in range(2):\n\n    crossover_draw = rng.random()\n\n    if crossover_draw < CR or j == jrand:\n\n        trial[j] = mutant[j]\n\n\n\nwith CR = 0.9.\n\n\n\nThe random draw corresponding to jrand is intentionally consumed even though that coordinate is guaranteed to come from the mutant. This RNG-consumption rule is part of the benchmark specification because numpy.random.Generator is stateful. Omitting the random draw for jrand changes every subsequent RNG state and therefore changes donor selection, bound repair, crossover, and ultimately the deterministic generation-60 result.\n\n\n\nAccordingly, an implementation that first checks whether j == jrand and only calls rng.random() for non-forced coordinates is not equivalent for this benchmark. Likewise, short-circuit logic that avoids the random draw on the forced coordinate does not reproduce the specified deterministic trajectory.\n\n\n\nAfter crossover, the trial objective is evaluated using the frozen PCKAN surrogate. Greedy selection uses\n\n\n\nJ(trial) <= J(target).\n\n\n\nIf this condition holds, the target population member and its stored objective are replaced immediately by the trial and its objective.\n\n\n\nThis replacement is asynchronous and in-place. No frozen generation-level population copy is used. Therefore the population can change while a generation is being processed.\n\n\n\nExactly 60 evolution generations are executed after generation 0. There is no early stopping.\n\n\n\nAfter generation 60, the best population index is selected using\n\n\n\nbest_idx = np.argmin(objectives).\n\n\n\nThe corresponding two-dimensional population member is returned as the calibrated [kappa_1, theta_1] vector, together with its five-contract sum-of-squared-errors objective.\n\n\n\nThroughout calibration, W_hat, W_out, and b_out remain frozen. No gradient-based optimization, PCKAN retraining, Black-Scholes physics-residual evaluation, or candidate-wise COS pricing is performed.\n\n\n\nThe deterministic differential-evolution trajectory depends not only on the mathematical DE/rand/1/bin rules but also on the exact ordering and consumption of random-number-generator calls. In particular, the benchmark consumes exactly one crossover rng.random() draw for each of the two coordinates of every target, including the forced crossover coordinate."
    orchestrator: false
  - number: 7
    name: "07_pckan_calibration_orchestrator"
    description: "Final end-to-end orchestrator for the deterministic PCKAN two-step calibration benchmark.\n\n\n\nThis step composes the public APIs of Steps 01\u201306 in dependency order and returns the final differential-evolution calibration objective as one Python float. It does not reimplement the pricing model, training-data construction, PCKAN forward evaluation, physics residual, network training, or differential-evolution algorithm.\n\n\n\nFirst, Step 01 generates the five fixed synthetic market prices using the Heston-limit FVSJ Fourier-cosine European-put construction at the ground-truth parameters. Step 02 constructs the deterministic 80-row PCKAN training and collocation sets.\n\n\n\nStep 03 executes the initialized PCKAN forward map, and Step 04 evaluates the corresponding Black-Scholes physics residual and physical derivatives. The Step-04 residual output is explicitly validated by the orchestrator before training proceeds, making successful completion of the initialized physics-residual stage a required dependency of the end-to-end pipeline. The initialized Step-03 parameters themselves are not used as the final calibrated surrogate parameters.\n\n\n\nOnly after the initialized Step-04 physics residual has been successfully evaluated and validated does Step 05 train the PCKAN for exactly 500 full-batch Adam updates using the supervised COS-price loss plus the weighted physics-residual loss. Its trained CKAN coefficients, readout weights, and output bias supersede the Step-03 initialization and are frozen for calibration.\n\n\n\nFinally, Step 06 performs the deterministic DE/rand/1/bin calibration of (kappa_1, theta_1) against the five fixed Step-01 synthetic market prices using only the frozen Step-05 PCKAN surrogate. The calibration uses the prescribed asynchronous in-place replacement procedure for exactly 60 evolution generations.\n\n\n\nThe orchestrator returns the Step-06 minimum five-contract sum of squared frozen-PCKAN pricing errors after generation 60. No calibrated parameter vector, training diagnostic, intermediate network output, physics-residual array, or COS price is returned by this final step."
    orchestrator: true
