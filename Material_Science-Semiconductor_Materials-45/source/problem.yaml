problem_id: "Material_Science-Semiconductor_Materials-45"
subject: "materials"
subject_area: "Semiconductor Materials"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2609.05170"
dependencies: ""
steps:
  - number: 1
    name: "device_parameters"
    description: "Assemble the SI parameter vector of an undoped thin-film solar cell. The device is an undoped active layer of thickness d (nm) and relative permittivity eps between a hole-injecting anode at x = 0 and an electron-injecting cathode at x = d, with effective densities of states N_c and N_v (1/cm^3), energy gap E_g (eV), injection barriers phi_an and phi_cat (eV, measured from the transport levels to the contact Fermi levels), balanced or unbalanced mobilities mu_n and mu_p (cm^2/(V s)), the reduced Langevin recombination coefficient gamma_L = zeta q (mu_n + mu_p) / (eps eps0) with the reduction factor zeta, and a uniform exciton generation rate G_ex (1/(cm^3 s)). The contacts hold Boltzmann densities of both carriers at all times: at the anode p_an = N_v exp(-phi_an/kT) and n_an = N_c exp(-(E_g - phi_an)/kT), at the cathode n_cat = N_c exp(-phi_cat/kT) and p_cat = N_v exp(-(E_g - phi_cat)/kT), so that n p = n_i^2 = N_c N_v exp(-E_g/kT) at both contacts and minority carriers reaching a contact are extracted. The built-in voltage is V_bi = (E_g - phi_an - phi_cat)/q, the electrostatic potential obeys psi(0) = 0 and psi(d) = V_bi - V for the applied voltage V (forward bias positive), and the generation current is q G_ex d. Return the 14-entry vector [kT/q (V), V_bi (V), d (m), eps eps0 (F/m), p_an, n_an, n_cat, p_cat (1/m^3), n_i^2 (1/m^6), gamma_L (m^3/s), D_n, D_p (m^2/s), G_ex (1/(m^3 s)), q G_ex d (A/m^2)] with q = 1.602176634e-19 C, k = 1.380649e-23 J/K and eps0 = 8.8541878128e-12 F/m. Raise ValueError if a length, permittivity, temperature, density of states, gap or mobility is not positive, if the reduction factor or generation rate is negative, or if a barrier is negative or the two barriers do not sum to less than the gap."
    orchestrator: false
  - number: 2
    name: "onsager_braun_yield"
    description: "Evaluate the Onsager-Braun field-assisted dissociation yield of a bound electron-hole pair anchored to its zero-field value: with b_F = q^3 |F| / [8 pi eps eps0 (kT)^2] for the electric field F (V/m), f(F) = I_1(2 sqrt(2 b_F)) / sqrt(2 b_F) with I_1 the modified Bessel function of the first kind of order one (f(0) = 1, and f(F) = 1 + b_F + b_F^2/3 + b_F^3/18 + b_F^4/180 + ...), and P_gen(F) = P_gen^0 f(F) / [P_gen^0 f(F) + 1 - P_gen^0] for the zero-field yield P_gen^0. Return [P_gen(F), f(F), b_F]. Raise ValueError if the zero-field yield is not in (0, 1] or the permittivity or temperature is not positive."
    orchestrator: false
  - number: 3
    name: "steady_state"
    description: "Compute the converged steady state of the cell at the applied voltage V under the uniform free-carrier generation rate G = s G_ex, where s is the generation scale (s = 0 is the dark state) and par the 14-entry parameter vector of the first step. The steady state solves Poisson's equation eps eps0 psi'' = -q (p - n) with the continuity equations dJ_n/dx = q (R - G) and dJ_p/dx = -q (R - G), R = gamma_L (n p - n_i^2), J_n = -q mu_n n psi' + q D_n n' and J_p = -q mu_p p psi' - q D_p p' with D = mu kT/q, on the uniform grid x_i = i d/N (spacing h = d/N): the three-point second difference for Poisson at every interior node, R and G evaluated at the interior nodes (the contact nodes hold their fixed densities and generate nothing), the currents on every interval by the Scharfetter-Gummel fluxes J_n = (q D_n/h) [n_{i+1} B(delta_i) - n_i B(-delta_i)] and J_p = (q D_p/h) [p_i B(delta_i) - p_{i+1} B(-delta_i)] with delta_i = (psi_{i+1} - psi_i) q/kT and B(x) = x/(exp(x) - 1), and the divergence at a node equal to the difference of its two interval fluxes divided by h. Solve the discrete system to machine precision (every residual, scaled as in the reference: Poisson in units of kT/q, each continuity equation multiplied by h^2 over q D times the local density, below 1e-12 or at the roundoff floor) by damped Newton iteration in the unknowns psi q/kT, ln n and ln p, started from the dark zero-bias Poisson-Boltzmann equilibrium with the generation switched on at zero bias and continued in the bias in steps of at most 0.05 V. If start = (state, voltage0) is given, a converged (N + 1, 3) state of the same cell at the bias voltage0 (any generation), start the continuation from it instead of from the dark equilibrium, in bias steps of at most 0.05 V. Return the converged state at the N + 1 nodes as the (N + 1, 3) array with columns psi q/kT, ln n and ln p (densities in 1/m^3). Raise ValueError if par does not have 14 entries, if N is not an even integer of at least 4, if the generation scale is negative, if V is not below V_bi + 0.5 V, or if start is not an (N + 1, 3) state satisfying the contact potentials at its bias."
    orchestrator: false
  - number: 4
    name: "loss_budget"
    description: "From the converged light state (generation s G_ex) and dark state (s = 0) of the second step at the same voltage V, evaluate the currents and the exact budget of the photogenerated carriers. The current density of a state is the total Scharfetter-Gummel current J_n + J_p on the middle interval (it is the same on every interval). The photocurrent is J_light - J_dark, the collected fraction its magnitude over q G d. With the excess densities Delta n = n_light - n_dark and Delta p = p_light - p_dark at the nodes, the excess recombination gamma_L (n_light p_light - n_dark p_dark) splits exactly into a first-order part gamma_L (n_dark Delta p + p_dark Delta n), recombination of photogenerated carriers with the dark (injected) populations, and a second-order part gamma_L Delta n Delta p; integrate each over the interior nodes with weight h and divide by G d. The remaining loss is extraction of photogenerated minority carriers at the wrong contact: the excess electron current on the first interval (light minus dark) plus the generation q G h/2 of the anode half-cell, over q G d, and likewise for the excess hole current on the last interval plus q G h/2 at the cathode. Return [J_light, J_dark (both in mA/cm^2), collected fraction, first-order bulk loss, second-order bulk loss, anode extraction loss, cathode extraction loss]; the five fractions sum to one. Raise ValueError if the two states are not (N + 1, 3) arrays of the same shape, if par does not have 14 entries, if the generation scale is not positive, if either state does not satisfy the contact potentials at V, or if either is not a converged steady state at its generation (any scaled residual above 1e-9)."
    orchestrator: false
  - number: 5
    name: "jv_characteristics"
    description: "Current density (mA/cm^2, forward bias positive) of the cell at each applied voltage under the generation s G_ex, from the converged steady states of the third step (continuation from zero bias outward, so that the states at neighbouring voltages start each other). Return the currents in the order of the voltages given. Raise ValueError if voltages is empty, par does not have 14 entries, N is not an even integer of at least 4, the generation scale is negative, or any voltage is not below V_bi + 0.5 V."
    orchestrator: false
  - number: 6
    name: "procedure_metrics"
    description: "Apply the photocurrent-versus-effective-voltage procedure to the exact model of one cell whose free-carrier generation carries the Onsager-Braun yield of the second step evaluated at the nominal field |F| = (V_bi - V)/d of each voltage (G = G_ex P_gen(F); a zero-field yield of 1 means unity, field-independent generation). With J_light(V) the current under that generation and J_dark(V) the dark current, the photocurrent is J_ph(V) = J_light(V) - J_dark(V); locate the compensation voltage V_0 at which J_ph = 0 by bisection on (0, V_bi + 0.4 V) to an interval width of 1e-10 V, the open-circuit voltage V_oc at which J_light = 0 the same way, and the maximum-power point by golden-section search of -V J_light(V) on (0, V_oc) to an interval width of 1e-9 V; the fill factor is P_max / (V_oc J_sc) with J_sc = -J_light(0). For each reverse bias V_rev the saturation current read by the procedure is J_sat,exp = J_ph(V_rev) and the apparent dissociation probability is P_diss = J_ph(0) / J_sat,exp. Return [V_0, J_sc / (q G_ex d), V_oc, V_mpp, FF, P_gen(F_sc) at short circuit, the short-circuit collection efficiency J_sc / (q G_ex d P_gen(F_sc))] followed by [-J_sat,exp / (q G_ex d), P_diss] for each reverse bias in order. Raise ValueError if the zero-field yield is not in (0, 1], if any reverse bias is not negative, if par does not have 14 entries or N is not an even integer of at least 4."
    orchestrator: false
  - number: 7
    name: "collection_ceiling"
    description: "Short-circuit collection efficiency -(J_light(0) - J_dark(0)) / (q G_ex d) of cells with symmetric injection barriers phi (so V_bi = (E_g - 2 phi)/q) for one balanced mobility mu_n = mu_p = mu and each Langevin reduction factor, with unity field-independent generation, from the converged states of the third step; material = (d in nm, eps, T in K, N_c, N_v in 1/cm^3, E_g in eV, G_ex in 1/(cm^3 s)) supplies the other inputs of the first step. Return the (len(barriers), len(reduction_factors) + 1) array whose column j is the efficiency for reduction factor j and whose last column is the Sokel-Hughes diffusion-only value coth(u/2) - 2/u with u = q V_bi / kT. Raise ValueError if barriers or reduction factors are empty or negative, twice a barrier reaches the gap, the mobility is not positive, material does not have 7 entries or N is not an even integer of at least 4."
    orchestrator: false
  - number: 8
    name: "transport_crossover"
    description: "Short-circuit loss budget of the fourth step against the balanced mobility for a cell with symmetric barriers phi and reduction factor zeta under unity generation (material as in the seventh step): find by bisection in log10 of the mobility (cm^2/(V s)), on the bracket from three decades below the design mobility up to the ideal mobility, to an interval width of 1e-9, the crossover mobility at which the second-order bulk loss equals the sum of the first-order bulk loss and the two contact extraction losses. Return [log10 of the crossover mobility, then the five budget fractions (collected, first-order, second-order, anode, cathode) at the design mobility, then the same five at the ideal mobility]. Raise ValueError if the mobilities are not positive with the design mobility below the ideal one, the barrier is negative or twice the barrier reaches the gap, the reduction factor is not positive, material does not have 7 entries or N is not an even integer of at least 4."
    orchestrator: false
  - number: 9
    name: "intensity_dependence"
    description: "Short-circuit collection efficiency -(J_light(0) - J_dark(0)) / (s q G_ex d) of a cell with symmetric barriers phi and reduction factor zeta (material as in the seventh step) under the generation s G_ex for each intensity s (suns) and each balanced mobility (rows). Return the (len(mobilities), len(intensities)) array. Raise ValueError if intensities or mobilities are empty or not positive, the barrier is negative or twice the barrier reaches the gap, the reduction factor is negative, material does not have 7 entries or N is not an even integer of at least 4."
    orchestrator: false
  - number: 10
    name: "procedure_audit"
    description: "Run the complete chain for the cell described by device = (d, eps, T, N_c, N_v, E_g, phi_an, phi_cat, mu_n, mu_p, zeta, G_ex) in the units of the first step, and assemble the audit table: one row per zero-field yield with the columns [V_0, J_sc/(q G_ex d), V_oc, V_mpp, FF, P_gen(F_sc), short-circuit collection efficiency, -J_sat,exp/(q G_ex d) and P_diss at the first reverse bias, the same two at the second reverse bias, first-order bulk loss, second-order bulk loss, anode extraction loss, cathode extraction loss at short circuit for that yield's generation], and a head row [P_diss at the first reverse bias of the unity-yield cell, the ideal-transport collection ceiling of the seventh step at the barrier of the grid nearest the cell's anode barrier and at the reduction factor nearest the cell's, the largest ceiling on the barrier grid for that reduction factor and the barrier at which it occurs, the Sokel-Hughes value at the nearest grid barrier, log10 of the crossover mobility of the eighth step for the cell's barrier and reduction factor, the collection efficiency at the lowest intensity for the design mobility and for the ideal mobility, the unity-yield cell's J_sc and its photocurrents -J_ph at the first and at the second reverse bias in mA/cm^2 obtained from the sweep step at the voltages [second reverse bias, first reverse bias, 0] under unity generation and in the dark, and the Onsager-Braun yield of the second step at the nominal short-circuit field V_bi/d for the smallest zero-field yield (1 if that yield is 1)] followed by zeros. Raise ValueError if the yields are empty or do not include 1, if there are not exactly two reverse biases, if device does not have 12 entries or N is not an even integer of at least 4."
    orchestrator: true
