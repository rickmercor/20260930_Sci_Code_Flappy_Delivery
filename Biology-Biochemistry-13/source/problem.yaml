dependencies: ""
steps:
  - number: 1
    name: "01_decompose_independent_subnetworks"
    description: "Partition the reactions of a mass-action network into its finest independent decomposition."
    orchestrator: false
  - number: 2
    name: "02_compute_elementary_flux_modes"
    description: "Enumerate the elementary flux modes of a reaction network as primitive integer vectors."
    orchestrator: false
  - number: 3
    name: "03_build_reaction_graph"
    description: "Construct a directed graph on the reactions whose simple cycles are exactly the elementary flux modes and which respects common source complexes."
    orchestrator: false
  - number: 4
    name: "04_compute_translation_complexes"
    description: "Propagate translation complexes along the reaction-to-reaction graph so that every edge becomes product-to-source compatible."
    orchestrator: false
  - number: 5
    name: "05_compute_network_deficiency"
    description: "Count complexes, linkage classes and stoichiometric rank of a (translated) network and report its deficiency and weak reversibility."
    orchestrator: false
  - number: 6
    name: "06_build_generalized_network"
    description: "Turn a translated network into a generalized network with stoichiometric and kinetic complexes, splitting shared translated complexes by phantom edges."
    orchestrator: false
  - number: 7
    name: "07_compute_tree_constants"
    description: "Evaluate the spanning-tree constant of every vertex of a weighted generalized network."
    orchestrator: false
  - number: 8
    name: "08_solve_phantom_rate"
    description: "Fix the rate of the phantom edge so that complex-balanced equilibria of a generalized network with kinetic deficiency one exist."
    orchestrator: false
  - number: 9
    name: "09_parametrize_steady_states"
    description: "Express the complex-balanced equilibria of a generalized network as a log-linear function of designated free species."
    orchestrator: false
  - number: 10
    name: "10_solve_class_steady_state"
    description: "Impose the conservation laws on a log-linear steady-state parametrization and return the positive steady state of the class."
    orchestrator: false
  - number: 11
    name: "11_run_equilibrium_pipeline"
    description: "Compose every earlier step to obtain one species concentration at the positive steady state of a stoichiometric compatibility class."
    orchestrator: true
