steps:
  - number: 1
    name: "dfrc_chain_force"
    description: "Determine the chain force transmitted by a polymer chain held at a prescribed end-to-end distance with the deformable freely rotating chain (dFRC) model of the elasticity source (its Eqs. 7-9): the chain is represented by a uniform, non-fluctuating bond length l and bond-vector angle phi (the angle between successive bond vectors) chosen to minimize the Helmholtz free energy Psi(l, phi; r) = N v_str(l) + (N - 1) v_ben(phi) + Psi_ent(r; l, phi) at the prescribed end-to-end distance r = stretch_ratio * R_0, where R_0 = N l_e cos(phi_e / 2) is the end-to-end length of the undeformed zigzag, v_str(l) = D_e [1 - exp(-a (l - l_e))]^2 is the Morse stretching energy and v_ben(phi) = k_phi (phi - phi_e)^2 / 2. Psi_ent is the entropic free energy of a freely rotating chain with bond length l and bond angle phi, whose contour length is R_max = N l cos(phi / 2) and whose Kuhn length is l_k = 2 l cos(phi / 2) / (1 - cos phi); with the relative extension r* = r / R_max (0 < r* < 1) and eta = L^-1(r*) the exact inverse of the Langevin function L(x) = coth x - 1/x, the source's explicit force-extension relation (its Eq. 8) is f = (k_B T / l_k) { eta + (1/2) r*^2 / (1 - r*)^2 [1 - r*^(l_k / l - 1)] }, and its closed-form free energy (its Eq. 9) is Psi_ent = k_B T (R_max / l_k) [ r* eta + ln(eta / sinh eta) + (1 + r* (1 - r*)) / (2 (1 - r*)) + ln(1 - r*) - (1/2) B(r*; 2 + l_k / l, -1) ], where B(x; a, b) = int_0^x t^(a - 1) (1 - t)^(b - 1) dt is the incomplete beta function (here b = -1, integrand t^(a - 1) (1 - t)^-2, a = 2 + l_k / l). Eq. 9 is the integral of Eq. 8 over r plus an additive constant that depends on l and phi (through R_max / l_k and l_k / l); that constant must be kept, because it moves the optimum: integrating Eq. 8 from r = 0 instead does not give the source's free energy. Evaluate the inverse Langevin function exactly (no Pade or other approximant) and the incomplete beta function to a relative accuracy of 1e-10 or better for r* close to 1. The chain force is f = dPsi_ent / dr at the optimum, i.e. Eq. 8 evaluated at (l*, phi*). Return the optimal bond length in units of l_e, the optimal bond-vector angle in radians and the reduced chain force f l_e / D_e. When beta_kphi = 0 (freely jointed bonds) the angle is undetermined: use the freely jointed reduction l_k = l, R_max = N l, for which the correction term of Eq. 8 vanishes and Eq. 9 reduces to Psi_ent = N k_B T [r* eta + ln(eta / sinh eta)] up to an l-independent constant; optimize l alone and return 0.0 for the angle. The optimum is unique in the physical domain (r* < 1); converge it to 1e-12 in both variables (bond length in l_e, angle in radians). Finite-difference gradients cannot reach that accuracy next to the r* -> 1 singularity of Psi_ent; use the stationarity conditions with analytic derivatives: Psi_ent depends on l only through r*, so dPsi_ent/dl = -(r / l) f with f from Eq. 8, and dPsi_ent/dphi involves dB(r*; a, -1)/da = int_0^r* t^(a - 1) ln t (1 - t)^-2 dt. Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 2
    name: "collinear_reference_rate"
    description: "Compute the collinear (one-dimensional) reference of the chain-scission problem: every bond is aligned with the force, so the bond-length potential of mean force is the Morse stretching energy tilted by the force (source, Sec. S3.2). Return the bonded minimum and the barrier top of that tilted potential (closed form), the activation barrier between them, and the bond-resolved transition-state-theory rate of one such bond evaluated from the full flux-over-population expression of the source (its Eq. S96) with the supplied kinetic prefactor, integrating the Boltzmann factor of the potential over the bonded interval [0, l_bar] with n_l trapezoid points. Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 3
    name: "bending_kernel"
    description: "Build the angular coupling kernel of two successive bonds on a polar-angle grid: for each pair of polar angles (theta, theta_prime) measured from the force axis, the Boltzmann factor of the harmonic bending energy in the bond angle between the two bond vectors, integrated over their relative azimuthal angle on [0, 2 pi) (source, Sec. S2.1; the same kernel underlies the transfer-matrix elasticity of the deformable-bond chain). Use the midpoint rule with n_omega equally spaced azimuths. The bond angle is the angle between the bond vectors, and the bending energy is k_phi (phi - phi_e)^2 / 2 in units of k_B T, i.e. beta_kphi = k_phi / (k_B T)."
    orchestrator: false
  - number: 4
    name: "log_intact_weight"
    description: "Compute, on the polar-angle grid, the natural logarithm of the local intact weight of one bond whose rupture threshold is l_thr (source, Sec. S2.1, the local intact weight): I(theta) = sin(theta) * integral from 0 to l_thr of exp(-beta_de * [v_str(l) - f_red * l * cos(theta)]) * l^2 dl, with v_str the Morse stretching energy, i.e. the bond's Boltzmann factor integrated over its allowed length interval with the full three-dimensional bond-vector measure l^2 sin(theta) dl dtheta (the azimuth already integrated out). The sin(theta) factor of the measure is included in this weight, so that the polar-angle integrals of the later steps use plain dtheta quadrature weights. Use the trapezoid rule with n_l equally spaced points on [0, l_thr] and evaluate in the log domain so that the result is finite for beta_de of several hundred. Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 5
    name: "constrained_pmf"
    description: "Evaluate, at the supplied lengths, the constrained potential of mean force of one bond of the chain and its length derivative. For bond `bond_index` (0-based; bond 0 is attached to the anchored atom), W_i(l) = -(1/beta) ln G_i(l), where G_i(l) is the configurational weight of the chain with bond i held at length l and every other bond j integrated over its allowed interval [0, l_j_thr] with the full three-dimensional bond-vector measure and the bending coupling between successive bonds (source, Secs. S1.4 and S2). Return a (2, n_l) array: row 0 is W_i(l) - W_i(l_e), i.e. the profile with its additive constant fixed by its value at l = l_e (= 1 in reduced units), row 1 is dW_i/dl. The polar-angle grid with its quadrature weights, the bending kernel of the kernel step and the log intact weights of all bonds (one row per bond, thresholds already applied) are supplied; the nearest-neighbour orientational correlations of the whole chain must be resolved exactly on this grid, without sampling. At l = 0 the profile is +inf and the derivative -inf. Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 6
    name: "pmf_stationary_points"
    description: "Locate the bonded minimum and the barrier top of the constrained potential of mean force of bond `bond_index` (the profile of the previous step) and return them together with the activation barrier W_i(l_bar) - W_i(l_min) in D_e. Bracket sign changes of the derivative on n_scan equally spaced lengths in [l_lo, l_hi], take the first minimum and the first maximum beyond it, and refine each root to 1e-13 in l. Call the previous step's function for the profile and its derivative. Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 7
    name: "self_consistent_thresholds"
    description: "Determine the rupture thresholds of all bonds of an n_bonds chain self-consistently: starting from a common initial threshold l_init, form the log intact weights of all bonds at the current thresholds, locate the barrier top of every bond's constrained potential of mean force, set each threshold to its own barrier top, and repeat until the largest threshold change is below tol (source, Sec. S2.2, the self-consistent scheme; at most max_iter sweeps). Call the earlier step functions for the intact weights and the stationary points. Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 8
    name: "bond_tst_rate"
    description: "Evaluate the bond-resolved transition-state-theory rate of one bond in 1/s from its tabulated constrained potential of mean force on a length grid that runs from 0 to the bond's barrier top (the last grid point) and from the bond's kinetic prefactor: the source's full flux-over-population expression (its Eq. S50), the prefactor times the Boltzmann factor of the profile at the barrier top divided by the integral of the Boltzmann factor of the profile over the bonded interval [0, l_bar], using the trapezoid rule on the supplied grid and working in the log domain. The additive constant of the profile is irrelevant; the value at l = 0 may be +inf (zero weight). Reduced units: lengths in units of the equilibrium bond length l_e, energies in units of the dissociation energy D_e, so beta_de = D_e/(k_B T), a_le = a l_e and f_red = f l_e / D_e; angles in radians."
    orchestrator: false
  - number: 9
    name: "mean_scission_time"
    description: "Orchestrate the whole pipeline in SI units and return the mean time to the first scission, 1 / k_chain in hours, of an n_bonds chain of atoms of mass `mass`, anchored at atom 0 and held at the end-to-end distance stretch_ratio * R_0 (R_0 = N l_e times the sine of half the equilibrium valence angle, the length of the undeformed zigzag). Every bond stores the Morse stretching energy of the earlier steps, and every interior atom stores a harmonic bending energy k_phi (theta_v - theta_v_e)^2 / 2 in its valence angle theta_v, the angle between the two bonds meeting at that atom, with equilibrium valence angle valence_angle_deg. Convert to reduced units (beta_de = d_e / (k_b T), a_le = a l_e, beta_kphi = k_phi / (k_b T)) and to the angle convention of the earlier steps, obtain the constant chain force from the dFRC step (its optimum converged to 1e-12 in both variables, as that step requires), build a Gauss-Legendre grid of n_theta nodes on [0, pi], take the collinear reference barrier top as the initial threshold, build the bending kernel with n_omega azimuths, converge the self-consistent thresholds, form the intact weights at the converged thresholds, locate every bond's stationary points, tabulate every bond's profile on n_well equally spaced lengths from 0 to its barrier top, evaluate every bond-resolved rate with its kinetic prefactor (source, Sec. S1.3): the one-sided thermal average of the velocity of the bond-length coordinate of that bond, (2 pi m_l / (k_b T))^(-1/2) in m/s with m_l the effective mass of that coordinate, divided by l_e to match the reduced length unit; sum the bond-resolved rates and return the reciprocal of the chain-scission rate in hours. Call the earlier step functions rather than reimplementing them."
    orchestrator: true
