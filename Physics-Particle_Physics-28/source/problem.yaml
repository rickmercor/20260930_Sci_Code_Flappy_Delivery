problem_id: "Physics-Particle_Physics-28"
subject: "physics"
subject_area: "Particle Physics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2511.05481"
dependencies: ""
steps:
  - number: 1
    name: "step_01_lepton_kinematics"
    description: "Convert a positron total energy in a superallowed beta decay into its velocity, its momentum and the energy left to the neutrino, and validate that the energy lies inside the allowed spectrum."
    orchestrator: false
  - number: 2
    name: "step_02_fermi_function_msbar"
    description: "Evaluate the all-orders-in-alpha*Z Fermi function of a positron emitter in the MS-bar scheme of the heavy-particle effective theory, at a given lepton velocity and renormalization scale."
    orchestrator: false
  - number: 3
    name: "step_03_sirlin_g1"
    description: "Evaluate the one-loop order-alpha outer radiative correction g^(1) to the positron spectrum of a superallowed decay (the Sirlin function in the heavy-particle effective theory, MS-bar scheme) at a given velocity, neutrino energy and renormalization scale."
    orchestrator: false
  - number: 4
    name: "step_04_g2_alpha2z"
    description: "Evaluate the paper's two-loop order-alpha^2 Z outer radiative correction ghat^(2)(beta, mubar) to the positron spectrum of a superallowed decay, with the Fermi function factored out, at a given velocity and renormalization scale."
    orchestrator: false
  - number: 5
    name: "step_05_spectrum_weight"
    description: "Evaluate the Coulomb-corrected positron momentum spectrum of a superallowed decay, i.e. the phase-space weight p_e^2 Ebar^2 Fbar(beta, mubar) used to average the outer radiative corrections over the spectrum."
    orchestrator: false
  - number: 6
    name: "step_06_phase_space_average"
    description: "Compute the phase-space normalization and the spectrum-averaged one-loop and two-loop outer correction functions of a superallowed positron emitter by Gauss-Legendre quadrature over the positron momentum."
    orchestrator: false
  - number: 7
    name: "step_07_averaged_outer_correction"
    description: "[ORCHESTRATOR] Compute the phase-space-averaged outer radiative correction deltabar'_R of a superallowed positron emitter through order alpha^2 Z, at the paper's central renormalization scale, from the transition's electron-capture Q value and daughter charge."
    orchestrator: true
