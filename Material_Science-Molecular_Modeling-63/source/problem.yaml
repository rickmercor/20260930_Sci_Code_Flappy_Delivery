    description: "Compute electrostatic energy, forces and the Cartesian Hessian from the charge and Coulomb-kernel derivatives."
    orchestrator: false
  - number: 6
    name: "06_periodic_born_tensors"
    description: "Compute scaled Born tensors from the phase-compensated derivative of the complex periodic dipole."
    orchestrator: false
  - number: 7
    name: "07_longitudinal_shift"
    description: "Apply acoustic corrections, construct the longitudinal dynamical matrix and calculate the shift of the highest optical frequency."
    orchestrator: false
  - number: 8
    name: "08_solve_phonon_shift"
    description: "Run the complete neutral periodic charge model and return the longitudinal shift of its highest optical frequency."
