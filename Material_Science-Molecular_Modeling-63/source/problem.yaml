steps:
  - number: 1
    name: "01_moment_jets"
    description: "Compute periodic moment tensors of ranks zero, one and two and their first and second Cartesian derivatives."
    orchestrator: false
  - number: 2
    name: "02_invariant_jets"
    description: "Construct the five scalar moment invariants and propagate their Cartesian gradients and Hessians."
    orchestrator: false
  - number: 3
    name: "03_redistributed_charge_jets"
    description: "Evaluate the local raw charges, impose the prescribed total charge and propagate first and second coordinate derivatives through the redistribution map."
    orchestrator: false
  - number: 4
    name: "04_ewald_kernel_jets"
    description: "Construct the finite periodic Ewald kernel and its first and second Cartesian derivatives."
    orchestrator: false
  - number: 5
