steps:
  - number: 1
    name: "step_01_spectral_wavenumbers"
    description: "Return the array of squared Fourier wave numbers $|\\\\boldsymbol{k}|^2$ on a periodic **rectangular** two-dimensional box, in `numpy` FFT mode order. Two things are general here and both are graded: $N$ is either an `int` or a length-2 sequence $(N_x, N_y)$, and $L$ is either a scalar or a length-2 sequence $(L_x, L_y)$, so direction $a$ carries its own mode count $N_a$ *and* its own box length $L_a$, and the two are not interchangeable. Every spectral operator in the rest of the pipeline - the Laplacian, the biharmonic and tri-Laplacian operators inside the implicit symbol, the inverse Laplacian of the $H^{-1}$ norm, and the two quadratic forms of the free energy - is built from this one array."
    orchestrator: false
  - number: 2
    name: "step_02_pfc_free_energy"
    description: "Return the discrete phase-field-crystal free energy of a state $\\\\phi$ on the periodic rectangular box. Two of the four terms are evaluated pointwise and two as spectral quadratic forms, and **the split is graded**: the quartic and quadratic terms are summed on the grid, while $\\\\int|\\\\nabla\\\\phi|^2$ and $\\\\int(\\\\Delta\\\\phi)^2$ are evaluated by Parseval as $-\\\\int\\\\phi\\\\,\\\\Delta\\\\phi$ and $\\\\int\\\\phi\\\\,\\\\Delta^2\\\\phi$. Forming $|\\\\nabla\\\\phi|^2$ pointwise from $\\\\mathrm{i}k_a\\\\hat\\\\phi$ instead is a different discretisation: on an even grid the Nyquist column carries a first derivative that is not the adjoint of the second, so the two disagree by about $5\\\\times10^{-9}$ on an evolved $64^2$ state - enough to destroy the exact discrete energy law that the whole scheme rests on. This is the *original* energy of the model, with no stabilisation parameter in it."
    orchestrator: false
  - number: 3
    name: "step_03_h_minus1_norm"
    description: "Return the squared $H^{-1}$ norm $\\\\|v\\\\|_{-1}^2=\\\\int_\\\\Omega v\\\\,(-\\\\Delta)^{-1}v$ of a mean-zero field on the periodic rectangular box, evaluated spectrally. The inverse Laplacian is defined only up to a constant and only on mean-zero data, so the zero Fourier mode must be **removed from the input and excluded from the sum**; the function must therefore return the same value for $v$ and for $v+c$. This norm carries the leading term of the modified discrete energy whose dissipation the scheme guarantees, and it is the norm in which the variable-step BDF2 difference operator is tested against the increment."
    orchestrator: false
  - number: 4
    name: "step_04_decoupled_fields"
    description: "Return the three fields that make one step of the scheme independent of the multiplier: the explicit extrapolation $\\\\bar\\\\phi^{\\\\,n+1}$ at which the nonlinearity is evaluated, and the two fields $p^{n+1}$ and $q^{n+1}$ obtained from the same constant-coefficient elliptic solve. The new state is then $\\\\phi^{n+1}=p^{n+1}+S(\\\\eta^{n+1})\\\\tau\\\\,q^{n+1}$, so **neither $p$ nor $q$ may depend on $\\\\eta$** - that is exactly what makes the scheme fully decoupled and reduces the step to two elementwise divisions in Fourier space plus one scalar root-find. Setting $\\\\gamma=0$ must reproduce the first-order backward-Euler starting step: the leading coefficient becomes $1$, the extrapolation collapses to $\\\\phi^n$, and $\\\\phi^{n-1}$ drops out. That degenerate case is graded."
    orchestrator: false
  - number: 5
    name: "step_05_solve_multiplier"
    description: "Return the Lagrange multiplier $\\\\eta^{n+1}$ of one step, by solving the penalised scalar nonlinear equation. This is the whole nonlinear content of the step: everything else is linear. The equation is the **discrete energy law itself** - the change in bulk energy plus the change in the penalty term equals the multiplier-weighted work of the extrapolated nonlinearity over the increment - so an implementation is correct if and only if that identity holds to round-off once $\\\\eta^{n+1}$ is substituted back. Three things are graded and each of them changes the answer: the scaling function is $S(\\\\eta)=\\\\eta(2-\\\\eta)$, not $\\\\eta$; the penalty term $\\\\theta(\\\\eta^2-(\\\\eta^{n})^2)$ sits **inside** this equation, not only in the energy functional, and removing it makes the iteration break down; and there is **no extra factor of $\\\\tau$** multiplying $S(\\\\eta)$ outside the bracket, only the one inside $p+S(\\\\eta)\\\\tau q$. Newton is started at $\\\\eta^{n}$: that is the prescribed **branch-selection convention**, because $g$ may have more than one root and only the branch continuously connected to $\\\\eta=1$ is the discrete solution. If the iteration cannot deliver such a root - the cap is exhausted, the derivative vanishes, or an iterate goes non-finite - **report the failure**; do not return the last iterate."
    orchestrator: false
  - number: 6
    name: "step_06_bdf2_step"
    description: "Advance the scheme by one step: given $\\\\phi^{n-1}$, $\\\\phi^{n}$, $\\\\eta^{n}$, the step ratio $\\\\gamma_{n+1}$ and the step $\\\\tau_{n+1}$, return the pair $(\\\\phi^{n+1},\\\\eta^{n+1})$. This is steps 4 and 5 composed with the reconstruction $\\\\phi^{n+1}=p^{n+1}+S(\\\\eta^{n+1})\\\\,\\\\tau_{n+1}\\\\,q^{n+1}$, using $S(\\\\eta)=\\\\eta(2-\\\\eta)$. Passing $\\\\gamma=0$ (with $\\\\phi^{n-1}$ ignored) must give the first-order backward-Euler starting step, so the whole run is this one function called once with $\\\\gamma_1=0$ and then repeatedly with the controller's ratio. The step must conserve the spatial mean of $\\\\phi$ exactly, to round-off, for every $\\\\gamma$, $\\\\tau$ and $\\\\theta$. The multiplier solve of step 5 is the only stage that can fail, and its failure is **propagated, not absorbed**: if Newton cannot deliver a root the step reports the breakdown instead of returning a state built from an unconverged iterate."
    orchestrator: false
  - number: 7
    name: "step_07_adaptive_time_step"
    description: "Return the next time step chosen by the energy-controlled adaptive rule. The step shrinks where the free energy is falling fast and relaxes towards $\\\\tau_{\\\\max}$ once the flow is quiet, and it is then held back by two hard limits: the floor $\\\\tau_{\\\\min}$ and the **step-ratio clamp** $\\\\gamma_{\\\\max}\\\\tau_n$, with $\\\\gamma_{\\\\max}=4.86454$ the maximal ratio under which the modified discrete energy of this scheme is proved to dissipate. The clamp is the only place in the pipeline where that constant enters, and it is what keeps an adaptive run inside the proved-stable regime; the value must be taken from the source rather than assumed, since the corresponding bound for Cahn-Hilliard is the much tighter $1.534$. Use the constant **as the source prints it**, $4.86454$, rather than re-solving its defining equation $\\\\gamma^{3/2}=1+2\\\\gamma$ to higher precision; that is the convention every field of this task uses."
    orchestrator: false
  - number: 8
    name: "step_08_penalized_lm_answer"
    description: "**Final orchestrator.** Run the complete penalised Lagrange multiplier variable-step BDF2 scheme once for each penalty parameter and return the sum, over those runs, of the modified discrete energy at the final state. Each run starts from the same analytic seed field with $\\\\eta^{0}=1$, takes its first step by backward Euler with $\\\\tau_{1}=\\\\tau_{\\\\min}$ (i.e. step 6 at $\\\\gamma=0$), and then takes $n_steps - 1$ BDF2 steps whose ratios come from the controller of step 7 driven by the *original* free energy of step 2. After the last step the controller is called **once more**, purely to supply the ratio $\\\\gamma_{N+1}$ that the modified energy's leading coefficient needs; that proposed step is not taken. Solvability of the scalar multiplier equation is *conditional* - unlike the energy dissipation, which is not - so a breakdown of the step-5 solve at any step of any run propagates out of this function as a reported failure; it is never absorbed, retried with a fallback, or replaced by a substituted multiplier. On the default arguments this returns the graded number."
    orchestrator: true
