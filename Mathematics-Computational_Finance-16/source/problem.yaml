steps:
  - number: 1
    name: "advance_controlled_diffusion"
    description: "A controlled factor state follows an Euler-Maruyama step of the reverse diffusion. The same noise increment later enters the derivative term of the BSDE regression, coupling the discrete state trajectory to the local regression problem solved at each time slice. For row k, the affine drift is f(x_k) = F x_k + b, the feedback is u(x_k) = U x_k + c, and diagonal diffusion s gives x'_k = x_k + [f(x_k) + s * u(x_k)] dt + s * xi_k sqrt(dt).\n\nInputs\n------\nstates: Float array of shape (K, d).\nnoises: Float array of shape (K, d).\ndrift_matrix: Float array of shape (d, d).\ndrift_bias: Float array of shape (d,).\nsigma_diag: Positive float array of shape (d,).\npolicy_matrix: Float array of shape (d, d).\npolicy_bias: Float array of shape (d,).\ndt: Positive time increment.\n\nReturns\n-------\nnext_states: Float array of shape (K, d).\n"
    orchestrator: false
  - number: 2
    name: "evaluate_tt_continuation"
    description: "An extended tensor train represents a scalar function by contracting one matrix-valued core per coordinate against a univariate basis. Returning the value beside every partial derivative supplies the continuation data required by a BSDE time step. A core with basis mode m_i uses the coordinate-specific monomial vector phi_i(z) = [1, z, ..., z^(m_i-1)]; a partial derivative replaces only that vector by phi_i'(z). The prescribed quadratic instance is recovered when every m_i equals three.\n\nInputs\n------\npoints: Float array of shape (K, d).\ncores: Sequence of d compatible order-three TT cores with basis modes at least two.\n\nReturns\n-------\ncontinuation: Float array of shape (K, d + 1), with values in column zero and gradients in the remaining columns.\n"
    orchestrator: false
  - number: 3
    name: "form_bsde_targets"
    description: "A right-endpoint discretization of the deterministic BSDE integral defines the regression target that is later fit against the left-endpoint value-plus-gradient operator at each time step. y_{n+1} = V_{n+1}(x_{n+1}) - h(u, grad V_{n+1}) dt. For affine drift f, h is tr(F) + 0.5 ||s * grad V||^2 + u dot (s * grad V), where s contains the diagonal diffusion entries and u is evaluated at the advanced state.\n\nInputs\n------\ncontinuation: Array of value and gradient data with shape (K, d + 1).\nnext_states: Advanced states with shape (K, d).\npolicy_matrix: Affine policy matrix with shape (d, d).\npolicy_bias: Affine policy bias with shape (d,).\ndrift_trace: Divergence of the affine drift.\nsigma_diag: Positive diffusion diagonal with shape (d,).\ndt: Positive time increment.\n\nReturns\n-------\ntargets: Float array of shape (K,).\n"
    orchestrator: false
  - number: 4
    name: "build_weighted_features"
    description: "The explicit BSDE regression operator is the identity plus a noise-weighted gradient, so its feature construction must represent both the pointwise value and the coordinate-specific derivative contribution that the operator mixes in. The feature construction uses one all-value channel and one channel per coordinate. In derivative channel i, every coordinate keeps phi(z) = [1, z, z^2] except coordinate i, which uses Sigma_i phi'(z), where Sigma_i = s_i xi_i sqrt(dt).\n\nInputs\n------\npoints: Left-endpoint states with shape (K, d).\nnoises: Fixed innovations with shape (K, d).\nsigma_diag: Positive diffusion diagonal with shape (d,).\ndt: Positive time increment.\n\nReturns\n-------\nweighted_features: Float array of shape (d + 1, K, d, 3).\n"
    orchestrator: false
  - number: 5
    name: "assemble_local_system"
    description: "Fixing all tensor-train cores except core j makes the explicit BSDE loss linear in that core, turning the nonlinear tensor-train fit into a sequence of local linear regressions solved one core at a time in an alternating least-squares sweep. The feature tensor contains one value channel followed by q complete coordinate-ordered derivative blocks, for 1 + qd channels. Contracting the fixed cores to the left and right gives channel-specific environment vectors. Their outer product with the local feature vector is summed over every block and vectorized in C order to yield one row of the local regression matrix.\n\nInputs\n------\nweighted_features: Array of shape (1 + qd, K, d, m) for a positive integer q.\ncores: Sequence of d compatible order-three TT cores.\ncore_index: Zero-based position of the core being optimized.\n\nReturns\n-------\ndesign_matrix: Float array of shape (K, r_{j-1} m r_j).\n"
    orchestrator: false
  - number: 6
    name: "solve_ridge_core"
    description: "An ALS micro-step minimizes a regularized linear least-squares objective while every other tensor-train core is fixed, turning one sweep of the tensor-train fit into an ordinary ridge regression. With design matrix A, target y, and positive regularization tau, the local coefficient vector satisfies (A^T A + tau I)c = A^T y. C-order reshaping restores the three-mode core used by the tensor train.\n\nInputs\n------\ndesign_matrix: Float array of shape (K, p).\ntargets: Float array of shape (K,).\ntau: Positive ridge magnitude.\ncore_shape: Three positive integers with product p.\n\nReturns\n-------\nupdated_core: Float array with shape core_shape.\n"
    orchestrator: false
  - number: 7
    name: "advance_adaptive_sweep"
    description: "After a local ALS update, adapting the regularization to the current residual keeps the ridge penalty scaled to the fit, and shifting the optimized core through the tensor train with a gauge-fixed SVD lets the next local system be solved for the neighboring core while preserving the value-function norm as the active core's Frobenius norm. The regularization magnitude is reset to gamma times the squared residual divided by the squared Frobenius norm of the updated core. Shifting the core one position to the right uses a reduced singular value decomposition: the left singular vectors remain in the middle TT component, while the singular values and right singular vectors are absorbed into the last component. The bond gauge is right anchored: absorbed-right rows are ordered by decreasing squared norm with stable original-index ties, then each row is oriented by its first largest-magnitude coefficient and the same sign is applied to the matching left singular vector. A zero absorbed row falls back to the corresponding left-vector pivot. The next local system sums one value channel and every complete derivative-channel block before solving with the adapted regularization.\n\nInputs\n------\nweighted_features: Three-coordinate BSDE feature channels of shape (1 + 3q, K, 3, m).\nmiddle_design: Local matrix used for the middle-core update.\ntargets: BSDE target vector.\nleft_core: Left-orthonormal first TT core.\nupdated_middle_core: Result of the preceding local solve.\nright_core: Right TT component before the shift.\ngamma: Positive relative regularization weight.\n\nReturns\n-------\nadaptive_state: One-dimensional array containing tau_next, the shifted middle core, and the updated last core in C order.\n"
    orchestrator: false
  - number: 8
    name: "recover_feedback_control"
    description: "The value-function gradient determines the reverse-diffusion feedback for diagonal diffusion, connecting the fitted tensor-train continuation value back to the sampler's drift correction. u*(x) = -s * grad V(x). The adaptive sweep state stores the final two TT components after the middle-to-right core shift. The shared basis mode m is inferred from the first core, and each coordinate uses monomials [1, z, ..., z^(m-1)]. Reconstructing the packed components and replacing one basis vector at a time by its derivative gives all three gradient components at the query state.\n\nInputs\n------\nquery: Three-factor state with shape (3,).\nleft_core: First TT core with shape (1, m, r_1), with m at least two.\nadaptive_state: Packed tau, shifted middle core, and updated last core.\nsigma_diag: Positive diffusion diagonal with shape (3,).\n\nReturns\n-------\nfeedback: Float array of shape (3,).\n"
    orchestrator: false
  - number: 9
    name: "run_full_pipeline"
    description: "The complete one-interval regression chains every earlier step into one deterministic backward BSDE update: advancing the controlled states, evaluating the continuation tensor train, forming right-endpoint targets, building derivative-aware features, and performing two ALS micro-steps connected by the adaptive core shift. Advances controlled factor states, evaluates the continuation tensor train, forms right-endpoint BSDE targets, and builds the derivative-aware left-endpoint features. A middle-core ridge update is followed by residual-scaled regularization, an orthogonal core shift, and a last-core update. The resulting value gradient gives the feedback control, whose first component is the reported scalar.\n\nInputs\n------\nstates, noises: Arrays of shape (K, 3).\ndrift_matrix, drift_bias: Affine drift parameters.\nsigma_diag: Positive diagonal diffusion entries.\npolicy_matrix, policy_bias: Affine trajectory-policy parameters.\nnext_cores: Three compatible continuation TT cores with basis mode three.\ninitial_cores: Three compatible current-time TT cores with an orthonormal first and last component.\ndt, tau_initial, gamma: Positive scalar parameters.\nquery: Three-factor evaluation state.\n\nReturns\n-------\nfeedback_component: Native float, the first component of the adapted feedback at query.\n"
    orchestrator: true
