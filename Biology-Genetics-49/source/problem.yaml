steps:
  - number: 1
    name: "01_size_response.py"
    description: "Census size of a population at given mutant frequencies, and its integral over the frequency, for five forms of the size response."
    orchestrator: false
  - number: 2
    name: "02_fixation_probability.py"
    description: "Probability that a mutant starting at a given frequency is eventually fixed, in the diffusion approximation for a haploid population whose census size depends on the mutant's frequency."
    orchestrator: false
  - number: 3
    name: "03_introduction_log_likelihood.py"
    description: "Natural logarithm of the probability of a count of fixations among independent single-copy introductions with a common fixation probability."
    orchestrator: false
  - number: 4
    name: "04_response_log_likelihoods.py"
    description: "Joint natural-log likelihood of the fixation counts of several mutant strains under each of the five size responses."
    orchestrator: false
  - number: 5
    name: "05_conditional_fixation_time.py"
    description: "Expected number of generations until a mutant fixes, conditional on its fixation, in the diffusion approximation for a haploid population whose census size depends on the mutant's frequency."
    orchestrator: false
  - number: 6
    name: "06_strain_sweep_table.py"
    description: "Fixation probability and conditional mean fixation time of a single cell of each of several mutant strains, under one size response."
    orchestrator: false
  - number: 7
    name: "07_first_sweep_duration.py"
    description: "Expected duration of the first selective sweep among several mutant strains, under the size response their establishment counts support."
    orchestrator: true
