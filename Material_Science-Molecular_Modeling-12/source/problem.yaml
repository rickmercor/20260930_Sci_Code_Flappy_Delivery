problem_id: "Material_Science-Molecular_Modeling-12"
subject: "materials"
subject_area: "Molecular Modeling"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2603.11203"
dependencies: ""
steps:
  - number: 1
    name: "reduced_state"
    description: "Convert a macroscopic reference state of a simple fluid into the reduced units of the mesoscopic model: the inputs are the temperature in K, the mass density in kg/m^3, the pressure in Pa, the specific isochoric heat capacity in J/(kg K), the isothermal compressibility in 1/Pa, the thermal expansion coefficient in 1/K, the molar mass in kg/mol and the coarse-graining degree phi, the integer number of physical molecules carried by one mesoparticle. The mesoparticle number density is c0 = rho_mass N_A / (M_w phi) and the mesoparticle mass is m = phi M_w / N_A. The reference length is the mean mesoparticle spacing L_ref = c0^(-1/3), so that the reduced bulk density is one by construction; the reference energy is u_ref = L_ref^3 / kappa_T, the work of compressing one mesoparticle volume against the macroscopic compressibility, so that the reduced compressibility is one by construction; the reference time is t_ref = sqrt(m L_ref^2 / u_ref). Reduced quantities carry a star: T* = k_B T / u_ref, P* = P kappa_T, the macroscopic isochoric heat capacity per mesoparticle in units of k_B, C_V* = c_V m / k_B, and the thermal expansion coefficient alpha* = alpha u_ref / k_B. Use k_B = 1.380649e-23 J/K and N_A = 6.02214076e23 1/mol. Raise ValueError if any physical input is not positive or if phi is not a positive integer."
    orchestrator: false
  - number: 2
    name: "lth_parameters"
    description: "Determine the first-estimate parameters of the mesoparticle local thermodynamic (LTh) model from the reduced macroscopic state (reduced temperature T*, pressure P*, macroscopic heat capacity per mesoparticle C_V*, thermal expansion coefficient alpha*, isothermal compressibility kappa* and bulk mesoparticle density c*; k_B = 1 in reduced units). The model gives every mesoparticle a pressure pi(theta, n) = pi00 + (alpha / kappa_T)(theta - theta0) + (1 / kappa_T) ln(n / n00) as a function of its dressed temperature theta and its density n, with reference values theta0, n00 and pi00 = pi(n00, theta0), a mesoscopic compressibility kappa_T and a mesoscopic expansion coefficient alpha, and an internal energy u = C_V theta + V(n) that is linear in the temperature with a mesoscopic heat capacity C_V. Fix theta0 = T* and n00 = c*, and determine pi00, kappa_T, alpha and C_V by requiring that the ensemble of mesoparticles reproduce the macroscopic pressure, isothermal compressibility, thermal expansion coefficient and isochoric heat capacity in the structureless limit in which density fluctuations are neglected and the pair distribution function is one everywhere, so that every particle sits at the bulk density c* and at the reservoir temperature: the macroscopic pressure is then the ideal mesoparticle gas term c* T* plus the particle pressure pi(T*, c*), and the internal energy per mesoparticle is the translational (3/2) T* plus the internal C_V T* plus V(c*). Derive the four relations from these two equations of state and their temperature and density derivatives (the macroscopic compressibility and expansion coefficient are defined from the total pressure at constant temperature and at constant pressure respectively) and return the parameters. Raise ValueError if T*, kappa* or c* is not positive, if the ideal-gas contribution kappa* c* T* reaches one, or if the resulting C_V is not positive."
    orchestrator: false
  - number: 3
    name: "particle_volume"
    description: "Evaluate the corrected mesoparticle density of the source's partition-of-unity volume construction, for one or more values of the primitive local density nb. The primitive density of particle i is nb_i = sum over j != i of w(r_ij) with the normalised quadratic kernel w(r) = 15 / (2 pi R_cut^3) (1 - r / R_cut)^2 for r < R_cut and zero beyond (its volume integral is one). The particle volume is its share of space under a mean-field partition of unity in which every other particle contributes a uniform background equal to nb_i: V_i(nb_i) = 4 pi integral from 0 to R_tilde of r^2 w_tilde(r) / (w_tilde(r) + nb_i) dr, where w_tilde is the same normalised quadratic kernel but of range R_tilde = R_cut / f_cut, f_cut >= 1 being a scaling factor tuned so that the corrected density reproduces the bulk density in simulations. The corrected density is n_i = 1 / V_i. Return, for each nb, n, zeta = dn / dnb and zeta_n = d zeta / dnb; evaluate the integral and both derivatives exactly (in closed form, or by differentiating under the integral sign and integrating to at least 1e-12), not by finite differences. Raise ValueError if nb is not positive, if R_cut is not positive or if f_cut is below one."
    orchestrator: false
  - number: 4
    name: "interaction_coefficients"
    description: "Evaluate the mean-field interaction coefficients of the LTh model at the reservoir temperature T for one or more values of the mean primitive density nb; params is the parameter vector [theta0, n00, pi00, kappa_T, alpha, C_V] of the previous steps. Integrating the particle entropy out of the canonical partition function leaves a configurational weight exp(-sum_i W(T, n_i) / k_B T) with the effective one-particle potential W(T, n) = V(n) + k_B T ln psi(n), where V(n) is the density-only part of the internal energy and ln psi(n) = -[C_V + alpha / (n kappa_T)] / k_B is the density-dependent part of the dressed entropy; the density derivative of W is the particle pressure at the reservoir temperature divided by n^2, dW/dn = pi(T, n) / n^2. Obtain V(n) from the model: the particle Helmholtz free energy f(theta, n) follows by integrating pi = n^2 df/dn at fixed theta from the pressure equation of state of the previous step, up to a function of theta alone that only feeds the temperature-dependent part C_V theta of u = f - theta df/dtheta; V(n) is the theta-independent remainder of u. Expanding W(T, n_i(nb_i)) around the mean field nb to first order in the deviation of the primitive density gives a one-body term plus the pair term [W_n] sum_{j != i} w(r_ij), with [W_n] = dW/dnb evaluated at nb through the chain rule with zeta = dn/dnb of the previous step, and the next coefficient [W_nn] = d[W_n]/dnb is needed for the fluctuation corrections. Return, for each nb, the corrected density n, the particle pressure pi(T, n), V(n), [W_n] and [W_nn]. Raise ValueError if T, kappa_T or n00 is not positive."
    orchestrator: false
  - number: 5
    name: "hnc_structure"
    description: "Solve the Ornstein-Zernike equation with the hypernetted-chain closure for a homogeneous fluid of number density rho whose pair potential is given, in units of k_B T, as the table betau of values beta u(r_i) on the uniform radial grid r_i = i dr, i = 1 .. N (N is the length of the table; there is no node at r = 0), and return the pair distribution function g(r_i) on the same grid. Work with the indirect correlation function gamma(r) = h(r) - c(r), where h = g - 1 is the total and c the direct correlation function: the closure is g(r) = exp(-beta u(r) + gamma(r)), and the Ornstein-Zernike relation in Fourier space reads gamma_hat(k) = rho c_hat(k)^2 / (1 - rho c_hat(k)). Use exactly the following discrete three-dimensional radial transform pair on the grid, with wavenumbers k_j = j pi / ((N + 1) dr), j = 1 .. N: forward f_hat(k_j) = (4 pi dr / k_j) sum_{i=1}^{N} r_i f(r_i) sin(k_j r_i), inverse f(r_i) = (dk / (2 pi^2 r_i)) sum_{j=1}^{N} k_j f_hat(k_j) sin(k_j r_i) with dk = pi / ((N + 1) dr) (these are type-I discrete sine transforms and are each other's inverse). Iterate to the fixed point of the map gamma -> inverse(rho c_hat^2 / (1 - rho c_hat)) with c = exp(-beta u + gamma) - 1 - gamma, starting from gamma = 0, with any convergence scheme (damped Picard, Ng acceleration, Newton) until the maximum absolute difference between gamma and its image under the map is below 1e-13; return g = exp(-beta u + gamma). Raise ValueError if the table is not one-dimensional with at least eight nodes or if rho or dr is not positive."
    orchestrator: false
  - number: 6
    name: "self_consistent_structure"
    description: "Predict the pair distribution function of the mesoparticle fluid of bulk density rho at reservoir temperature T without simulation, on the grid r_i = i dr, i = 1 .. n_grid, by closing the mean-field expansion self-consistently with the HNC structure. The mean field around a particle is the average primitive density it sees, nb = rho integral d^3r w(r) g(r), evaluated on the grid by the rectangle rule 4 pi dr sum_i r_i^2 w(r_i) g(r_i) (the same rule is used for every radial integral of this task). The pair potential that enters the HNC equation is the pairwise interaction of the expanded configurational energy sum_i W(T, n_i): with the expansion of the previous step every pair (i, j) appears once in the sum over i and once in the sum over j, and the pair potential is the coefficient of w(r_ij) in the total energy of the pair, which you must work out; it is evaluated with [W_n] at the current mean field and divided by T to give beta u on the grid. Start from g = 1 (so nb = rho times the kernel integral on the grid), alternate the HNC solution of the previous step and the update of nb until two successive values of nb agree to 1e-13, and return the HNC g of the converged mean field. Raise ValueError if T, rho, n_grid or dr is not positive, or if the grid does not extend beyond R_cut."
    orchestrator: false
  - number: 7
    name: "eos_state"
    description: "Evaluate the macroscopic equations of state of the mesoparticle fluid from a pair distribution function g tabulated on the grid r_i = i dr (i = 1 .. N, N = len(g)) at bulk density rho and reservoir temperature T. First recover the mean field nb = rho integral w g (rectangle rule) and the coefficients of the interaction step at that mean field. The pressure follows from the volume derivative of the configurational free energy: P = rho k_B T - (1 / (3 V)) < sum_i sum_{j != i} [W_n]_{nb_i} r_ij w'(r_ij) >, where [W_n]_{nb_i} is the coefficient evaluated at the instantaneous primitive density nb_i = sum_{k != i} w(r_ik) of particle i and w' is the kernel derivative. Expand [W_n]_{nb_i} to first order about the mean field with the coefficient [W_nn] of the interaction step, express the resulting averages of a homogeneous fluid through the pair distribution function and the triplet distribution function, and reduce the genuine triplet average with the Kirkwood superposition approximation g3(r_i, r_j, r_k) = g(r_ij) g(r_ik) g(r_jk). Work out the reduction yourself; the outcome is the ideal term plus three excess contributions of distinct origin, which are returned separately: the mean-field contribution, linear in [W_n]; the contribution in [W_nn] that involves only pair correlations; and the contribution in [W_nn] that involves triplet correlations, which reduces to a radial integral over a convolution of two radial functions and is to be evaluated with the discrete transform pair of the HNC step (product of the two forward transforms inverted back to the grid) followed by the rectangle-rule radial integral, every other radial integral also by the rectangle rule. The internal energy per particle is U/N = (3/2) k_B T + C_V T + V(n), the translational and internal kinetic parts plus the density part of the internal energy evaluated at the mean corrected density n = n(nb) (its fluctuation average vanishes to first order because the mean field is defined from the same g). Return [nb, n, P, mean-field contribution, pair-correlation fluctuation contribution, triplet-correlation fluctuation contribution, U/N]. Raise ValueError if g is not a one-dimensional table with at least eight nodes or if T, rho or dr is not positive."
    orchestrator: false
  - number: 8
    name: "density_fluctuations"
    description: "Quantify the density fluctuations that the first-order expansion of the previous steps neglects, from a pair distribution function g tabulated on the grid r_i = i dr (i = 1 .. N) at bulk density rho and reservoir temperature T. Recover the mean field nb = rho integral w g (rectangle rule) and the corrected density n, zeta and dzeta/dnb at that mean field. The variance of the primitive density of a particle about the mean field, <(nb_i - nb)^2> with nb_i = sum_{k != i} w(r_ik), is an average over the same homogeneous ensemble: express it through the pair and triplet distribution functions, separate the self term of the double sum from the genuine triplet average, reduce the latter with the Kirkwood superposition approximation, and evaluate the convolution that results with the discrete transform pair of the HNC step (product of the two forward transforms inverted back to the grid) and every radial integral with the rectangle rule. Then evaluate the next term of the expansion of the density part of the internal energy that the energy equation of state truncates: expanding V(n(nb_i)) to second order in nb_i - nb about the mean field and averaging gives V(n) plus one half of the second derivative [V_nn] = d^2 V / dnb^2 at the mean field (chain rule through n(nb) with zeta and dzeta/dnb, V(n) being the density part of the internal energy of the interaction step) times the variance. Return [variance, relative fluctuation sqrt(variance) / nb, [V_nn], second-order energy correction (1/2) [V_nn] variance, and the internal energy per particle U/N of the energy equation of state plus that correction]. Raise ValueError if g is not a one-dimensional table with at least eight nodes or if T, rho or dr is not positive."
    orchestrator: false
  - number: 9
    name: "calibrate_reference_pressure"
    description: "Calibrate the reference particle pressure pi00 of the LTh model against the structure-aware equation of state: find the value of pi00, all other entries of params held fixed, at which the pressure of the self-consistent HNC structure at (T, rho) on the grid (n_grid, dr) equals p_target, solving the scalar equation to |P - p_target| < 1e-13 with any root finder (the root is simple and lies close to the input pi00). Return the calibrated pi00, the pressure at the input pi00, and the corrected density n and the internal energy per particle U/N of the calibrated model. Raise ValueError if p_target is not positive."
    orchestrator: false
  - number: 10
    name: "response_coefficients"
    description: "Evaluate the macroscopic response implied by the structure-aware equation of state at (T, rho): the isochoric derivative (dP/dT) at fixed rho and the isothermal derivative (dP/drho) at fixed T, each by a central difference with the relative steps deltas = (dT/T, drho/rho), every displaced state being re-solved self-consistently on the grid (n_grid, dr) with the parameters params unchanged (theta0 and n00 stay at their reference values, so a displaced state is genuinely off-reference), and from them the implied macroscopic isothermal compressibility kappa = 1 / (rho dP/drho) and thermal expansion coefficient alpha = (dP/dT) / (rho dP/drho) in reduced units. Return [dP/dT, dP/drho, kappa, alpha]. Raise ValueError if either relative step is not positive."
    orchestrator: false
  - number: 11
    name: "lth_audit"
    description: "Run the complete structure-aware audit of the LTh parametrisation for one macroscopic reference state, state = (temperature in K, mass density in kg/m^3, pressure in Pa, specific isochoric heat capacity in J/(kg K), isothermal compressibility in 1/Pa, thermal expansion coefficient in 1/K), and a list of (R_cut*, f_cut) pairs, chaining the previous steps: reduce the state, determine the first-estimate LTh parameters, and for each cutoff solve the self-consistent HNC structure on the grid (n_grid, dr), recover its mean field, the corrected-density derivative zeta and the interaction coefficients [W_n] and [W_nn] at that mean field, verify that the HNC solution for the pair potential built from that [W_n] reproduces the structure (report the largest absolute difference), evaluate the equations of state and the density fluctuations, the response implied at the first-estimate parameters, the calibration of pi00 to the reduced reference pressure and the response at the calibrated pi00. Return a table with one head row followed by one row per cutoff. The head row holds [sum over the cutoffs of (calibrated pi00 minus first-estimate pi00), sum over the cutoffs of the calibrated pi00, T*, P*, C_V*, alpha*, theta0, n00, pi00, kappa_T, alpha, C_V, zeros]. Each cutoff row holds [R_cut*, f_cut, nb, n, zeta, W_n, W_nn, P, mean-field pair term, fluctuation pair term, fluctuation triplet term, U/N, variance of the primitive density, relative fluctuation, second-order energy correction, g at the first grid node, largest g, position of the largest g, largest absolute difference between the re-solved and the self-consistent g, implied kappa at the first-estimate parameters, implied alpha at the first-estimate parameters, calibrated pi00, calibrated minus first-estimate pi00, n of the calibrated model, U/N of the calibrated model, implied kappa at the calibrated pi00, implied alpha at the calibrated pi00]. Raise ValueError if state does not have six entries or if no cutoff is given."
    orchestrator: true
