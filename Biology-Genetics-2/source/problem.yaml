problem_id: "Biology-Genetics-2"
subject: "biology"
subject_area: "Genetics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.64898/2026.03.03.709416"
dependencies: ""
steps:
  - number: 1
    name: "01_focal_branch_intervals"
    description: "Locate, in every marginal tree of an ancestral recombination graph, the branch on\n\nthe focal haplotype's ancestral lineage whose time span contains the archaic time\n\ncutoff, and return the lower and upper endpoint of that branch for each tree."
    orchestrator: false
  - number: 2
    name: "02_tree_observation_statistic"
    description: "Count, in each marginal tree, the coalescence events that fall strictly inside\n\nthe time span of the focal branch, and combine that count with the branch length\n\ninto the per-tree observation that the archaic ancestry model is fitted to."
    orchestrator: false
  - number: 3
    name: "03_esd_outlier_flags"
    description: "Flag the upper-tail outliers of the genome-wide observation distribution with a\n\none-sided generalized extreme Studentized deviate test, returning a binary\n\nindicator per marginal tree."
    orchestrator: false
  - number: 4
    name: "04_weighted_gamma_mle"
    description: "Fit the shape and rate of a gamma density to a weighted sample by maximum\n\nlikelihood, solving the shape equation by bisection on a fixed bracket."
    orchestrator: false
  - number: 5
    name: "05_gamma_emission_logpdf"
    description: "Evaluate the log emission density of both hidden states at every marginal tree,\n\nreturning a two-row matrix of log densities."
    orchestrator: false
  - number: 6
    name: "06_forward_backward_posteriors"
    description: "Run the forward and backward recursions of the two-state chain in the log domain\n\nand return the posterior state probabilities at every marginal tree together with\n\nthe log-likelihood of the observation sequence."
    orchestrator: false
  - number: 7
    name: "07_baum_welch_parameters"
    description: "Re-estimate the archaic emission parameters and the two transition probabilities\n\nby expectation maximisation, holding the modern human emission and the initial\n\nstate distribution fixed, and return the fitted parameters with the log-likelihood\n\nreached."
    orchestrator: false
  - number: 8
    name: "08_archaic_segments"
    description: "Turn the per-tree posterior probability of the archaic state into called ancestry\n\ntracts by taking maximal runs of consecutive trees above a posterior threshold and\n\nkeeping only those runs that are long enough in both physical and genetic units."
    orchestrator: false
  - number: 9
    name: "09_admixture_time_estimate"
    description: "Combine the focal branch endpoints of the marginal trees that fall inside the\n\nretained archaic tracts into a single estimate of the admixture time, weighting\n\neach tree by the physical span it covers."
    orchestrator: false
  - number: 10
    name: "10_run_full_pipeline"
    description: "Run the whole archaic ancestry pipeline on one ancestral recombination graph and\n\nreturn the resulting estimate of the admixture time in generations."
    orchestrator: true
