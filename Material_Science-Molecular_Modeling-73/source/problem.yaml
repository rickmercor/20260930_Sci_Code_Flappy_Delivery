problem_id: "Material_Science-Molecular_Modeling-73"
subject: "materials"
subject_area: "Molecular Modeling"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1021/acs.jctc.5c01498"
dependencies: ""
steps:
  - number: 1
    name: "01_compute_local_crossing_probabilities"
    description: "Reduce the raw partial-path type counts of every ensemble to the local crossing probabilities that drive the chain."
    orchestrator: false
  - number: 2
    name: "02_build_state_space"
    description: "Enumerate the segment types that a long trajectory visits and fix the ordering used by every array downstream."
    orchestrator: false
  - number: 3
    name: "03_build_transition_matrix"
    description: "Wire the enumerated segment types into the stochastic matrix of the chain, including the two boundary conventions."
    orchestrator: false
  - number: 4
    name: "04_compute_crossing_probability"
    description: "Solve the hitting-probability system of the chain to obtain the probability of reaching the product state before falling back."
    orchestrator: false
  - number: 5
    name: "05_compute_overlap_free_times"
    description: "Turn the measured three-part segment lengths into the time each state contributes to a stitched trajectory without double counting."
    orchestrator: false
  - number: 6
    name: "06_compute_visit_counts"
    description: "Count how often each segment type is visited on the way from the reactant state to the product state."
    orchestrator: false
  - number: 7
    name: "07_compute_interface_dwell_times"
    description: "Attribute the accumulated time of one passage to the interface each contribution was measured on."
    orchestrator: false
  - number: 8
    name: "08_compute_conditional_passage_time"
    description: "Recover the mean length of a full excursion out of the reactant state, which the partial-path sampling never observes directly."
    orchestrator: false
  - number: 9
    name: "09_compute_rate_constant"
    description: "Combine the reconstructed excursion length with the crossing probability into the transition rate."
    orchestrator: false
  - number: 10
    name: "10_compute_bottleneck_dwell"
    description: "Reduce the accumulated-time profile to the dwell time of the interface that limits the transition."
    orchestrator: false
  - number: 11
    name: "11_run_kcl_dissociation_pipeline"
    description: "Chain the sub-problem functions 01-10 end to end on the measured KCl dissociation data set and return the dwell time of the interface that limits the transit."
    orchestrator: true
