steps:
  - number: 1
    name: "two_qubit_pauli"
    description: "Returns the 4\u00d74 matrix of a two-qubit Pauli given its lexicographic code in {I, X, Y, Z}\u2297{I, X, Y, Z}."
    orchestrator: false
  - number: 2
    name: "fsim_unitary"
    description: "Builds the two-qubit fractional gate fSim(\u03b8, \u03c6) = CP(\u2212\u03c6) R_XX(\u03b8) R_YY(\u03b8) with the standard half-angle generators."
    orchestrator: false
  - number: 3
