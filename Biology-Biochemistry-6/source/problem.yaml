problem_id: "Biology-Biochemistry-6"
subject: "biology"
subject_area: "Biochemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "https://doi.org/10.1371/journal.pcbi.1014642"
dependencies: ""
steps:
  - number: 1
    name: "01_compute_enzyme_demand"
    description: "Evaluate the proteome fraction that each enzyme of a linear pathway needs, per unit growth rate, to hold its metabolites at given levels in balanced exponential growth."
    orchestrator: false
  - number: 2
    name: "02_compute_metabolite_costs"
    description: "Evaluate, for every metabolite of a linear pathway, the proteome cost per unit metabolite level at which its current level would be the cheapest way to carry the enzyme's flux."
    orchestrator: false
  - number: 3
    name: "03_propagate_optimal_levels"
    description: "Construct the metabolite levels of a linear pathway at which its total enzyme demand is stationary, indexing the one-parameter family either by the last metabolite level or by the total metabolite pool."
    orchestrator: false
  - number: 4
    name: "04_close_optimal_transporter"
    description: "Close a growth-optimal set of internal metabolite levels at the uptake step when the transporter amount is itself growth-maximising, returning the external nutrient level, the transporter amount and the growth rate."
    orchestrator: false
  - number: 5
    name: "05_close_regulated_transporter"
    description: "Close a growth-optimal set of internal metabolite levels at the uptake step when the transporter amount is set by nutrient-dependent regulation, returning the external nutrient level, the transporter amount and the growth rate."
    orchestrator: false
  - number: 6
    name: "06_solve_family_member"
    description: "Select, by bisection on the level of the last metabolite, the member of the one-parameter family of growth-optimal states whose external nutrient level or growth rate equals a target."
    orchestrator: false
  - number: 7
    name: "07_summarize_growth_response"
    description: "Turn the enzyme amounts of a series of balanced-growth states into zero-growth response factors from straight-line fits and summarise them by their mass-weighted mean and spread."
    orchestrator: false
  - number: 8
    name: "08_estimate_response_spread"
    description: "Compose every earlier step to compute the growth-optimal states of the pathway across a nutrient-limited growth series, verify the stationary family's local response, and return the mass-weighted spread of the enzymes' zero-growth response factors."
    orchestrator: true
