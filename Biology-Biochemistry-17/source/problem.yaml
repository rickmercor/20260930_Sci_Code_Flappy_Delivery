answer_type: "single_numeric"
paper_doi: "10.1063/5.0318283"
dependencies: ""
steps:
  - number: 1
    name: "metropolis_segment"
    description: "Run the lattice Metropolis walk of the problem statement from a given site, at a given inverse temperature, until the walker first enters state A or state B or a maximum number of steps has been made, drawing the random numbers from the supplied generator exactly as the problem statement prescribes, and return the visited sites in order. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 2
    name: "tis_shooting_trial"
    description: "Perform one two-way shooting trial of the problem statement in the ensemble of paths that leave A and cross the given interface of the given interface set, starting from the supplied current path, and return the path kept after the trial: the trial path if it is accepted, the current path otherwise. The segments are generated with the lattice walk of step 1 and every random number comes from the supplied generator in the order the problem statement prescribes. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 3
    name: "sample_interface_ensemble"
    description: "Sample the interface ensemble (set_index, k) of the problem statement by two-way shooting, with the generator, initial path, interface tables and trial of the problem statement, and return, for each of the n_samples stored paths, the largest value over its frames of each of the three order parameters. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 4
    name: "joint_log_partition_sums"
    description: "Given pooled paths from interface ensembles of one or more interface sets, described by the maxima of the sets' order parameters over each path, together with the interfaces of each set and the number of samples drawn in each ensemble, return the natural logarithms of the maximum-likelihood (multistate Bennett acceptance ratio) estimates of the conditional partition sums of all the ensembles, with every pooled path used in the joint estimate and the reweighted weights of the pooled paths normalised to sum to one. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 5
    name: "crossing_probability"
    description: "Given the pooled paths, interfaces and sample counts of step 4 and the log partition sums of all the ensembles, reweight every pooled path as the joint maximum-likelihood reweighting prescribes and return, for each value lam in lams, the natural logarithm of the reweighted probability that a path which crosses lambda1 = x = lam_ref also crosses x = lam. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 6
    name: "rescaled_crossing_probability"
    description: "Reweight each interface set on its own, with the maximum-likelihood reweighting of step 4 restricted to that set's ensembles and order parameter, rescale the weights of each set so that the mean weight of its paths reaching B is one, pool the rescaled sets, and return the natural logarithm of the probability that a path which crosses x = lam_ref reaches B in the pooled ensemble. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 7
    name: "exact_crossing_probability"
    description: "Compute, without sampling, the natural logarithm of the exact probability that a path of the lattice Metropolis walk which leaves A and crosses x = lam_ref goes on to reach B, at inverse temperature beta, from the transition probabilities of the walk and its equilibrium distribution. The submitted function must import inside itself whatever it uses."
    orchestrator: false
  - number: 8
    name: "compare_crossing_estimates"
    description: "Run the whole comparison of the problem statement for the given numbers of discarded and stored trials, inverse temperature, seed and step cap: sample all 29 interface ensembles, and return 1e5 times the probability that a path leaving A which crosses x = -0.8 reaches B, estimated by the joint reweighting of the three sets, by the joint reweighting of sets 1 and 2, by set 1 alone, by the rescaled combination of the three sets, and exactly. The submitted function must import inside itself whatever it uses."
    orchestrator: true
