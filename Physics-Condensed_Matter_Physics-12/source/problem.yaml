difficulty: "difficult"
answer_type: "numeric"
paper_doi: "10.48550/arXiv.2606.04936"
dependencies: ""
steps:
  - number: 1
    name: "matsubara_grids"
    description: "Build the fermionic and bosonic Matsubara grids of a finite frequency box and return them concatenated, fermionic first."
    orchestrator: false
  - number: 2
    name: "bare_propagator"
    description: "Give the non-interacting Green's function of the hybridised single-site model on the fermionic box, including the interaction-induced shift of the chemical potential and the damping supplied by the bath."
    orchestrator: false
  - number: 3
    name: "bare_lambda"
    description: "Give the spin-diagonalised bare interaction in the four channels, derived from the spin structure of the on-site interaction."
    orchestrator: false
  - number: 4
    name: "irreducible_vertices"
    description: "Assemble the channel-irreducible vertices by combining the bare channel constants with the reducible vertices of all four channels under the frequency substitutions and weights given below."
    orchestrator: false
  - number: 5
    name: "pair_bubbles"
    description: "Build the two bare two-particle bubbles from a propagator: the particle-hole product G(nu)G(nu+omega) and the particle-particle product G(nu)G(-nu-omega)."
    orchestrator: false
  - number: 6
    name: "self_energy"
    description: "Give the self-energy from the equation of motion: a static Hartree term plus a dynamic term built from whichever combination of the density and magnetic full vertices survives at leading order in the interaction."
    orchestrator: false
  - number: 7
    name: "parquet_map"
    description: "Apply one full sweep of the self-consistent scheme to a state, returning the next state."
    orchestrator: false
  - number: 8
    name: "relax_parquet"
    description: "Drive the state to a fixed point of the sweep by damped iteration, mixing a fraction p of the swept state into the old one at every step."
    orchestrator: false
  - number: 9
    name: "gamma_from_full_vertex"
    description: "Recover the channel-irreducible vertices from the FULL vertices by inverting the ladder relations, rather than by summing them."
    orchestrator: false
  - number: 10
    name: "strong_coupling_map"
    description: "Perform one sweep of the alternative iteration that carries the FULL vertices instead of the reducible ones, in the same flattened layout."
    orchestrator: false
  - number: 11
    name: "stability_spectrum"
    description: "Give the eigenvalues of the matrix that controls local convergence of the damped iteration for EITHER sweep, namely the identity minus the derivative of the named sweep with respect to the state."
    orchestrator: false
  - number: 12
    name: "minimal_damping_audit"
    description: "Run the benchmark configuration end to end and report the largest retained fresh-sweep fraction that still leaves the fixed point locally stable under the safety-adjusted criterion for BOTH iteration schemes at once."
    orchestrator: true
