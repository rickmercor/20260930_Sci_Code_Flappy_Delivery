steps:
  - number: 1
    name: "laplacian_symbol"
    description: "Build the Fourier symbol of the negative Laplacian $-\\\\Delta_h$ on a periodic rectangle discretised by the Fourier pseudo-spectral method. The rectangle is $(0,L_x)\\\\times(0,L_y)$ and carries $M_x\\\\times M_y$ equispaced points with $M_x$ and $M_y$ even; the admissible wavenumber indices are the signed set $-M_x/2\\\\le k\\\\le M_x/2-1$ and $-M_y/2\\\\le m\\\\le M_y/2-1$, stored in the order `numpy.fft.fftfreq` produces, so that the returned array can be multiplied elementwise against `numpy.fft.fft2` output without any reordering. Return the real array $\\\\lambda_{k,m}$ of shape `(Mx, My)`. The two axes are independent: each carries its own number of points and its own edge length, and neither the grid spacing nor a single scalar $L$ may be substituted for the pair."
    orchestrator: false
  - number: 2
    name: "bdf_kernels"
    description: "Return the two multistep kernels of order $q\\\\in\\\\{3,4,5\\\\}$ that the time discretisation needs, stacked as a `(2, q)` array. Row $0$ is the BDF$q$ **convolution kernel** $\\\\beta^{(q)}$, the weights that act on FIRST DIFFERENCES in $\\\\mathcal{B}_qv^n=\\\\tfrac1\\\\tau\\\\sum_{j\\\\ge0}\\\\beta_j^{(q)}\\\\delta_\\\\tau v^{n-j}$ where $\\\\delta_\\\\tau v^n=v^n-v^{n-1}$. Row $1$ is the extrapolation kernel $\\\\alpha^{(q)}$ appearing in $\\\\hat v_q^{\\\\,n}=v^n-\\\\delta_\\\\tau^qv^n=v^n-\\\\sum_{j\\\\ge0}\\\\alpha_j^{(q)}\\\\delta_\\\\tau v^{n-j}$, where $\\\\delta_\\\\tau^m$ denotes the $m$-fold first difference. Both kernels vanish for $j\\\\ge q$, so only the first $q$ entries are returned. **Row $0$ is not the direct BDF$q$ coefficient vector** acting on $v^n,\\\\dots,v^{n-q}$: the two vectors share only their leading entry, and the conversion between them belongs to the step that uses them, not here."
    orchestrator: false
  - number: 3
    name: "spectral_gradient"
    description: "Apply the two first-derivative operators $D_x$ and $D_y$ of the Fourier pseudo-spectral discretisation to one real periodic field, and return them stacked as $\\\\nabla_hv=(D_xv,D_yv)^T$ with shape `(2,) + v.shape`. Each is applied by transforming, multiplying by that direction's symbol, transforming back and taking the real part. **The Nyquist entry is dropped**: the multiplier is set to zero at $k=-M_x/2$ for $D_x$ and at $m=-M_y/2$ for $D_y$ before the inverse transform. No dealiasing of any other kind is applied. Each axis carries its own edge length and its own point count."
    orchestrator: false
  - number: 4
    name: "discrete_energy"
    description: "Evaluate the original discrete free energy of the square phase field crystal model, $E=\\\\tfrac14\\\\|\\\\nabla_h\\\\phi\\\\|_4^4-\\\\tfrac{\\\\varepsilon}{2}\\\\|\\\\phi\\\\|^2+\\\\tfrac12\\\\|(1+\\\\Delta_h)\\\\phi\\\\|^2$, and return it as a single float. All three norms carry the discrete inner product $\\\\langle u,w\\\\rangle=h_xh_y\\\\sum_{ij}u_{ij}w_{ij}$, so every sum is weighted by the cell area $h_xh_y=(L_x/M_x)(L_y/M_y)$. The quartic is a **gradient** quartic and the modulus inside it is the pointwise Euclidean length of the vector $\\\\nabla_h\\\\phi$, so the summand is $\\\\big((D_x\\\\phi)^2+(D_y\\\\phi)^2\\\\big)^2$: it is neither $\\\\phi^4$ nor the square of the squared $L^2$ norm of the gradient. The concave term enters with a minus sign."
    orchestrator: false
  - number: 5
    name: "quartic_divergence"
    description: "Evaluate the nonlinear term of the chemical potential, $N(\\\\phi)=-\\\\nabla_h\\\\cdot\\\\big(|\\\\nabla_h\\\\phi|^2\\\\nabla_h\\\\phi\\\\big)$, and return it as a real array with the same shape as $\\\\phi$. Build it in the order the expression is written: form the vector $\\\\nabla_h\\\\phi=(D_x\\\\phi,D_y\\\\phi)$, form the scalar $|\\\\nabla_h\\\\phi|^2=(D_x\\\\phi)^2+(D_y\\\\phi)^2$ pointwise, multiply it into each component to get the flux $\\\\boldsymbol F=|\\\\nabla_h\\\\phi|^2\\\\nabla_h\\\\phi$, then take $-\\\\big(D_xF_x+D_yF_y\\\\big)$. Both the gradient and the divergence use the first-derivative operators of the earlier step, with their Nyquist entries dropped. **Do not expand by the chain rule**: $-\\\\nabla_h\\\\cdot(|\\\\nabla_h\\\\phi|^2\\\\nabla_h\\\\phi)$ is not $-3|\\\\nabla_h\\\\phi|^2\\\\Delta_h\\\\phi$, because $|\\\\nabla_h\\\\phi|^2$ is not constant, and the discrete product rule fails for spectral differences in any case."
    orchestrator: false
  - number: 6
    name: "convex_split_step"
    description: "Advance the fully discrete BDF$q$ convex-splitting scheme by one time step and return the new field $\\\\phi^n$. The input `hist` is the array $[\\\\phi^{n-q},\\\\phi^{n-q+1},\\\\dots,\\\\phi^{n-1}]$ of shape `(q, Mx, My)`, oldest first, and $q$ is read from its leading axis. The scheme is $\\\\mathcal{B}_q\\\\phi^n=\\\\Delta_h\\\\mu^n$ with $\\\\mu^n=N(\\\\phi^n)-\\\\varepsilon\\\\hat\\\\phi_q^{\\\\,n}+(1+\\\\Delta_h)^2\\\\phi^n-S\\\\tau^q\\\\Delta_h\\\\mathcal{B}_q\\\\phi^n$, where $N$ is the quartic divergence of the previous step. Eliminate $\\\\mu^n$, move every term linear in $\\\\phi^n$ to the left, and invert the resulting constant-coefficient operator in Fourier space; the remaining nonlinearity is resolved by the Picard iteration this rearrangement defines, started from $\\\\phi^{(0)}=\\\\hat\\\\phi_q^{\\\\,n}$ and stopped when $\\\\max_{ij}|\\\\phi^{(s+1)}-\\\\phi^{(s)}|<10^{-13}$, with a hard cap of $200$ iterations."
    orchestrator: false
  - number: 7
    name: "modified_energy"
    description: "Evaluate the modified discrete energy $\\\\hat E^n$, the quantity whose decay the scheme's stability theorem establishes - for data band-limited strictly below Nyquist, a hypothesis this task's convention does not make automatic and which the background states in full. The input `hist` is $[\\\\phi^{n-q},\\\\dots,\\\\phi^{n}]$ of shape $(q+1, Mx, My)$, oldest first, so that the $q$ first differences $\\\\delta_\\\\tau\\\\vec\\\\phi^{\\\\,n}=(\\\\delta_\\\\tau\\\\phi^{n-q+1},\\\\dots,\\\\delta_\\\\tau\\\\phi^{n})$ can be formed; $q$ is read from the shape of the supplied matrix $\\\\mathbf G$. The quantity to evaluate is the modified discrete energy defined in the problem statement, with $\\\\mathbf G$ and $\\\\mathbf J$ supplied as arguments and $\\\\langle\\\\vec a,\\\\vec b\\\\rangle$ the sum of the componentwise discrete inner products over the $q$ slots; how each of its terms ends up scaling in $\\\\tau$ is part of what is graded. where $E^n$ is the original discrete energy of the LAST slot, $\\\\langle u,w\\\\rangle_{-1}=\\\\langle(-\\\\Delta_h)^{-1}u,w\\\\rangle$ with the zero Fourier mode of $(-\\\\Delta_h)^{-1}$ set to zero, and the middle term contracts the two components of each gradient as well as the $q$ slots. **Note the factor $\\\\varepsilon$ on the $\\\\mathbf J$ term.** Return a single float."
    orchestrator: false
  - number: 8
    name: "stabilization_certificate"
    description: "Evaluate the stabilization condition that the energy-dissipation proof requires, and return the four diagnostics $[C_q,\\\\;C_{\\\\mathrm{req}},\\\\;S_{\\\\min},\\\\;C_q-C_{\\\\mathrm{req}}]$ as a length-4 array. Here $C_q$ is the step-size-independent constant the argument produces from the stabilization parameter $S$, $C_{\\\\mathrm{req}}$ is the value it has to reach, $S_{\\\\min}$ is the smallest $S$ for which it does, and the last entry is the margin, non-negative exactly when the condition holds. The inputs are the order $q$, the two constants $\\\\kappa_q>0$ and $\\\\eta_q$ of the two quadratic decompositions, the model parameter $\\\\varepsilon$, and the stabilization parameter $S\\\\ge0$. The formulas are valid for $q\\\\ge3$."
    orchestrator: false
  - number: 9
    name: "terminal_energy_sum"
    description: "**Final orchestrator.** Run the BDF$3$ convex-splitting scheme on each of five fixed configurations and return the sum of the five terminal **modified** discrete energies. Nothing about a configuration is hard-wired except the numbers in its row: in particular the stabilization parameter is derived, not given. For each configuration, in order: call the certificate of the earlier sub-problem at $q=3$, at the published $q=3$ decomposition constants $\\\\kappa_3$ and $\\\\eta_3$ - given in the formulas below - and at that configuration's $\\\\varepsilon$, read $S_{\\\\min}$ off it and set $S=s\\\\,S_{\\\\min}$ with $s$ the configuration's safety factor; build the initial field $\\\\phi_0$ from its seed; set the start-up layers $\\\\phi^0=\\\\phi^1=\\\\phi^2=\\\\phi_0$ and carry a fourth copy, so that even a run of zero steps holds the $q+1=4$ levels the modified energy needs; take the prescribed number of steps with the step of the earlier sub-problem; and evaluate the modified discrete energy of the last four levels with $\\\\mathbf G_3$, $\\\\mathbf J_3$ and that configuration's $S$ and $\\\\tau$. The five configurations, in this order, are P1: trigonometric seed, $(L_x,L_y)=(8\\\\pi,8\\\\pi)$, $(M_x,M_y)=(32,32)$, $\\\\varepsilon=0.25$, $s=200$, $\\\\tau=0.05$, $12$ steps; P2: nucleus seed, $(25,25)$, $(32,32)$, $\\\\varepsilon=0.50$, $s=100$, $\\\\tau=0.10$, $20$ steps; P3: trigonometric, $(6\\\\pi,10\\\\pi)$, $(24,40)$, $\\\\varepsilon=0.40$, $s=250$, $\\\\tau=0.04$, $15$ steps; P4: nucleus, $(32,20)$, $(48,24)$, $\\\\varepsilon=0.30$, $s=50$, $\\\\tau=0.08$, $18$ steps; P5: trigonometric, $(10\\\\pi,4\\\\pi)$, $(40,24)$, $\\\\varepsilon=0.20$, $s=120$, $\\\\tau=0.06$, $14$ steps. The keyword arguments override, for every configuration at once, the mesh, the step size, the number of steps and the stabilization parameter - an $S$ passed explicitly bypasses the certificate; `configs` restricts the sum to the named subset. With no arguments the function returns the graded answer."
    orchestrator: true
