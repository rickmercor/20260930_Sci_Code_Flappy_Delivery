problem_id: "task_tbkmae0e"
subject: "chemistry"
subject_area: "Computational Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1021/acs.jctc.6c00664"
dependencies: ""
steps:
  - number: 1
    name: "ao_overlap_matrix"
    description: "Implement ao_overlap_matrix, which returns the exact overlap matrix of a basis of normalized s-type primitive Gaussians."
    orchestrator: false
  - number: 2
    name: "ao_eri_tensor"
    description: "Implement ao_eri_tensor, which returns the exact four-index electron repulsion integral tensor over a basis of normalized s-type primitive Gaussians."
    orchestrator: false
  - number: 3
    name: "atom_centered_grid"
    description: "Implement atom_centered_grid, which lays down the input real-space quadrature grid as a union of atom-centered shells built from six octahedral directions at a set of radii."
    orchestrator: false
  - number: 4
    name: "overlap_fit_matrix"
    description: "Implement overlap_fit_matrix, which builds the linear map from grid quadrature weights to the quadrature estimate of the atomic-orbital overlap matrix, with the orbital-pair index flattened into a single row index."
    orchestrator: false
  - number: 5
    name: "nnls_grid_weights"
    description: "Implement nnls_grid_weights, which refits the quadrature weights of a grid as the non-negative least-squares solution that best reproduces the exact atomic-orbital overlap matrix."
    orchestrator: false
  - number: 6
    name: "prune_zero_weight_points"
    description: "Implement prune_zero_weight_points, which removes from a refitted quadrature grid every point whose non-negative weight is exactly zero, keeping the surviving points and weights in order."
    orchestrator: false
  - number: 7
    name: "thc_collocation_matrix"
    description: "Implement thc_collocation_matrix, which forms the weighted collocation matrix that carries the atomic orbitals in grid-based least-squares tensor hypercontraction."
    orchestrator: false
  - number: 8
    name: "thc_grid_metric"
    description: "Implement thc_grid_metric, which forms the grid metric matrix of least-squares tensor hypercontraction from a weighted collocation matrix."
    orchestrator: false
  - number: 9
    name: "pivoted_cholesky_points"
    description: "Implement pivoted_cholesky_points, which prunes a grid by an incomplete pivoted Cholesky decomposition of its least-squares tensor hypercontraction metric and returns the indices of the selected points in the order they become pivots."
    orchestrator: false
  - number: 10
    name: "thc_core_matrix"
    description: "Implement thc_core_matrix, which solves for the central matrix of least-squares tensor hypercontraction on a given weighted grid."
    orchestrator: false
  - number: 11
    name: "pruning_rmsd_ratio"
    description: "Implement pruning_rmsd_ratio, the end-to-end comparison of two ways of pruning the same input grid for least-squares tensor hypercontraction: it returns the root-mean-square deviation of the integrals reconstructed on a pivoted-Cholesky-pruned grid divided by that on a grid refitted and pruned by non-negative least squares against the overlap matrix."
    orchestrator: true
