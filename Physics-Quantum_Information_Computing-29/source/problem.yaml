steps:
  - number: 1
    name: "01_detector_matrix"
    description: "Construct the binary detector matrix from circulant column supports. For modulus m and an integer array offsets of shape (b,k), column a*m+q contains ones at rows (q+offsets[a,t]) modulo m. Require 3<=m<=16, 1<=b<=4, 2<=k<=m, b*m<=64 and distinct offsets in each row, with each offset in [0,m-1]. Return an integer array of shape (m,b*m). These are synthetic construction bounds, not a fitted physical regime. Invalid inputs raise ValueError."
    orchestrator: false
  - number: 2
    name: "02_residual_syndrome"
    description: "Return the residual syndrome after fixing selected binary faults. XOR the original syndrome with each column of H whose fixed value is one. H is a binary array with shape (m,n), 1<=m<=32 and 2<=n<=64. The binary syndrome has length m and fixed has length n with entries -1, 0 or 1; -1 denotes an unmasked fault. Every detector must retain at least two unmasked neighbors. These synthetic domain restrictions keep every later min-sum reduction nonempty. Real numeric array inputs, including zero-imaginary complex arrays, are accepted. Invalid shape, finiteness, value or live-degree conditions raise ValueError. Return a length-m integer array without mutating inputs."
    orchestrator: false
  - number: 3
    name: "03_masked_run"
    description: "Run warm-started masked flooding min-sum. Obtain the residual syndrome from residual_syndrome(H,syndrome,fixed). On each live edge, the check message is (-1) to the residual bit power times the product of signs and minimum absolute value of the other live incoming fault messages; sign(0)=0. A live posterior is its prior plus incoming check messages. Its outgoing message excludes the recipient's check message. Accumulate signed posteriors starting at zero for this call only. Complete all outgoing updates before testing the residual syndrome, using live decisions posterior<=0 and zeros in masked positions. Stop after the first match or max_iters, never before iteration one. Return (messages,posterior_sum,iterations,correction,success), with fixed values restored even on failure, masked edge messages unchanged and nonedges zero. The matrix, syndrome and mask satisfy the residual-syndrome domain. Priors have length n and magnitude<=16, messages have shape (m,n), magnitude<=1e18 and zero nonedges; all are finite real numeric arrays, including zero-imaginary complex arrays. Treat input binary64 values as exact real inputs to the recurrence, without intermediate rounding that changes a sign, minimum or convergence decision. Return binary64 arrays with absolute error<=1e-9 plus 1e-12 times the reference magnitude in each entry. This includes small residuals after cancellation of large warm messages. max_iters is a nonboolean integer or integer-valued real scalar in [1,32]. Invalid inputs raise ValueError. Do not mutate inputs."
    orchestrator: false
  - number: 4
    name: "04_path_statistics"
    description: "Return the next branching index, predictive path score and unnormalized reliability sum from one conditional run. For the unmasked index set U, select the smallest index minimizing abs(posterior_sum[j]); compute A=sum over U of abs(posterior_sum[j]) and score=A/iterations. The accumulator contains signed posteriors from the current run only, not a sum of magnitudes or a cumulative path history. posterior_sum is a finite real length-n array with magnitude<=1e12 and 2<=n<=64. fixed is a length-n array in {-1,0,1}, at least one entry is -1 and masked accumulator entries are zero. iterations is a nonboolean integer-valued real scalar in [1,32]. Return three native numeric scalars (index,score,A). Invalid inputs raise ValueError."
    orchestrator: false
  - number: 5
    name: "05_rank_paths"
    description: "Return indices of the highest-scoring paths in deterministic order. Sort scores descending, break equal scores by the lexicographic sequence of (fault index,fixed value) pairs in each path and break identical keys by original candidate order. Keep at most width indices. scores is a finite nonnegative length-c array bounded by 1e12, with 1<=c<=64. paths has shape (c,d,2), where 0<=d<=6; entries are integer-valued, fault indices are in [0,63], values are binary and no index repeats inside a path. width is a nonboolean integer in [1,32]. Return an integer vector of length min(c,width). Invalid inputs raise ValueError; inputs are not mutated."
    orchestrator: false
  - number: 6
    name: "06_branch_trajectory"
    description: "Return the retained population of a finite predictive-reliability branching decoder. Initialize fault-to-detector messages to H times the prior vector, run masked_run(H,prior,syndrome,messages,all_unmasked,initial_iters) and select the initial node with path_statistics(). Each round expands retained paths in their current order, assigning their selected node zero then one. Each child copies its parent's final messages, extends its own fixed mask and runs masked_run() for inner_iters. Its next node and score come from path_statistics() on that call's accumulator and actual iterations. Converged children stay eligible. Rank children with rank_paths() and keep width entries. Track distinct successful full corrections. Return (scores,paths,initial_node,leading_iterations,leading_sum,result_count), with scores descending and paths shaped (population,rounds,2). H and prior satisfy masked_run's domain; H must have at least rounds+2 ones per row and n>rounds. rounds is a nonboolean integer in [1,6], width in [1,8] and both iteration budgets are nonboolean integer-valued scalars in [1,32]. These bounds allow at most 63 conditional calls, so a 64-distinct-solution collection limit never terminates this benchmark before its round limit. Invalid domains or upstream magnitude failures raise ValueError. Do not mutate inputs."
    orchestrator: false
  - number: 7
    name: "07_terminal_score"
    description: "Return the largest retained predictive path score for a circulant detector fixture. Compose detector_matrix(modulus,offsets) with branch_trajectory() using the supplied log odds and syndrome, then return its first retained score as a native float. The modulus and offset domain is that of detector_matrix(), and all remaining inputs obey branch_trajectory(), including row degree at least rounds+2, n>rounds, finite prior magnitude<=16, nonboolean rounds in [1,6], width in [1,8] and nonboolean integer-valued iteration budgets in [1,32]. The synthetic domain keeps the distinct-result collection limit 64 unreachable. Every upstream domain failure raises ValueError. Return the unrounded score and do not mutate inputs."
    orchestrator: false
  - number: 8
    name: "08_trace_score_cell"
    description: "Return the exact affine terminal score and its executed-comparison cell for uncertain priors base+direction*x. H is binary shape(m,n), 1<=m<=8, 2<=n<=24, n>rounds and row degree>=rounds+2. base and direction have length n, are finite real binary64 inputs interpreted exactly and have magnitudes<=16 and<=4. syndrome is binary length m. sample is an integer pair[numerator,positive_denominator]; bounds has two such rows and satisfies -1<=lower<sample<upper<=1. initial_iters and inner_iters are nonboolean integers in[1,6], rounds in[1,3] and width in[1,2]. Return four reduced rational pairs for cell_lower,cell_upper,intercept,slope, with positive denominators. Invalid domains or a nonconstant comparison expression vanishing at sample raise ValueError. Identically zero expressions return sign zero without narrowing. Do not mutate inputs."
    orchestrator: false
  - number: 9
    name: "09_cell_squared_integral"
    description: "Integrate a squared affine deviation over a rational interval. cell is a four-by-two integer table encoding lower endpoint a, upper endpoint b, intercept u and slope v as reduced or unreduced numerator/positive-denominator pairs. Require -1<=a<b<=1, |u|<=1e12 and |v|<=1e12. reference is a finite nonboolean real scalar with magnitude<=1e12 and is interpreted as its exact binary64 value. Return the native float integral of (u+v*x-reference)^2 on [a,b]. Compute this as (b-a)*(z_a^2+z_a*z_b+z_b^2)/3 using exact rational arithmetic before the final float conversion, where z_a=u+v*a-reference and z_b=u+v*b-reference. Invalid inputs raise ValueError."
    orchestrator: false
  - number: 10
    name: "10_uncertainty_response"
    description: "Compute the uniform mean squared terminal-score change for one uncertain prior. Build H with detector_matrix(), evaluate reference=terminal_score() on the base priors using the supplied schedule and partition the uncertainty interval into exact affine comparison cells using trace_score_cell(). Sum cell_squared_integral(cell,reference) and divide by interval width. Return(mean_squared_change,reference,negative_conditional_mean,positive_conditional_mean) as native floats. lower and upper are integer rational pairs with -1<=lower<0<upper<=1; uncertain_index is a nonboolean integer in [0,n-1]. The direction is one at uncertain_index and zero elsewhere. Use trace_score_cell's domain: m<=8,n<=24,|base|<=16, initial_iters and inner_iters in[1,6], rounds in[1,3], width in[1,2], row degree>=rounds+2. Construction and binary-syndrome limits also apply. Require at most 4096 trace cells; if a new cell cannot be found by testing l+(h-l)/d for d=2,...,257 on an uncovered interval(l,h), raise ValueError. A sample at a nonconstant equality is skipped. Subtract the exact returned rational cell from the uncovered interval, split integration at zero and continue until covered. Return only after full interval coverage. Upstream failures or cap exhaustion raise ValueError."
    orchestrator: true
