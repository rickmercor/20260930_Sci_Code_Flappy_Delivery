steps:
  - number: 1
    name: "01_boosted_turnaround_potential"
    description: "Compute the boosted turn-around potential for every node in a one-dimensional particle system. Position, acceleration and raw potential must be finite one-dimensional numeric arrays of equal length with at least three entries. Seed IDs must form a nonempty one-dimensional sequence of distinct native or NumPy integers in range. First set the reference position and potential to the particle-count means over the seed IDs and evaluate the displayed boosted expression for each seed. Choose the seed minimizing `$(boosted_value[id], id)$` as the reference center, then evaluate every node relative to that center. With `$q_i = position_i - position_c$` and `$mean_grad = -mean(acceleration[j] for j in seed_ids)$`, return ``raw_potential_i - raw_potential_c - mean_grad * q_i - 0.25 * hubble_rate**2 * omega_m * (scale_factor * q_i)**2 * turnaround_overdensity`` as native Python floats. Preserve a finite representable result even when a scalar power overflows before multiplication by zero or compensating factors. Invalid input or a boosted result outside the finite native-float range raises ValueError."
    orchestrator: false
  - number: 2
    name: "02_descend_to_minimum"
    description: "Follow strictly decreasing graph links from the lowest-potential seed to a local minimum. The potential input is a finite one-dimensional array of at least three pairwise-distinct real values. Adjacency rows are sorted unique native or NumPy integral IDs and encode a connected simple undirected graph. Seed IDs are a nonempty one-dimensional sequence of valid integral IDs. Select the seed minimizing ``(potential[id], id)``, repeatedly move to the lower-potential neighbor minimizing that pair and return the terminal node as a native Python int. Invalid input raises ValueError."
    orchestrator: false
  - number: 3
    name: "03_locate_host_well"
    description: "Grow a discrete potential well from a supplied minimum until its first contour reaches a deeper basin. Potential values must be finite, one-dimensional and pairwise distinct. Adjacency rows must be sorted unique native or NumPy integral IDs for a connected simple undirected graph. The start ID must be valid and the subgroup threshold must be a positive integral scalar. Initialize the internal set with the start and its surface with external neighbors. Always select the surface node minimizing ``(potential[id], id)``. Admit it ordinarily when every strictly lower neighbor is internal. Otherwise explore its external connected branch through nodes strictly below its contour. If that branch reaches a node strictly below the starting potential, add only the contour node and return it as the true saddle. If not, the false-saddle candidate is the contour node together with the external nodes reached strictly below its contour. Include the contour node when testing subgroup_min_size. Absorb this inclusive candidate, merge its exterior frontier into the surface and record its sorted IDs when its inclusive size meets the threshold. Return sorted well IDs, a native-int saddle ID and candidate branches in discovery order. Invalid input or surface exhaustion raises ValueError."
    orchestrator: false
  - number: 4
    name: "04_host_energy_mask"
    description: "Classify particles in a completed one-dimensional host well with the physical-frame energy rule. Position, canonical velocity and boosted potential are finite one-dimensional arrays of equal length with at least three entries. Well IDs are a nonempty one-dimensional sequence of distinct valid native or NumPy integers, and minimum and saddle IDs are valid integral members of the well. Recenter with `$q_i = position_i - position_minimum$` and `$u_i = canonical_velocity_i - mean(canonical_velocity[j] for j in well_ids)$`. The physical potential is ``Phi_i = boosted_potential_i + 0.25 * hubble_rate**2 * (omega_m * (1.0 + turnaround_overdensity) - 2.0 * omega_lambda) * (scale_factor * q_i)**2``. The energy is ``E_i = Phi_i + 0.5 * (scale_factor * hubble_rate * q_i + u_i / scale_factor)**2`` and the escape energy is `$Phi_saddle$`. Return a zero-one mask that marks only well members satisfying strict `$E_i < E_escape$`, plus all energies and physical potentials as native floats and the native-float escape energy. Preserve finite representable physical potentials and energies despite overflow in an intermediate power or product; invalid input or an unrepresentable returned potential or energy raises ValueError."
    orchestrator: false
  - number: 5
    name: "05_rebound_subgroup"
    description: "Re-analyse a recorded subgroup in its own accelerated frame and return its locally bound members and graph surface. All particle arrays are finite, one-dimensional and equally long with at least three entries. The graph is connected, simple and undirected with sorted unique native or NumPy integral adjacency IDs. Subgroup IDs are sorted, unique, integral and in range, and their count meets the positive integral candidate threshold. Build the local boosted potential using the entire subgroup as the seed, choose the subgroup member minimizing `$(local_potential[id], id)$`, run the full-graph well traversal with the unchanged threshold and apply the host-energy rule to that local well. Return the sorted subgroup IDs whose local mask is one, followed by the sorted union of all full-graph neighbors of those bound members that are not locally bound. Invalid input raises ValueError."
    orchestrator: false
  - number: 6
    name: "06_bulk_binding_mask"
    description: "Apply the all-or-nothing host binding decision to a locally rebound subgroup. Position and canonical velocity must be finite, nonempty one-dimensional arrays of equal length, host physical potential must be a finite one-dimensional array of that length and the host individual mask must contain exactly zero or one. Locally bound subgroup IDs and surface IDs are distinct one-dimensional native or NumPy integral sequences in range. Copy the input mask. An empty subgroup is a no-op. Otherwise let `$H$` be IDs marked one in the original mask, `$v_host = mean(v_i for i in H)$`, `$q_mean = mean(position_i - position_minimum for i in S)$`, `$u_mean = mean(canonical_velocity_i for i in S) - v_host$` and `$v_bulk = scale_factor * hubble_rate * q_mean + u_mean / scale_factor$`. Form ``E_proxy = max(host_physical_potential[j] for j on the local surface) + 0.5 * v_bulk**2``. Set every locally bound subgroup ID to zero only when strict `$E_proxy > host_escape$`; equality remains bound. Return native Python ints. Preserve a finite representable proxy despite overflow in an intermediate power or product. Invalid input or a proxy outside the finite native-float range raises ValueError."
    orchestrator: false
  - number: 7
    name: "07_bound_mass_fraction"
    description: "Compose accelerated-frame topology, individual binding, subgroup rebound and bulk rejection into one bound mass fraction. All particle arrays are finite one-dimensional sequences of equal length with at least three entries. The supplied adjacency is a connected simple undirected graph with sorted unique native or NumPy integral IDs, seed IDs are nonempty distinct valid integral IDs and the subgroup size threshold is a positive integral scalar. Build the host boosted potential, descend from the seeds, locate the completed well and true saddle, apply strict individual binding, then process recorded candidate branches in discovery order by local rebinding and all-or-nothing host bulk tests. With unit particle masses, return the number of final mask entries equal to one divided by the completed well size before energetic unbinding. Invalid input or an upstream potential or energy outside the finite native-float range raises ValueError. Representable upstream results remain valid even when a naive intermediate power would overflow."
    orchestrator: true
