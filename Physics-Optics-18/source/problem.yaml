  - number: 5
    name: "qssf_williamson_decomposition"
    description: "Construct a real canonical coordinate map that diagonalizes the reduced covariance. Retain every symplectic mode, including degenerate modes; accept equivalent choices of canonical basis."
    orchestrator: false
  - number: 6
    name: "qssf_williamson_entropy"
    description: "Validate the actual covariance's physicality and the supplied canonical coordinates at their respective tolerances, then evaluate entropy, purity and effective occupied mode number."
    orchestrator: false
  - number: 7
    name: "qssf_full_simulation"
    description: "Compose all six preceding functions to propagate the coupled state, validate its commutators and Williamson coordinates, and return the selected spectral-band diagnostic."
