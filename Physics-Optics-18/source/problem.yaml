  - number: 1
    name: "qssf_dispersion_propagator"
    description: "Evaluate the dispersion symbol and its linear half-step propagator on the supplied angular-frequency grid, and find the unique real center prescribed by the dispersion\u2013nonlinear-offset window rule. Return all three quantities as the documented numerical array."
