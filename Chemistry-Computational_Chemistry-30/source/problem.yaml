problem_id: "Chemistry-Computational_Chemistry-30"
subject: "chemistry"
subject_area: "Computational Chemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1038/s41377-025-02063-x"
dependencies: ""
steps:
  - number: 1
    name: "01_source_inputs.py"
    description: "Retrieve the comprehensive model and nominal parameters from Supplementary Note S2, including the estimated IC rate and the lifetime beside Fig. S26. Retrieve the ROKS T\u2082 and T\u2081 energies from Table S9. Return the values in consistent SI units and the triplet gap in eV."
    orchestrator: false
  - number: 2
    name: "02_population_generator.py"
    description: "Construct and return the linear population generator in the order S\u2081, T\u2082, T\u2081, with z=\u03b1 exp(\u2212\u0394/\u03b8) and d=\u03ba+k_nr,T1. Include both T\u2081 escape pathways. Its column sums must reproduce the total-population balance (S+U+L)\u2032=\u2212S/\u03c4_S1\u2212dL."
    orchestrator: false
  - number: 3
    name: "03_exact_tail_constraint.py"
    description: "Derive the relation between d and z required by the target slow decay rate \u03bb. Eliminate the singlet and upper-triplet amplitudes at the target eigenvalue and evaluate the resulting coefficients."
    orchestrator: false
  - number: 4
    name: "04_admissible_parameter_set.py"
    description: "Determine the entire set of nonnegative \u0394, \u03b1 and nonnegative triplet nonradiative loss consistent with the lifetime. Give both the necessary inequality and a constructive expression for d."
    orchestrator: false
  - number: 5
    name: "05_slow_mode_certificate.py"
    description: "Establish whether the dominant kinetic eigenmode is observable in T\u2081 after S\u2081-only excitation. Implement slow_mode to return its decay rate and spectral-projection amplitude, including the zero-back-transfer and disconnected limits. The complete scientific reasoning must justify why this mode is the asymptotic physical tail."
    orchestrator: false
  - number: 6
    name: "06_roks_prefactor_bound.py"
    description: "Implement kinetic_bounds to return the maximal admissible Boltzmann-prefactor product, the global minimum nonnegative gap for \u03b1=1, and the global maximum \u03b1 at a supplied gap. Apply the result to the retrieved ROKS gap, identify the nonradiative-loss boundary, and assess the conditional validity of \u03b1=1."
    orchestrator: false
  - number: 7
    name: "07_identifiability_experiment.py"
    description: "Explain why one-temperature trajectories cannot separate the energy gap and common multiplier, then implement thermal_identification for the proposed additional measurement: recover the gap and multiplier from two calibrated kinetic factors at distinct temperatures, assuming both parameters remain constant. Reject zero factors, which carry no finite identifiable gap under this protocol."
    orchestrator: false
  - number: 8
    name: "08_final_orchestrator.py"
    description: "Combine source retrieval, exact tail constraint, physical bounds and computed gap to report the globally maximal dimensionless \u03b1. Include the admissible family, \u03b1=1 gap bound, mode-validity argument and conditional interpretation."
    orchestrator: true
