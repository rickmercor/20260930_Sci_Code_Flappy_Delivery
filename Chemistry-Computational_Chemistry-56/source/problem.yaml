steps:
  - number: 1
    name: "01_drude_lorentz_exponents"
    description: "Expand the correlation function of an overdamped (Drude-Lorentz) harmonic bath into decaying exponentials."
    orchestrator: false
  - number: 2
    name: "02_heom_readout_operator"
    description: "Propagate a site-population readout of a donor-acceptor dimer backwards through its exact reduced dynamics, giving the time-dependent operator whose expectation value in any initial state is the population at a later time."
    orchestrator: false
  - number: 3
    name: "03_ensemble_readout_operator"
    description: "Average the Heisenberg-picture site-population readout over an ensemble of donor-acceptor dimers with static site-energy disorder."
    orchestrator: false
  - number: 4
    name: "04_coherence_diagnostics"
    description: "Turn a Heisenberg-picture population readout and its rate of change into four coherence diagnostics for the preparation of a donor-acceptor pair."
    orchestrator: false
  - number: 5
    name: "05_post_overlap_supremum"
    description: "Find the largest coherence impact on the ensemble acceptor population inside a window of pump-probe delays, and the delay at which it occurs."
    orchestrator: false
  - number: 6
    name: "06_critical_reorganization_energy"
    description: "Find the bath reorganization energy at which the largest coherence impact on the ensemble acceptor population inside a delay window falls to a prescribed level."
    orchestrator: false
  - number: 7
    name: "07_coherence_relevance_report"
    description: "Report where site coherence stops being able to change the measured acceptor population of an inhomogeneous donor-acceptor ensemble by a set amount after the pulse overlap, together with the diagnostics at that point (orchestrator)."
    orchestrator: true
