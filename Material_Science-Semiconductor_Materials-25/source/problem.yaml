problem_id: "Material_Science-Semiconductor_Materials-25"
subject: "materials"
subject_area: "Semiconductor Materials"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "https://doi.org/10.1016/j.jcp.2026.115344"
dependencies: ""
steps:
  - number: 1
    name: "01_bernoulli"
    description: "Evaluate the Bernoulli function B(t) = t/(e^t - 1) element-wise, accurately for every real t."
    orchestrator: false
  - number: 2
    name: "02_contact_densities"
    description: "Compute the charge-neutral thermal-equilibrium potential and carrier densities of silicon for a given net doping, used at Ohmic contacts and as the Newton initial guess."
    orchestrator: false
  - number: 3
    name: "03_build_mesh"
    description: "Build the distorted, non-Delaunay triangular mesh of the unit square (lengths in micrometres) on which the device is solved."
    orchestrator: false
  - number: 4
    name: "04_ddfv_geometry"
    description: "Build the discrete duality finite volume (DDFV) primal, dual and diamond meshes from a triangulation, with the geometric coefficients of every diamond."
    orchestrator: false
  - number: 5
    name: "05_ddfv_ha_fluxes"
    description: "Compute the DDFV-HA electrostatic, electron and hole fluxes across the primal and dual edge of every diamond."
    orchestrator: false
  - number: 6
    name: "06_assemble_system"
    description: "Assemble the residual and analytic sparse Jacobian of the coupled DDFV-HA Poisson and carrier-continuity equations, with Dirichlet nodes held fixed."
    orchestrator: false
  - number: 7
    name: "07_solve_drift_diffusion"
    description: "Solve the stationary drift-diffusion problem for the symmetric silicon PN junction on the distorted mesh with Newton's method and voltage ramping."
    orchestrator: false
  - number: 8
    name: "08_terminal_current"
    description: "Compute the terminal current density through the top Ohmic contact from the primal DDFV-HA electron and hole fluxes."
    orchestrator: false
  - number: 9
    name: "09_junction_electrostatics"
    description: "Extract the depletion width and the peak electric field of the junction from the equilibrium vertex solution."
    orchestrator: false
  - number: 10
    name: "10_textbook_predictions"
    description: "Compute the depletion-approximation and short-diode-law predictions for the symmetric silicon junction from its material parameters."
    orchestrator: false
  - number: 11
    name: "11_simulated_forward_current"
    description: "Final orchestrator: run the doping study of the silicon junction and return the simulated forward current density at the lowest doping level."
    orchestrator: true
