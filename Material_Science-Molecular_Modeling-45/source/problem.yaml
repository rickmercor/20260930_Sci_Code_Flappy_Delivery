problem_id: "Material_Science-Molecular_Modeling-45"
subject: "materials"
subject_area: "Molecular Modeling"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2511.21357"
dependencies: ""
steps:
  - number: 1
    name: "nanoreactor_parameters"
    description: "Map the physical description of a yolk-shell nanoreactor onto the dimensionless parameters of the capture problem. The catalytic core is a sphere of radius R (nm) held concentrically inside the cavity of radius R0 > R (nm) of a thin permeable shell; the reactant B is held at its bulk concentration c_B outside the shell and enters the cavity through the shell with a permeability P (nm/us): the entry flux density is P (c_B - c) with c the concentration just inside the shell, P = inf meaning that the bulk concentration is maintained on the cavity wall. Inside the cavity the reactant diffuses through the corona grafted on the core with a position-dependent diffusivity D(r) = D (r / R)^p, where D (nm^2/us) is the diffusivity at the core surface and p >= 0 the hindrance exponent (p = 0 is a free cavity). The active site is an axisymmetric spherical cap covering the fraction site_fraction of the core surface area, the rest of the core being inert; on the site the reactant is consumed with a surface reactivity kappa (nm/us), kappa = inf denoting a perfect sink. Return the thickness ratio eps = R / R0, the relative shell thickness h = 1 - eps, the polar half-angle theta0 of the cap in radians (from its surface fraction), the Damkohler number of the site Da = kappa R / D, the shell Biot number Bi = P R / D, the hindrance exponent p, the Smoluchowski rate constant k_S = 4 pi R D of an isotropic perfect-sink sphere in an unbounded free medium of diffusivity D (nm^3/us), the rate correction factor J_shell of the confined isotropic perfect sink in the corona behind the permeable shell (the exact solution of the spherically symmetric problem; Berg's factor 1 / (1 - eps) when P = inf and p = 0), and the rate correction factor J_iso of the confined isotropic core whose whole surface reacts with the finite reactivity kappa in the same corona behind the same shell (equal to J_shell when kappa = inf); derive both closed forms. The rate correction factor J is defined throughout by k = k_S J, with k the total steady flux into the core per unit bulk concentration. Raise ValueError if R is not positive, if R0 is not larger than R, if site_fraction is not in (0, 1], if D, kappa or P is not positive, or if p is negative or not finite."
    orchestrator: false
  - number: 2
    name: "dual_series_coefficients"
    description: "Derive the radial exponents and the coefficient sequences of the canonical dual series relations of the perfect-sink problem in a hindered corona behind a permeable shell. In the dimensionless coordinate xi = r / R the trapping probability u = 1 - c / c_B satisfies the steady diffusion equation with the diffusivity D(r) = D (r / R)^p in the cavity 1 < xi < 1 / eps, the permeable-wall condition on the cavity wall xi = 1 / eps (the dimensionless form of the entry-flux balance with the diffusivity at the wall; u = 0 when Bi = inf), equals one on the active cap 0 <= theta < theta0 of the unit sphere and has zero normal derivative on the inert part theta0 < theta <= pi. Separate variables: the axisymmetric solutions are xi^s P_l(cos theta) with two exponents per l, s_plus(l) >= 0 and s_minus(l) < 0, that follow from the radial equation (derive them; they reduce to l and -(l + 1) for p = 0). Expand u = sum over l of (A_l^+ xi^s_plus + A_l xi^s_minus) P_l(cos theta) and eliminate the interior moments with the wall condition: A_l^+ = -eps_l A_l with a wall coupling coefficient eps_l that depends on eps, Bi, p and l and reduces to eps^(2l+1) for p = 0 and Bi = inf (derive it). Write the two boundary relations on the unit sphere in terms of the exterior moments A_l and introduce the canonical unknowns X_l through (l + 1/2) X_l = (-s_minus + eps_l s_plus) A_l, so that the inert-part relation reads sum over l of (l + 1/2) X_l P_l(cos theta) = 0 and the cap relation reads sum over l of (1 - q_l) X_l P_l(cos theta) = 1, and write A_l = (1 - w_l) X_l. Return s_plus, s_minus, eps_l, w_l and q_l for l = 0..order; eps = 0 is the unbounded limit, in which eps_l vanishes whatever Bi. Raise ValueError if order is not a non-negative integer, if eps is not in [0, 1), if biot is not positive (inf allowed), or if hindrance is negative or not finite."
    orchestrator: false
  - number: 3
    name: "minkov_matrix"
    description: "Reduce the canonical dual series relations to a resolving infinite system of linear algebraic equations by Minkov's method and return its kernel. Write the cap relation in the self-consistent form sum over l of X_l P_l(cos theta) = 1 + sum over m of q_m X_m P_m(cos theta) on 0 <= theta < theta0, keep the inert-part relation sum over l of (l + 1/2) X_l P_l(cos theta) = 0 on theta0 < theta <= pi, and apply to this auxiliary pair the exact solution of dual series relations of that type (the Abel-type integral representation whose inner integral of P_m(cos tau) sin tau / sqrt(cos tau - cos t) has a closed trigonometric form). The result is the system X_l - sum over m of q_m Q_lm(theta0) X_m = Q_l0(theta0) for l = 0, 1, 2, ..., in which the kernel Q_lm(theta0) depends only on the cap half-angle. Return the matrix Q_lm for l, m = 0..order, evaluated in closed form. Raise ValueError if order is not a non-negative integer or if theta0 is not in (0, pi]."
    orchestrator: false
  - number: 4
    name: "perfect_sink_solution"
    description: "Solve the resolving system of the perfect-sink problem by the truncation (reduction) method. Given the coefficient sequence q_l (l = 0..order, the last row of the coefficient step) and the Minkov kernel Q_lm of the same order, keep the unknowns X_0..X_order and the first order + 1 equations, X_l - sum over m <= order of q_m Q_lm X_m = Q_l0, and solve the resulting dense linear system by direct elimination (no iteration). Return the truncated solution vector. The truncation order is fixed by the length of q and must be used exactly as given. Raise ValueError if q and Q are not finite arrays of consistent shape (order + 1,) and (order + 1, order + 1)."
    orchestrator: false
  - number: 5
    name: "rate_correction_summary"
    description: "Assemble the rate correction factor of the perfect-sink site and its diagnostics at the given truncation order, from the coefficient sequences, the kernel and the truncated solution of the previous steps. The total capture flux through the unit sphere follows from the canonical unknowns as J = X_0 / 2. Also return: the zeroth-order analytical approximation J(0), one half of the zeroth iterate of the leading equation of the resolving system (the inhomogeneous term Q_00); the first-order approximation J(1), one half of the first iterate of the leading equation (Q_00 divided by 1 - q_0 Q_00), which is the source's first approximation for a free cavity behind a perfectly permeable shell; the relative percentage error delta1 = 100 (J - J(1)) / J; the sup-norm of the truncated system matrix M_lm = q_m Q_lm, that is the largest row sum of absolute values over l, m = 0..order; the effective steric factor f(theta0) = J(theta0; eps = 0) of the same site in an unbounded corona with the same hindrance exponent, from the same truncated system at eps = 0; and the coupling factor C = J(theta0; eps, Bi, p) / (f(theta0) J_shell), with J_shell the rate correction factor of the confined isotropic perfect sink in the same corona behind the same shell (Berg's 1 / (1 - eps) when Bi = inf and p = 0), which is one if anisotropy and confinement acted multiplicatively. Raise ValueError if theta0 is not in (0, pi], eps not in [0, 1), biot not positive or hindrance negative or not finite."
    orchestrator: false
  - number: 6
    name: "local_fields"
    description: "Reconstruct the trapping probability field, the cumulative capture flux and the distribution of the entry flux over the shell from a canonical solution vector. Given X_l (l = 0..n) and the (5, n + 1) coefficient array [s_plus; s_minus; eps_l; w_l; q_l] of the same order, recover the exterior moments and the interior moments and evaluate the field u(xi, theta) in the cavity at each probe point (xi, theta) of the (m, 2) array points; the field must satisfy the permeable-wall condition on the cavity wall by construction. Then evaluate the fraction F(theta_c) of the total capture flux that enters the core through the polar sub-cap 0 <= theta <= theta_c: the flux density into the core at xi = 1 is -du/dxi, the fraction is the integral of -du/dxi sin theta over 0..theta_c divided by the same integral over 0..pi, both taken exactly of the truncated series (the integrals of P_l(cos theta) sin theta over a polar cap have closed forms in P_(l-1) and P_(l+1) at cos theta_c; an exact Gauss-Legendre quadrature of the truncated series is equivalent); F(pi) = 1. Finally evaluate the fraction G of the total entry flux through the cavity wall xi = 1 / eps that enters through the hemisphere facing the site, 0 <= theta <= pi / 2, from the radial derivative of the same truncated field on the wall (the diffusivity at the wall is the same factor for every angle and cancels), again with exact integrals; G = 1/2 for an isotropic core, and G is undefined (nan) in the unbounded limit eps = 0. The same reconstruction applies to the solution vector of the partially reactive site. Raise ValueError if the coefficient array does not match X, if eps is not in [0, 1), if points is not an (m, 2) array of points inside the closed shell 1 <= xi <= 1 / eps, 0 <= theta <= pi, or if theta_c is not in (0, pi]."
    orchestrator: false
  - number: 7
    name: "partially_reactive_solution"
    description: "Solve the capture problem of a partially reactive site from the coefficient sequence q_l, the cap half-angle and the Damkohler number. On the active cap the perfect-sink condition u = 1 is replaced by the radiation condition du/dxi - Da u = -Da at xi = 1 (the dimensionless form of D dc/dr = kappa c with Da = kappa R / D), the inert part stays reflecting and the wall condition is unchanged. Keep the same expansion, the same exterior moments A_l = (1 - w_l) X_l and the same canonical unknowns X_l as in the perfect-sink problem, so that the surface value is u(1, theta) = sum over l of (1 - q_l) X_l P_l(cos theta) and the flux density into the core is -du/dxi(1, theta) = sum over l of (l + 1/2) X_l P_l(cos theta). Write the two boundary conditions on the core as one relation on the whole unit sphere between the flux density and the surface value, in which the cap is selected by its indicator function, reduce it by Galerkin projection onto the Legendre polynomials P_0..P_order with the L2 inner product on the sphere, evaluating the resulting integrals over the cap exactly (they are integrals of polynomials; a Gauss-Legendre rule with at least order + 1 nodes on the cap interval is exact), and solve the dense (order + 1)-dimensional system by direct elimination, the order being fixed by the length of q. Do not reduce the radiation problem by Minkov's method: the direct substitution of the radiation coefficient into that reduction is treated separately as a diagnostic. Raise ValueError if q is not a finite array, if theta0 is not in (0, pi], or if damkohler is not a finite positive number."
    orchestrator: false
  - number: 8
    name: "radiation_islae_regularity"
    description: "Diagnose why the radiation problem is not reduced by Minkov's method, from the coefficient sequence q_l, the Minkov kernel Q_lm of the same order and the Damkohler number. Insert the radiation condition directly into the canonical dual series relations: the cap relation then keeps the canonical form sum over l of (1 - q_l^Da) X_l P_l(cos theta) = 1 with a modified coefficient q_l^Da that follows from the surface value and the flux density of the previous step (derive it), while the inert-part relation is unchanged, so that Minkov's reduction applies formally with q_l replaced by q_l^Da. Return the sup-norm (largest row sum of absolute values) of the truncated matrix M_lm = q_m^Da Q_lm, l, m = 0..order, and the value of J = X_0 / 2 that the truncated system X_l - sum over m of M_lm X_m = Q_l0 gives when solved by direct elimination at this order (the order is fixed by the length of q). Raise ValueError if q and Q are not of consistent shape or if damkohler is not a finite positive number."
    orchestrator: false
  - number: 9
    name: "series_resistance_deviation"
    description: "Quantify how far the textbook series-resistance rule is from the exact rate of a partially reactive site. The reaction-controlled rate of the site is the flux kappa c_B through the area of the cap, which in units of k_S is J_react = Da (1 - cos theta0) / 2. The series-resistance (Collins-Kimball) estimate combines the diffusion-controlled rate of the same site behind the same shell, J_sink, with J_react as resistances in series, 1 / J_CK = 1 / J_sink + 1 / J_react; for an isotropic sphere in unbounded space this rule is exact. Return J_react, J_CK and the signed percentage deviation delta_CK = 100 (J_CK - J_exact) / J_exact of the estimate from the exact rate J_exact of the projected solution. Raise ValueError if j_sink or j_exact is not positive, if theta0 is not in (0, pi], or if damkohler is not a finite positive number."
    orchestrator: false
  - number: 10
    name: "nanoreactor_audit"
    description: "Run the complete chain for every nanoreactor design in design_table, a list of rows (R, R0, site_fraction, D, kappa, P, p) in nm, nm, -, nm^2/us, nm/us, nm/us and - with finite kappa (P may be inf), at the given truncation order, and return one table. For each design map the parameters, derive the coefficient sequences, build the Minkov kernel, solve the truncated perfect-sink system from q and the kernel and assemble its summary, reconstruct the perfect-sink field at the two mid-shell probe points xi_mid = (1 + 1 / eps) / 2 on the site axis (theta = 0) and at the inert pole (theta = pi) together with the fraction of the capture entering through the inner half-angle sub-cap 0 <= theta <= theta0 / 2 and the fraction of the shell entry flux through the hemisphere facing the site, solve the projected radiation system from q, theta0 and Da, evaluate the naive-reduction diagnostic from q, the kernel and Da, the series-resistance deviation and, from the radiation solution, the same half-angle capture fraction. Each design row holds the 29 columns [eps, h, theta0, Da, Bi, p, k_S, J_shell, J_iso, J_sink, J(0), J(1), delta1, sup-norm of M, f(theta0), C, F_half of the sink, u at the axis probe, u at the pole probe, G of the sink, J_Da of the projected system, sup-norm of the naive matrix, J of the naive system, J_react, J_CK, delta_CK, k = k_S J_Da in nm^3/us, F_half of the radiation solution, J_Da / J_sink]. Row 0 is the head row [J_Da / J_sink of the first design, number of designs, order, sum of delta_CK over the designs, zeros]. Raise ValueError if design_table is empty or a row does not have seven entries, or if order is not a positive integer."
    orchestrator: true
