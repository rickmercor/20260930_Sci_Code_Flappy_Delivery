problem_id: "Mathematics-Computational_Mechanics-45"
subject: "mathematics"
subject_area: "Computational Mechanics"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.48550/arXiv.2606.03816"
dependencies: ""
steps:
  - number: 1
    name: "01_curvature_spline_values"
    description: "Evaluate one curvature-based spline constitutive function and its first two\n\nderivatives at a set of arguments, given the interpolation domain and the\n\nunconstrained free variables that parameterise it."
    orchestrator: false
  - number: 2
    name: "02_uniaxial_kinematics"
    description: "Return the trial elastic state of one increment of incompressible homogeneous\n\nuniaxial loading, together with the squared principal stretches that map between\n\nthe elastic strain measure and the internal variable."
    orchestrator: false
  - number: 3
    name: "03_isochoric_invariants"
    description: "Return the two isochoric invariants of a symmetric positive definite strain\n\nmeasure from its three principal values, in the polyconvex form used by\n\nspline-based constitutive functions."
    orchestrator: false
  - number: 4
    name: "04_branch_kirchhoff_stress"
    description: "Return the deviatoric non-equilibrium Kirchhoff stress of one Maxwell branch in\n\nits principal basis, together with the scalar stress invariant that the dual\n\ndissipation potential depends on."
    orchestrator: false
  - number: 5
    name: "05_viscous_flow_rate"
    description: "Return the principal components of the viscous deformation-type rate of one\n\nMaxwell branch from its deviatoric non-equilibrium Kirchhoff stress and the dual\n\ndissipation potential."
    orchestrator: false
  - number: 6
    name: "06_local_branch_update"
    description: "Advance one Maxwell branch over a single time increment with the implicit\n\nexponential mapping algorithm and return the converged principal values of the\n\nelastic left Cauchy-Green tensor."
    orchestrator: false
  - number: 7
    name: "07_adapt_domain_endpoint"
    description: "Return the updated upper endpoint of one spline interpolation domain from the\n\ninvariants the forward solve sampled, using a smooth upper-tail statistic and a\n\nrelaxed update."
    orchestrator: false
  - number: 8
    name: "08_project_spline_parameters"
    description: "Transfer one curvature-based spline onto a moved interpolation domain and return\n\nthe free variables of the transferred representation."
    orchestrator: false
  - number: 9
    name: "09_run_full_pipeline"
    description: "Run the block-alternating calibration loop for the non-equilibrium branch and\n\nreturn the adapted upper endpoint of the dissipation-potential interpolation\n\ndomain."
    orchestrator: true
