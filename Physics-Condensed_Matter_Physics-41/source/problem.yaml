steps:
  - number: 1
    name: "compute_reference_frequency"
    description: "Compute the local harmonic reference frequency from a positive particle mass and positive curvature, returning one native Python float."
    orchestrator: false
  - number: 2
    name: "compute_bridge_statistics"
    description: "Compute the harmonic and free fixed-endpoint Gaussian bridge moments for one bead between two fixed neighboring beads."
    orchestrator: false
  - number: 3
    name: "select_proposal_parameters"
    description: "Select the Gaussian proposal mean and variance from the current bead\u2019s membership in the closed harmonic domain."
    orchestrator: false
  - number: 4
    name: "generate_trial_position"
    description: "Instantiate one deterministic Gaussian trial position from a selected mean, variance, and supplied standard-normal deviate."
    orchestrator: false
  - number: 5
    name: "compute_hastings_factor"
    description: "Compute the generalized Hastings correction generated by state-dependent switching between harmonic and free bridge proposals."
    orchestrator: false
  - number: 6
    name: "compute_mixed_acceptance"
    description: "Compute the mixed-proposal Metropolis acceptance probability using the proposal correction and the anharmonic residual potential."
    orchestrator: false
  - number: 7
    name: "compute_harmonic_energy"
    description: "Evaluate the finite-bead harmonic-reference total-energy estimator on a periodic one-dimensional worldline."
    orchestrator: false
  - number: 8
    name: "run_mixed_pimc_sweep"
