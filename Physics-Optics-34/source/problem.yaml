steps:
  - number: 1
    name: "01_material_operator"
    description: "Assemble the relative constitutive operator P=[[epsilon,xi],[xi^dagger,mu]]+i eta I_6 in component order (E1,E2,E3,H1,H2,H3) for inputs and (D1,D2,D3,B1,B2,B3) for outputs. All three tensors are finite complex 3 by 3 arrays with entry magnitudes at most 1e6. eta is a finite real scalar in [0,1]. Return the complex 6 by 6 matrix; invalid inputs raise ValueError. The dagger denotes conjugate transpose, not elementwise conjugation."
    orchestrator: false
  - number: 2
    name: "02_indicator_matrix"
    description: "Construct the exact Fourier multiplication matrix of a periodic interval with width fraction f and center c. Retain orders -M through M in increasing order and define T[p,q]=f sinc((p-q)f) exp(-2 pi i (p-q)c), where sinc(x)=sin(pi x)/(pi x) with sinc(0)=1. M is an integer in [0,4], f is a finite real scalar in [0,1] and c is a finite real scalar in [-1,1]. Boolean M is invalid. Return the complex Hermitian matrix; invalid inputs raise ValueError."
    orchestrator: false
  - number: 3
    name: "03_directional_factorization"
    description: "Compute one directional interface-continuous Fourier representation of a six-component electric-magnetic operator. Each local operator has shape (6s,6s), ordered component-major with s old harmonics per component; columns are (E1,E2,E3,H1,H2,H3) and rows are (D1,D2,D3,B1,B2,B3). Group components axis and axis+3 as a and the other components in increasing order as b. For each local P write A=Paa, B=Pab, C=Pba and D=Pbb, then Q=A^{-1}, R=QB, L=CQ and W=D-CQB. For the supplied k by k indicator T, lift each block pair by H(U)=kron(T,U_in-U_out)+kron(I_k,U_out). Reconstruct V=H(Q)^{-1}, Paa=V, Pab=V H(R), Pba=H(L)V and Pbb=H(W)+H(L)V H(R). Each block initially has order (new harmonic, grouped component, old harmonic); undo grouping and return (original component, new harmonic, old harmonic). Products are not conjugated. Accept finite entries of magnitude at most 1e6, 1<=s<=25, 1<=k<=9 and 6sk<=150. axis is an integer in [0,2], not boolean. T must be Hermitian to maximum-entry tolerance 1e-10 and its Hermitian part's eigenvalues must lie in [-1e-10,1+1e-10]. Required inverses must exist and all computed arrays must be finite. Raise ValueError otherwise; do not impose a condition-number cutoff on invertible matrices. The mathematical construction, not a particular floating-point evaluation order, defines the output. Return each entry to relative tolerance 1e-7 plus absolute tolerance 1e-9 for the supplied binary64 inputs, including normal pivots of order 1e-20 with nearly common off-diagonal blocks whose Schur terms cancel. Use a cancellation-resistant reformulation or adequate working precision; these valid cases must not be refused merely for conditioning."
    orchestrator: false
  - number: 4
    name: "04_rectangle_operator"
    description: "Compose the directional constitutive Fourier construction for a rectangular inclusion. First apply directional_factorization to inclusion P1 and host P0 with the x1 indicator and axis 0. Outside the x2 interval the first-stage host is kron(P0,I_k1), with k1 the x1 indicator size. Apply directional_factorization to these first-stage operators with the x2 indicator and axis 1. Return the final matrix in (component,n,m) order, where m is the old x1 harmonic and n the new x2 harmonic. Inputs P1 and P0 are finite complex 6 by 6 matrices with magnitudes at most 1e6; both indicator matrices satisfy the directional step's Hermitian/contractive tolerance 1e-10, have odd sizes from 1 to 9 and their size product is at most 25. Required inverses must exist and results must be finite. Invalid inputs raise ValueError."
    orchestrator: false
  - number: 5
    name: "05_maxwell_operator"
    description: "Reduce the constitutive Fourier operator to the dimensionless longitudinal Maxwell matrix. Input P has shape (6N,6N) in (component,n,m) order, with N=(2mx+1)(2my+1), m fast, mx and my integers in [0,4] and N<=25. Its entry magnitudes are at most 1e6. The positive real period ratio a2/a1 is in [0.25,4], positive k0*a1 is in [0.25,20] and real k1/k0 and k2/k0 lie in [-2,2]. Define X=diag(k1/k0+2 pi m/(k0*a1)), Y=diag(k2/k0+2 pi n/((a2/a1)(k0*a1))) and tangential order t=(E1,E2,H1,H2). Normal order is z=(E3,H3). Let C_z=[[0,0,Y,-X],[-Y,X,0,0]] and Z=Pzz^{-1}(C_z-Pzt); its row halves are Z_E and Z_H. Let U=Ptt+Ptz Z and split its rows as U_D1,U_D2,U_B1,U_B2. Return rows [U_B2+X Z_E;-U_B1+Y Z_E;-U_D2+X Z_H;U_D1+Y Z_H]. No condition-number cutoff applies. All inputs and intermediate/results must be finite; a singular Pzz or invalid input raises ValueError."
    orchestrator: false
  - number: 6
    name: "06_spectral_abscissa"
    description: "Return the maximum real part of all eigenvalues of a finite complex square matrix. The input dimension is 1 through 100 and every entry magnitude is at most 1e6. No filtering by imaginary part, eigenvector norm or propagation direction is performed. Return a native float without decimal rounding. Invalid shape, nonfinite input, eigensolver failure or nonfinite eigenvalues raises ValueError."
    orchestrator: false
  - number: 7
    name: "07_run_pipeline"
    description: "Compute the finite-harmonic propagation target for the fixed passive rectangular optical layer. Assemble inclusion and host matrices with material_operator, form exact interval indicators with indicator_matrix, compose x1-then-x2 rectangle_operator, eliminate longitudinal fields with maxwell_operator and return spectral_abscissa. Use epsilon1=[[9,1.3,0.7],[1.3,7,-0.8],[0.7,-0.8,6]], mu1=[[1.7,0.18,-0.12],[0.18,1.3,0.15],[-0.12,0.15,1.5]], xi1=[[1.2i,0.55+0.25i,0.2-0.3i],[-0.25+0.4i,0.9i,0.45+0.15i],[0.35+0.1i,-0.3+0.2i,1.1i]], epsilon0=[[2.4,0.15,-0.05],[0.15,2.1,0.12],[-0.05,0.12,2.7]], mu0=[[1.1,0.04,0],[0.04,1.2,-0.03],[0,-0.03,1.05]] and xi0=[[0.15i,0.08,0.03i],[-0.04,0.2i,0.06],[0.02i,-0.05,0.1i]]. Both materials add loss 0.025i times identity and use xi conjugate transpose in the lower-left block. Set a2/a1=1.3, k0*a1=3.3, k1/k0=0.21, k2/k0=-0.17, interval centers 0.11 and -0.08. Inputs mx,my are nonboolean integers in [0,4] with (2mx+1)(2my+1)<=25; fractions fx,fy are real in [0,1]. Return the unrounded scalar. Invalid input or upstream failure raises ValueError."
    orchestrator: true
