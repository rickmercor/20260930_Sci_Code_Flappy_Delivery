dependencies: ""
steps:
  - number: 1
    name: "build_retained_kernel"
    description: "Construct the symmetric retained-magnitude kernel and its row-normalized Hamiltonian proposal from a finite real symmetric Hamiltonian, using an inclusive off-diagonal magnitude cutoff and requiring every state to retain at least one reversible neighbor."
    orchestrator: false
  - number: 2
    name: "compute_ir_log_fields"
    description: "Compute the auxiliary log mass, the exactly marginalized evaluation log mass, and the first two exponent-response fields of the retained stay-or-displace mixture without forming exponentially large or small masses."
    orchestrator: false
  - number: 3
    name: "run_log_hamiltonian_chain"
    description: "Propagate a deterministic Hamiltonian-guided Metropolis-Hastings chain in the log domain, recording each pre-state, categorical trial, acceptance probability, strict acceptance flag, and immediately mutated post-state."
    orchestrator: false
  - number: 4
    name: "select_evaluation_histogram"
    description: "Select one estimator configuration from every pre-transition chain state by either staying or reusing that move's Hamiltonian trial, then combine the realized configurations into an ascending unique-state histogram."
    orchestrator: false
  - number: 5
    name: "compute_adaptive_reweighting"
    description: "Compute complete-Hamiltonian local energies, stable grouped Born-to-evaluation weights, and the damped projected update of the auxiliary amplitude exponent from residual-weighted evaluation-mass derivatives."
    orchestrator: false
  - number: 6
    name: "solve_predictive_sample_space_sr"
    description: "Solve the shifted predictive stochastic-reconfiguration system in sampled-configuration space, adding the projection of the preceding unscaled direction before any learning-rate scaling and returning the new unscaled parameter direction."
    orchestrator: false
  - number: 7
    name: "run_two_block_ir_sr_update"
    description: "Run two sequential importance-reweighted sampling-and-optimization blocks by composing every preceding public operation, initializing block 1 with a zero preceding unscaled SR direction, carrying all mutated state into block 2, and returning the first final parameter."
    orchestrator: true
