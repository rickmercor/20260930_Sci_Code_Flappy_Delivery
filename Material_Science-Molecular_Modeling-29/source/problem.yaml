problem_id: "Material_Science-Molecular_Modeling-29"
subject: "materials"
subject_area: "Molecular Modeling"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "10.1063/5.0295478"
dependencies: ""
steps:
  - number: 1
    name: " 01_compute_monomer_reference_geometry"
    description: "Minimize the intramolecular potential of a single isolated water monomer and return the resulting oxygen-centred Cartesian geometry in the Jacobi body frame of Paper I."
    orchestrator: false
  - number: 2
    name: "02_compute_potential_energy"
    description: "Evaluate the all-atom q-TIP4P/F potential energy of a water cluster."
    orchestrator: false
  - number: 3
    name: "03_compute_potential_gradient"
    description: "Evaluate the analytic gradient of the all-atom q-TIP4P/F potential with respect to every atomic coordinate."
    orchestrator: false
  - number: 4
    name: "04_build_reference_configuration"
    description: "Rebuild every monomer of a cluster at the isolated-monomer reference geometry while preserving its centre of mass and its orientation, producing the zeroth-order point of the reference manifold."
    orchestrator: false
  - number: 5
    name: "05_compute_block_hessian"
    description: "Build the mass-scaled second-derivative matrix of the all-atom potential truncated to one diagonal block per monomer."
    orchestrator: false
  - number: 6
    name: "06_build_subspace_pseudoinverse"
    description: "Invert each mass-scaled Hessian block on the subspace spanned by its stiffest eigenvectors only, producing the operator that projects a gradient onto the fast degrees of freedom."
    orchestrator: false
  - number: 7
    name: "07_relax_subspace_newton_raphson"
    description: "Drive the monomers to mechanical equilibrium along their stiff degrees of freedom with a fixed number of Newton-Raphson steps preconditioned by the subspace pseudoinverse."
    orchestrator: false
  - number: 8
    name: "08_compute_stiff_mode_frequencies"
    description: "Extract the stiff normal-mode angular frequencies from each mass-scaled Hessian block."
    orchestrator: false
  - number: 9
    name: "09_compute_stiff_mode_vectors"
    description: "Extract the mass-scaled eigenvectors of the stiff normal modes from each Hessian block, under a fixed sign convention."
    orchestrator: false
  - number: 10
    name: "10_compute_cg_free_energy"
    description: "Add the classical harmonic free energy of the stiff modes to the potential energy of a configuration to obtain the coarse-grained free energy at a given temperature."
    orchestrator: false
  - number: 11
    name: "11_backmap_thermal_configuration"
    description: "Regenerate a canonical all-atom configuration from a relaxed coarse-grained configuration by adding harmonic thermal displacements along the stiff modes."
    orchestrator: false
  - number: 12
    name: "12_run_shr_pipeline"
    description: "Chain the sub-problem functions 01-11 end to end on the cyclic water tetramer and return the ratio of its quantum to its classical dimensionless rigidification penalty."
    orchestrator: true
