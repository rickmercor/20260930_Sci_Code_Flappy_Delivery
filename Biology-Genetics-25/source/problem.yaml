    name: "04_compute_pair_shap_interaction"
    description: "Compute the mean exact pairwise interaction value for a specified feature pair across one or more individuals represented by concatenated complete coalition tables."
    orchestrator: false
  - number: 5
    name: "05_compute_pair_raw_significance"
    description: "Determine the raw statistical significance assigned to one observed pairwise interaction relative to its supplied background interaction distribution."
    orchestrator: false
  - number: 6
    name: "06_locate_pair_background"
    description: "Determine which lexicographically ordered background-distribution row corresponds to a requested unordered feature pair."
    orchestrator: false
  - number: 7
    name: "07_compute_joint_interaction_significance"
    description: "Evaluate the complete unordered feature-pair interaction set and return the multiple-testing-adjusted significance assigned to one requested target pair."
    orchestrator: false
  - number: 8
    name: "08_compute_target_interaction_adjusted_significance"
