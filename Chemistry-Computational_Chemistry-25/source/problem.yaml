paper_doi: "10.1021/jacs.5c22323"
dependencies: ""
steps:
  - number: 1
    name: "basis_table"
    description: "Build the table of contracted atomic orbitals for a diatomic molecule. SPECIFICATION: symbols names the two atoms. basis_data maps an element symbol to a list of shells; each shell is a tuple whose first entry is the angular momentum, 0 for s and 1 for p, whose second entry is a list of exactly three Gaussian exponents and whose third entry is a list of exactly three contraction coefficients. Orbitals are generated by walking the two atoms in the order given and, within each atom, its shells in the order given; an s shell contributes one orbital with cartesian powers (0, 0, 0) and a p shell contributes three, with powers (1, 0, 0), (0, 1, 0) and (0, 0, 1) in that order. For an orbital with powers (lx, ly, lz) and total power L, each coefficient is first multiplied by the primitive normalisation, which is two times the exponent over pi, raised to the power three quarters, times four times the exponent raised to the power L over two, divided by the square root of the product of the double factorials of 2*lx-1, 2*ly-1 and 2*lz-1, where the double factorial of -1 is one. The whole contraction is then divided by the square root of its own self-overlap, which is the sum over both primitives of the product of the two scaled coefficients times pi over the exponent sum raised to the power three halves, times that same product of double factorials, divided by twice the exponent sum raised to the power L. The result is a real array with one row per orbital and ten columns, in this order: the index of the atom carrying the orbital, which is 0 or 1; the three cartesian powers; the three exponents; and the three normalised contraction coefficients."
    orchestrator: false
  - number: 2
    name: "core_integrals"
    description: "Assemble the one-electron matrices over the contracted basis. SPECIFICATION: table is the array returned by the previous step, coords holds the two nuclear positions in bohr with shape (2, 3), and charges holds their two nuclear charges in the same order. Element (i, j) of the overlap matrix is the integral of the product of orbitals i and j; of the kinetic matrix, the integral of orbital i against minus one half of the Laplacian of orbital j; and of the nuclear attraction matrix, the integral of the product of orbitals i and j against the sum over both nuclei of minus the charge divided by the distance to that nucleus. All three are real and symmetric. The result is a real array of shape (3, n, n) holding, in this order, the overlap matrix, the kinetic matrix and the nuclear attraction matrix."
    orchestrator: false
  - number: 3
    name: "electron_repulsion"
    description: "Assemble the two-electron repulsion tensor over the contracted basis. SPECIFICATION: table and coords are as in the previous step. Element (m, n, l, s) is the integral over both electron coordinates of the product of orbitals m and n evaluated at the first electron, times the product of orbitals l and s evaluated at the second, divided by the distance between the two electrons. The result is a real array of shape (n, n, n, n)."
    orchestrator: false
  - number: 4
    name: "descriptor_matrices"
    description: "Build the four geometry and repulsion descriptors the search draws on. SPECIFICATION: table and coords are as before and eri is the tensor returned by the previous step. The distance matrix holds, at (i, j), the distance in bohr between the nucleus carrying orbital i and the nucleus carrying orbital j, so its entries are zero whenever the two orbitals sit on the same atom. The three repulsion slices are, at (m, n), the tensor elements (m, m, n, n), then (m, n, m, n), then (m, n, n, n). The result is a real array of shape (4, n, n) holding, in this order, the distance matrix and those three slices."
    orchestrator: false
  - number: 5
    name: "operand_table"
    description: "Collect the eleven matrices the operations are allowed to use, in their fixed order. SPECIFICATION: core is the array of shape (3, n, n) returned by the one-electron step and descriptors the array of shape (4, n, n) returned by the previous step. The result is a real array of shape (11, n, n) whose entries are, in this order: the overlap matrix; the kinetic matrix; the nuclear attraction matrix; the inverse square root of the overlap matrix; the distance matrix; the element-wise reciprocal of the distance matrix, defined to be zero at every position where the distance itself is zero; the square root of the overlap matrix; and then the three repulsion slices in the order they arrive, followed by the matrix inverse of the overlap matrix. Both the square root and the inverse square root are the symmetric ones, obtained by diagonalising the overlap matrix and raising its eigenvalues to the power one half or minus one half while keeping its eigenvectors."
    orchestrator: false
  - number: 6
    name: "apply_operation"
    description: "Apply one catalogue operation to the workspace matrix. SPECIFICATION: operands is the array of shape (11, n, n) from the previous step and A(k) denotes its k-th entry, counting from zero. Operations are numbered as follows. Ids 0 to 15 combine M with a constant c, adding for ids 0 to 3, subtracting for 4 to 7, multiplying for 8 to 11 and dividing for 12 to 15, with c running over 0.5, 1, 3 and 4 in that order inside each block of four. Ids 16 to 59 combine M element-wise with A(k), adding for 16 to 26, subtracting for 27 to 37, multiplying for 38 to 48 and dividing for 49 to 59, with k running from 0 to 10 in that order inside each block of eleven. Ids 60 to 70 replace M by the matrix product of M with A(k), with k running from 0 to 10. Ids 71 to 114 repeat the four element-wise combinations but against the matrix inverse of A(k), in the same arrangement, so 71 to 81 add, 82 to 92 subtract, 93 to 103 multiply and 104 to 114 divide. Ids 115 to 125 replace M by the matrix product of M with the matrix inverse of A(k). Id 126 applies the exponential to every element, 127 the natural logarithm, 128 raises every element to the power one half, 129 squares every element, and 130 applies the exponential of the negative of every element. Division and the element-wise functions act entry by entry; only the products named as matrix products, and the inverses, are matrix operations. The result is the transformed matrix, of the same shape as M."
    orchestrator: false
  - number: 7
    name: "workspace_matrix"
    description: "Run a whole program and return the symmetrised workspace matrix. SPECIFICATION: the workspace matrix starts as hcore and each entry of program, an integer operation id, is applied to it in order using the rules of the previous step. Once every operation has been applied the matrix is symmetrised by taking L to be its lower triangle including the diagonal and replacing it by L plus the transpose of L minus the diagonal of L, so that the final matrix agrees with the unsymmetrised one on and below the diagonal and is symmetric. An empty program leaves the workspace matrix at hcore before that symmetrisation. The result is a real symmetric array with the same shape as hcore."
    orchestrator: false
  - number: 8
    name: "program_energy"
    description: "Read an electronic energy out of a workspace matrix. SPECIFICATION: solve the generalised eigenvalue problem in which M plays the role of the effective Hamiltonian and S the metric, that is find the coefficients and eigenvalues satisfying M c = S c e. Order the eigenvalues ascending and keep the n_occ eigenvectors with the smallest ones. The density matrix is twice the product of that block of coefficients with its own transpose. The Coulomb matrix has element (m, n) equal to the sum over l and s of the repulsion element (m, n, l, s) times the density element (l, s), and the exchange matrix has element (m, n) equal to the sum over l and s of the repulsion element (m, l, s, n) times the density element (l, s). The Fock matrix is hcore plus the Coulomb matrix minus one half of the exchange matrix. Return one half of the sum over all elements of the density matrix times the sum of hcore and the Fock matrix. Nuclear repulsion is not included."
    orchestrator: false
  - number: 9
    name: "target_function"
    description: "Score a set of predicted energies against the reference curve. SPECIFICATION: species is a sequence of pairs of element symbols, one per geometry, e_pips the predicted total energies and e_ref the reference total energies, both in hartree and in the same order, and e_atom maps an element symbol to its reference atomic energy. For each distinct pair in species, the reference shift is the sum of the two atomic energies of that pair, and the predicted shift is that same sum plus the mean, over just the geometries of that pair, of the predicted energy minus the reference energy. The residual at a geometry is the predicted energy minus its predicted shift, minus the quantity the reference energy minus its reference shift. Return the square root of the mean of the squared residuals taken over every geometry of every pair, multiplied by 627.5094740631 to convert from hartree to kcal/mol."
    orchestrator: false
  - number: 10
    name: "best_two_operation_program"
    description: "Search every two-operation program and report the best one. SPECIFICATION: species is a sequence of pairs of element symbols, one per geometry, bond_lengths the corresponding separations in angstrom, and e_ref the reference total energies in hartree; e_atom and basis_data are as in the earlier steps and charges maps an element symbol to its nuclear charge. At each geometry the first atom sits at the origin and the second on the positive z axis, with the separation converted to bohr by dividing by 0.52917721092; the number of occupied orbitals is half the sum of the two nuclear charges, and the nuclear repulsion is the product of the two charges divided by the separation in bohr. The total predicted energy at a geometry is the electronic energy of the workspace matrix plus that nuclear repulsion. The candidates are every ordered pair of operation ids whose first entry is one of the twenty two matrix products, that is ids 60 to 70 and 115 to 125, and whose second entry is any id from 0 to 130. A candidate is discarded if at any geometry an operation fails, the eigenvalue problem cannot be solved, or the energy is not finite. Among the candidates that survive at every geometry, choose the one with the smallest score, breaking a tie by the smaller first id and then by the smaller second id. Return that smallest score in kcal/mol."
    orchestrator: true
