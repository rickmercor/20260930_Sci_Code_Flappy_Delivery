steps:
  - number: 1
    name: "nonlocal_symbol"
    description: "Return the eigenvalue of the nonlocal operator L_delta of the source, Eq (2.1), acting on the plane wave exp(i xi x), for the radial kernel family of Eq (5.1) with exponent alpha and horizon delta. The kernel is non-integrable for alpha >= 1, so evaluate the defining integral with a quadrature that resolves the algebraic behaviour of the integrand at s = 0 to at least ten significant digits for every 0 < alpha < 3. Raise ValueError if delta is not positive or alpha is not in (0, 3)."
    orchestrator: false
  - number: 2
    name: "l2_projection"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Return the coefficient vector of the L2 projection of the vectorised function fun onto the piecewise-polynomial space of degree k, Eq (3.1) of the source, i.e. on every cell the polynomial whose inner products with P_0..P_k match those of fun; integrate accurately enough that smooth functions are projected to round-off. Raise ValueError if N is not a positive integer, k is not a non-negative integer, or fun does not return an array of the same shape as its input."
    orchestrator: false
  - number: 3
    name: "shift_projection_matrix"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Return the dense matrix that maps the coefficient vector of a function u_h in the degree-k space to the coefficient vector of the L2 projection onto the same space of the shifted function x -> u_h(x + s), s > 0, with u_h continued periodically, i.e. the building block of the operators of Eq (2.5) of the source. The shifted function is itself piecewise polynomial with its own breakpoints, and the projection integrals must be exact, not approximated by a fixed quadrature on the cell. Raise ValueError if N is not a positive integer, k is not a non-negative integer, or s is not positive."
    orchestrator: false
  - number: 4
    name: "nonlocal_dg_operator"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Return the dense matrix B of the semi-discrete DG scheme of the source, Eq (2.6), for the reformulated system (2.4) with the operators of Eq (2.5) and the kernel family of Eq (5.1) with exponent alpha and horizon delta, written as d^2 u/dt^2 = B u for the coefficient vector u of the degree-k solution (the mass matrix already inverted). The auxiliary variable of (2.4) must be represented in the same degree-k space for every interaction distance s; the shifted-projection matrices it needs are supplied by the callable shift_matrix(N, k, s) (the previous step), which must be used for every distance. The integral over s in (0, delta] must be converged to at least eight significant digits, accounting for the singular kernel and the breakpoints of the integrand at multiples of h. Raise ValueError if N is not a positive integer, k is not a non-negative integer, delta is not positive, alpha is not in (0, 3), or shift_matrix is not callable."
    orchestrator: false
  - number: 5
    name: "discrete_energy"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Given two consecutive coefficient vectors u_new = u^{n+1} and u_old = u^n of the fully discrete scheme with time step ht, and the operator matrix B of the previous step (d^2 u/dt^2 = B u), return the fully discrete energy of Theorem 4.1 of the source: the squared L2 norm of the difference quotient (u^{n+1} - u^n)/ht plus the nonlocal energy of the two states, each expressed through B and the mass matrix. Raise ValueError if ht is not positive, if N or k is invalid, or if the vectors and B do not match N*(k+1)."
    orchestrator: false
  - number: 6
    name: "crank_nicolson_march"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Advance the semi-discrete system d^2 u/dt^2 = B u from the coefficient vector u0 at t = 0 with zero initial velocity over nsteps uniform steps of size ht using the two-level Crank-Nicolson scheme of Eq (4.1) of the source (second-order central difference in time, the operator applied to the source's time average of the auxiliary states). Start the two-step recursion as the task statement prescribes for zero initial velocity: the fictitious value at t = -ht equals the value at t = +ht, and the scheme at n = 0 then determines u^1. Return a (2, N*(k+1)) array whose first row is u at t = nsteps*ht and whose second row is u at t = (nsteps-1)*ht. Raise ValueError if ht is not positive, nsteps is not a positive integer, N or k is invalid, or the sizes do not match."
    orchestrator: false
  - number: 7
    name: "gauss_lobatto_l2_error"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Return the L2 error between the vectorised reference function fun and the degree-k DG function with coefficient vector coef, evaluated exactly as the source does in Section 5: on every cell a (k+3)-point Gauss-Lobatto rule (end points included) applied to the squared pointwise difference, summed over cells, square root taken. Raise ValueError if N or k is invalid, coef does not have N*(k+1) entries, or fun does not return an array of the input's shape."
    orchestrator: false
  - number: 8
    name: "nonlocal_wave_dg_l2_error"
    description: "Discretisation conventions used throughout: the domain is (0, 1) with periodic continuation, N uniform cells I_j = ((j-1)h, jh), h = 1/N, j = 1..N, local coordinate xi = 2 (x - x_j)/h in [-1, 1] with x_j the cell centre, modal basis P_0, ..., P_k (Legendre polynomials, not normalised) on every cell, and coefficient vectors stored cell-major: entry j*(k+1) + m is the coefficient of P_m on cell j+1 (0-based j). Orchestrator. Solve the nonlocal wave equation of Eq (2.1) of the source on the periodic unit interval with the kernel family of Eq (5.1) (exponent alpha, horizon delta), initial data u(x,0) = sin(2 pi x) + cos(4 pi x)/2 and zero initial velocity, with the DG scheme of Eq (2.6) of degree k on N cells and the Crank-Nicolson scheme of Eq (4.1) with step ht up to time T. Project the initial data (step 2), assemble the operator (step 4, which uses step 3), march in time (step 6), verify with step 5 that the discrete energy after the first step and after the last step agree to a relative 1e-9 (raise ValueError otherwise), build the exact solution of the nonlocal problem from the eigenvalues of step 1 for the two modes present, and return the Gauss-Lobatto L2 error of step 7 at time T. Call the earlier step functions rather than reimplementing them. Raise ValueError if T is not a positive integer multiple of ht or any argument is invalid."
    orchestrator: true
