steps:
  - number: 1
    name: "01_parameterise_hierarchical_lognormals"
    description: "The output contains the Gaussian parameters of their logarithms in the column order $(m_{r,j}, s_{r,j}, m_{K,j}, s_{K,j})$."
    orchestrator: false
  - number: 2
    name: "02_compute_shared_environment_integral"
    description: "Each cell obeys $\\dot P_i=r_ics(1-P_i/K_i)u(t)$ while the shared environment obeys $\\dot u=-\\frac{1}{N}\\sum_i\\frac{r_ics}{V}(1-P_i/K_i)u(t)$, so summing the two gives $u(t)=u_0-\\frac{1}{N}\\sum_iP_i(t)/V$: the mean free-particle density at a node is the pilot average of $u_0-P_q(t)/V$. Evaluate each pilot on its own, as a population in which every cell shares that pilot's rate and capacity, so that $P_q(t)$ is the exact trajectory of that homogeneous population. At each fine-grid node, including $t=0$, draw the $N_{\\mathrm{prep}}$ pilot association rates as one vector and then the $N_{\\mathrm{prep}}$ pilot carrying capacities as one vector, in that order, without reseeding. Integrate the resulting $\\bar u$ by the trapezoidal rule and return $I(t)$ at the requested times."
    orchestrator: false
  - number: 3
    name: "03_simulate_hierarchical_fluorescence"
    description: "The shared environmental integral is supplied by the preceding stage. Individual cells draw association rates and carrying capacities from replicate-specific log-normal laws, then convert continuous particle counts to empirical fluorescence."
    orchestrator: false
  - number: 4
    name: "04_compute_snapshot_discrepancy"
    description: "The total discrepancy is the unnormalised sum of Anderson-Darling distances over all matching replicate-time pairs."
    orchestrator: false
  - number: 5
    name: "05_evaluate_hierarchical_prior_and_proposal"
    description: "The adaptive Gaussian random walk is based on $(2.38^2/d)$ times the empirical particle covariance and is factorised through a dimensionless correlation matrix with relative diagonal jitter $10^{-12}$, including for zero-variance coordinates."
    orchestrator: false
  - number: 6
    name: "06_advance_abc_smc_population"
    description: "The update sorts particles by discrepancy, retains the best fraction, resamples the remainder, constructs the scale-aware Gaussian random-walk covariance, estimates a trial acceptance rate, and applies the adaptive number of ABC-MCMC moves."
    orchestrator: false
  - number: 7
    name: "07_run_hierarchical_affinity_benchmark"
    description: "Run the complete two-population hierarchical affinity ABC-SMC benchmark."
    orchestrator: true
