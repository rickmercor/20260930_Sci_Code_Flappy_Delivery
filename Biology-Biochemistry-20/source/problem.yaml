problem_id: "Biology-Biochemistry-20"
subject: "biology"
subject_area: "Biochemistry"
difficulty: "difficult"
answer_type: "single_numeric"
paper_doi: "https://doi.org/10.48550/arXiv.2512.24427"
dependencies: ""
steps:
  - number: 1
    name: "01_solve_epigenetic_equilibria"
    description: "Locate every equilibrium of a gene class's slow chromatin-mark flow and report the linear rate at which the flow grows or decays about each one."
    orchestrator: false
  - number: 2
    name: "02_settle_starting_marks"
    description: "Sort the starting chromatin marks of a gene class into the basins of its slow flow and return the constant regulatory input each occupied attractor carries together with the fraction of the class that settles there."
    orchestrator: false
  - number: 3
    name: "03_average_correlation_overlap"
    description: "Evaluate, at a set of correlation lag values, the population-weighted three-Gaussian pair average of the saturating response for an ensemble of constant regulatory inputs."
    orchestrator: false
  - number: 4
    name: "04_average_gain_overlap"
    description: "Evaluate, at a set of correlation lag values, the population-weighted three-Gaussian pair average of the response slope for an ensemble of constant regulatory inputs."
    orchestrator: false
  - number: 5
    name: "05_average_potential_overlap"
    description: "Evaluate, at a set of correlation lag values, the population-weighted three-Gaussian pair average of the log-cosh response integral for an ensemble of constant regulatory inputs."
    orchestrator: false
  - number: 6
    name: "06_solve_frozen_correlation"
    description: "Solve the self-consistency condition of a time-independent collective state for the equal-time correlation of the disorder-induced part of a gene's regulatory input."
    orchestrator: false
  - number: 7
    name: "07_locate_correlation_hilltop"
    description: "Find the lowest interior maximum of the effective potential that governs the autocorrelation of the disorder-induced input, for a given equal-time correlation."
    orchestrator: false
  - number: 8
    name: "08_solve_decaying_correlation"
    description: "Solve for the equal-time correlation and the infinite-lag limit of a decaying autocorrelation, the solution that starts at rest and climbs asymptotically onto a hilltop of the effective potential."
    orchestrator: false
  - number: 9
    name: "09_trace_decay_trajectory"
    description: "Trace the decaying autocorrelation of the disorder-induced input as a function of lag time, from its equal-time value down onto the hilltop of the effective potential."
    orchestrator: false
  - number: 10
    name: "10_solve_fluctuation_ground_state"
    description: "Step name: Return the bound-state ground energy of the one-dimensional fluctuation operator for an even-lag potential, matching the sampled well to its constant long-lag plateau."
    orchestrator: false
  - number: 11
    name: "11_compute_settled_lyapunov_exponent"
    description: " Compose every earlier step to obtain the largest Lyapunov exponent of the long-time collective state of a heterogeneous gene population whose chromatin marks have settled."
    orchestrator: true
