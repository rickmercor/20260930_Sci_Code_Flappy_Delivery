steps:
  - number: 1
    name: "01_void_fields"
    description: "Construct dimensionless density ratio and peculiar-velocity divergence on an integer grid. For coordinates p=(i,j,k), use s(p)=min_a sum_b ((p_b-centers[a,b])/scales[a,b])**2, density ratio 1-0.92 exp(-s) and divergence 1.2-s+0.000001*(i+n*j+n*n*k). The full additive term participates in all subsequent comparisons. Accept an integer grid side from 5 through 65, nonempty real center and scale arrays of equal shape (m,3), centers inside [0,n-1] and scales inside [0.25,n]. Return two float arrays of shape (n,n,n), with axes ordered x,y,z. Invalid inputs raise ValueError."
    orchestrator: false
  - number: 2
    name: "02_void_candidates"
    description: "Select potential cosmic-void seeds from density ratio and divergence. A cell is a candidate when density_ratio-1 is strictly below density_threshold and divergence is strictly positive, independently of the later growth divergence threshold. Return integer coordinate rows (i,j,k) in decreasing divergence order, breaking ties by ascending lexicographic (k,j,i). Inputs are finite real cubic arrays of identical shape with side 5 through 65 and nonnegative density ratio; density_threshold is a finite real scalar. An empty selection has shape (0,3). Invalid inputs raise ValueError."
    orchestrator: false
  - number: 3
    name: "03_face_barriers"
    description: "Construct six outward growth barriers on a nonperiodic cubic grid with unit index spacing. Return an integer array with shape (3,2,n,n,n), where axis a is x, y or z and direction index 0 means minus while 1 means plus. A current face cell p tests its neighbor t=p+s*e_a. It is blocked when the outward centered density derivative [density_ratio(t+s*e_a)-density_ratio(t-s*e_a)]/2 is at least gradient_threshold, divergence(t) is below divergence_threshold or density_ratio(t)-1 is at least density_threshold. Current coordinates at most 1 on a minus face or at least n-2 on a plus face are blocked. There is no gradient lookahead. Fields are finite real cubic arrays of equal shape with side 5 through 65 and nonnegative density ratio; thresholds are finite real scalars and gradient_threshold is nonnegative. Invalid inputs raise ValueError."
    orchestrator: false
  - number: 4
    name: "04_grow_void_cubes"
    description: "Grow isotropic cubes from an already ordered list of seed cells using six face-barrier arrays. The barrier shape is (3,2,n,n,n), with n from 5 through 65, axes x,y,z and direction indices minus then plus. Seeds are distinct integer coordinate rows of shape (m,3) inside the grid. Visit them in the supplied order, skipping a seed with any coordinate at most 1 or at least n-2 or inside an accepted cube. Start radius r=0. Before every trial reject the whole cube if any current bound is at most 1 or at least n-2. Otherwise inspect every barrier on its six current square faces, with transverse coordinates spanning only the current cube. Any barrier terminates growth at r; no barriers increases r by one along all axes together. Reject terminal radius zero, append each other cube as (i,j,k,r) and mark its inclusive box for subsequent seed exclusion. Marking does not prohibit cube overlap. Return an integer (q,4) array in acceptance order. Empty output has shape (0,4); invalid arrays raise ValueError."
    orchestrator: false
  - number: 5
    name: "05_merge_void_cubes"
    description: "Assign cubic primitives to nonpercolating void owners in one fixed forward pass. Input cubes are integer rows (i,j,k,r) in acceptance order, with nonnegative radius and inclusive boxes contained in a cubic grid of integer side n from 5 through 65. Sort by decreasing raw cell volume (2r+1)**3, breaking ties by input row. Labels are input row plus one. Start an empty ownership grid, unset cube owners and false major flags. At each cube's turn use its existing owner if assigned; otherwise inspect owned cells within its box expanded by one and clamped to the grid, choosing the cell nearest its seed by squared Euclidean index distance with ties in ascending (k,j,i). If there is no such cell, make the cube its own permanent major. Paint the current unexpanded box only into zero cells. Then scan all other cubes in fixed volume order; skip majors and assigned cubes, and immediately assign and paint any cube whose box and the current cube's box EACH expanded by one intersect on all three axes. Absorbed cubes also perform this sweep at their own turn using their original bounds. Return the integer ownership grid, with zero for unowned cells. Empty cubes must have shape (0,4). Invalid inputs raise ValueError."
    orchestrator: false
  - number: 6
    name: "06_owned_void_volume"
    description: "Measure the largest void from its unique cell ownership map. Accept a nonnegative integer cubic array with side 5 through 65 and labels at most the number of grid cells. Ignore label zero, count each positive label and multiply the maximum count by cell_side**3; no positive label gives zero. The physical cell side is a finite nonnegative real scalar. Return a native float in cubic length units, raising ValueError for invalid inputs or a positive volume outside the finite float range."
    orchestrator: false
  - number: 7
    name: "07_largest_void"
    description: "Compose the synthetic fields, candidate ordering, face barriers, isotropic cube growth, ordered merge and ownership-volume measurement. Use density ratio 1-0.92 exp(-s) and divergence 1.2-s+0.000001*(i+n*j+n*n*k), where s is the minimum scaled squared distance over supplied wells. Candidate contrast threshold is -0.6 with strictly positive divergence. Face thresholds are gradient 0.25, contrast 10 and divergence 0; gradient lookahead is off and derivatives use unit index spacing. Cube growth rejects current bounds at most 1 or at least n-2 and rejects radius zero. Merge uses both boxes expanded by one, fixed descending raw-volume order with acceptance-order ties, nearest-cell adoption, permanent majors and first-assignment ownership. Return the maximum owned-cell count times cell_side**3 before radius cuts or cavity filling. Accept integer n from 5 through 65, nonempty (m,3) real centers in [0,n-1], matching scales in [0.25,n] and finite nonnegative cell_side. Invalid inputs or unrepresentable final volumes raise ValueError."
    orchestrator: true
