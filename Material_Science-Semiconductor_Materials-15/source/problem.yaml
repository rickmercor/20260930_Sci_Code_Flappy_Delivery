steps:
  - number: 1
    name: "characteristic_lengths"
    description: "Compute the effective Bohr radius and the TO-phonon oscillator length of a 2D polar monolayer."
    orchestrator: false
  - number: 2
    name: "coupling_constant"
    description: "Evaluate the effective 2D Frohlich coupling constant that measures the electron-phonon interaction strength."
    orchestrator: false
  - number: 3
    name: "dimensionless_ratios"
    description: "Form the two dimensionless screening/oscillator ratios that parameterise the 2D polaron integrals."
    orchestrator: false
  - number: 4
    name: "weak_coupling_integral"
    description: "Evaluate the dimensionless weak-coupling momentum integral of the 2D polaron energy."
    orchestrator: false
  - number: 5
    name: "weak_coupling_mass_integral"
    description: "Evaluate the dimensionless weak-coupling (LLP) mass integral of the 2D polaron."
    orchestrator: false
  - number: 6
    name: "weak_coupling_observables"
    description: "Assemble the weak-coupling polaron binding energy and LLP effective mass from the coupling constant and the dimensionless integrals."
    orchestrator: false
  - number: 7
    name: "feynman_integral"
    description: "Evaluate the dimensionless electron-phonon integral of the all-coupling Feynman variational energy."
    orchestrator: false
  - number: 8
    name: "feynman_mass_integral"
    description: "Evaluate the dimensionless Feynman mass integral that renormalises the 2D polaron effective mass."
    orchestrator: false
  - number: 9
    name: "polaron_effective_mass"
    description: "Assemble the all-coupling pipeline and return the full Feynman polaron effective mass of a 2D polar monolayer."
    orchestrator: true
